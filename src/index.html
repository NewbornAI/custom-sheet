        if (saved[k] !== undefined && saved[k] !== null && typeof saved[k] === typeof SPELL_DEFAULTS[k]) s[k] = saved[k];
      });
      if (saved.classes) { s.classes = {}; Object.keys(saved.classes).forEach(function (k) { s.classes[k] = !!saved.classes[k]; }); }
      if (saved.levelFilter !== undefined) s.levelFilter = !!saved.levelFilter;
      if (saved.max) { s.max = {}; Object.keys(SPELL_DEFAULTS.max).forEach(function (k) { s.max[k] = Number(saved.max[k]) || 0; }); }
      if (saved.left) { s.left = {}; Object.keys(SPELL_DEFAULTS.left).forEach(function (k) { s.left[k] = Number(saved.left[k]) || 0; }); }
    }
    var lists = {};
    LEVELS.forEach(function (lv) {
      var seed = SPELL_SEED.filter(function (n) {
        var s = SPELL_BY_NAME[n];
        return s && s.level === lv;
      });
      var own = (saved.lists && saved.lists[lv]) || null;
      lists[lv] = (own && own.length) ? own.filter(function (n) { return SPELL_BY_NAME[n]; }) : seed;
    });
    s.lists = lists;
    return s;
  }

  /* A proficiency is a number: 0 none, 1 proficient, 2 expertise. The state
     saved before the three states existed held a boolean, so it comes back
     as a plain proficiency. */
  function profValue(value) {
    if (value === true) return 1;
    if (value === false || value === undefined || value === null) return 0;
    var n = Number(value) || 0;
    if (n < 0) return 0;
    if (n > 2) return 2;
    return Math.floor(n);
  }

  /* The character, with the saved values over the defaults. */
  function seedChar(saved) {
    var c = {
      name: '',
      level: CHAR_DEFAULTS.level,
      abilities: {},
      saves: {},
      skills: {},
      features: CHAR_DEFAULTS.features.map(function (f) {
        return {
          key: f.key,
          name: f.name,
          recovery: f.recovery,
          bind: f.bind || null,
          max: f.max || 0,
          left: f.left || 0,
          short: (f.short === undefined || f.short === null) ? null : f.short,
          hidden: !!f.hidden
        };
      }),
      init: CHAR_DEFAULTS.init,
      ac: CHAR_DEFAULTS.ac,
      hp: { current: 0, max: 0 },
      history: []
    };
    ABILITIES.forEach(function (a) {
      c.abilities[a.key] = CHAR_DEFAULTS.abilities[a.key];
      c.saves[a.key] = CHAR_DEFAULTS.saves[a.key];
    });
    SKILLS.forEach(function (s) { c.skills[s.key] = false; });
    if (saved && typeof saved === 'object') {
      if (typeof saved.name === 'string') c.name = saved.name;
      if (saved.level) c.level = Math.max(1, Math.min(20, Number(saved.level) || CHAR_DEFAULTS.level));
      if (saved.init !== undefined && saved.init !== null) c.init = Number(saved.init) || 0;
      if (saved.ac !== undefined && saved.ac !== null && saved.ac !== '') c.ac = Number(saved.ac) || 0;
      ABILITIES.forEach(function (a) {
        if (saved.abilities && saved.abilities[a.key] !== undefined && saved.abilities[a.key] !== null) {
          c.abilities[a.key] = Math.max(0, Math.min(30, Number(saved.abilities[a.key]) || 0));
        }
        if (saved.saves && saved.saves[a.key] !== undefined) c.saves[a.key] = profValue(saved.saves[a.key]);
      });
      SKILLS.forEach(function (s) {
        if (saved.skills && saved.skills[s.key] !== undefined) c.skills[s.key] = profValue(saved.skills[s.key]);
      });
      if (saved.hp) {
        c.hp.current = Math.max(0, Number(saved.hp.current) || 0);
        c.hp.max = Math.max(0, Number(saved.hp.max) || 0);
      }
      if (saved.features && saved.features.length) {
        c.features = saved.features.map(function (f) {
          return {
            key: String(f.key || ''),
            name: String(f.name || 'Feature'),
            recovery: f.recovery === 'short' || f.recovery === 'long' ? f.recovery : 'none',
            bind: f.bind === 'warlock' ? 'warlock' : null,
            max: Math.max(0, Number(f.max) || 0),
            left: Math.max(0, Number(f.left) || 0),
            short: (f.short === undefined || f.short === null) ? null : Math.max(0, Number(f.short) || 0),
            hidden: !!f.hidden
          };
        });
      }
      if (saved.history && saved.history.length) {
        c.history = saved.history.filter(function (h) { return h && typeof h === 'object'; }).slice(-60);
      }
    }
    return c;
  }

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
  }

  function setState(patch) {
    Object.keys(patch).forEach(function (k) { state[k] = patch[k]; });
    if (!state.elem) state.elemPlus = false;
    volley = null;
    save();
    render();
  }

  /* ---- controls ---- */

  el.power.addEventListener('input', function () {
    var p = R.POWERS[Number(el.power.value)];
    setState({ power: p.id });
  });

  el.ac.addEventListener('input', function () {
    var v = el.ac.value.trim();
    setState({ ac: v === '' ? null : Number(v) });
  });

  R.POWERS.forEach(function (p, i) {
    var stop = document.createElement('button');
    stop.type = 'button';
    stop.className = 'stop';
    stop.textContent = p.short;
    stop.style.left = 'calc(13px + (100% - 26px) * ' + (i / (R.POWERS.length - 1)) + ')';
    stop.addEventListener('click', function () {
      el.power.value = String(i);
      setState({ power: p.id });
    });
    el.stops.appendChild(stop);
  });

  CHIPS.forEach(function (chip) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.dataset.key = chip.key;
    b.textContent = chip.label;
    b.style.setProperty('--crgb', chip.rgb);
    b.addEventListener('click', function () {
      var next = !state[chip.key];
      var patch = {};
      patch[chip.key] = next;
      if (chip.key === 'elem' && !next) patch.elemPlus = false;
      setState(patch);
    });
    el.chips.appendChild(b);
  });

  el.tabVolley.addEventListener('click', function () { setView('volley'); });
  el.tabSurge.addEventListener('click', function () { setView('surge'); });
  el.tabSpells.addEventListener('click', function () { setView('spells'); });
  el.tabChar.addEventListener('click', function () { setView('char'); });

  el.cast.addEventListener('click', function () {
    if (view === 'surge') { castSurge(); return; }
    volley = R.rollVolley(state);
    renderBoard(true);
    renderTally();
    var anyCrit = volley.beams.some(function (b) { return b.crit; });
    if (navigator.vibrate) navigator.vibrate(anyCrit ? [14, 45, 18] : 16);
  });

  /* ---- rendering ---- */

  function elemLabel() {
    if (!state.elem) return 'Elem';
    return state.elemPlus ? 'Elem 3d8' : 'Elem 2d8';
  }

  function setView(next) {
    view = next;
    el.viewVolley.classList.toggle('on', next === 'volley');
    el.viewSurge.classList.toggle('on', next === 'surge');
    el.viewSpells.classList.toggle('on', next === 'spells');
    el.viewChar.classList.toggle('on', next === 'char');
    el.tabVolley.setAttribute('aria-selected', next === 'volley' ? 'true' : 'false');
    el.tabSurge.setAttribute('aria-selected', next === 'surge' ? 'true' : 'false');
    el.tabSpells.setAttribute('aria-selected', next === 'spells' ? 'true' : 'false');
    el.tabChar.setAttribute('aria-selected', next === 'char' ? 'true' : 'false');
    el.acField.style.visibility = next === 'volley' ? 'visible' : 'hidden';
    el.wrench.hidden = next !== 'spells' && next !== 'char';
    el.cast.hidden = next === 'spells' || next === 'char';
    el.castLabel.textContent = next === 'volley' ? 'Cast' : 'Surge';
    render();
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function castSurge() {
    if (!SURGE.rows || !SURGE.rows.length) {
      el.surgeText.textContent = 'The surge table did not load.';
      return;
    }
    var result = R.rollSurge(SURGE.rows);
    el.surgeRoll.textContent = result.roll;
    el.surgeRange.textContent = pad2(result.from) + '-' + pad2(result.to);
    el.surgeText.textContent = result.text;
    var html = '';
    result.dice.forEach(function (d) {
      html += '<span class="g"><span class="lbl">' + d.label + '</span>';
      html += '<span class="roll">' + d.values.join(',') + '</span>';
      html += '<span class="stot">= ' + d.total + '</span></span>';
    });
    el.surgeDice.innerHTML = html;
    if (navigator.vibrate) navigator.vibrate(result.dice.length ? [14, 45, 14] : 16);
  }

  function render() {
    var power = R.powerOf(state.power);

    el.spellName.textContent = view === 'volley' ? power.name
      : (view === 'surge' ? 'Wild magic surge'
      : (view === 'spells' ? 'Spells' : (state.char.name || 'Character')));
    el.power.value = String(R.POWERS.indexOf(power));
    var span = Number(el.power.max) - Number(el.power.min);
    el.power.style.setProperty('--fill', (span ? (Number(el.power.value) - Number(el.power.min)) / span * 100 : 0) + '%');

    Array.prototype.forEach.call(el.stops.children, function (s, i) {
      s.classList.toggle('on', R.POWERS[i].id === power.id);
    });

    Array.prototype.forEach.call(el.chips.children, function (b) {
      var key = b.dataset.key;
      var chip = CHIPS.filter(function (c) { return c.key === key; })[0];
      b.setAttribute('aria-pressed', state[key] ? 'true' : 'false');
      if (key === 'elem') b.textContent = elemLabel();
      if (chip.needs) b.hidden = !state[chip.needs];
    });

    if (el.ac.value !== (state.ac === null ? '' : String(state.ac))) {
      el.ac.value = state.ac === null ? '' : String(state.ac);
    }

    el.wrench.setAttribute('aria-pressed', (view === 'char' ? editingChar : editing) ? 'true' : 'false');
    el.wrench.setAttribute('aria-label', view === 'char' ? 'Edit the proficiencies' : 'Edit the slot maximums');

    renderSummary();
    renderBoard(false);
    renderTally();
    renderSpells();
    renderChar();
  }

  function renderBoard(animate) {
    var power = R.powerOf(state.power);
    var n = power.attacks;
    el.grid.style.setProperty('--cols', n === 4 ? '2' : '3');
    el.grid.innerHTML = '';

    for (var i = 0; i < n; i++) {
      var beam = volley ? volley.beams[i] : null;
      var cell = document.createElement('article');
      cell.className = 'cell';
      var preview = beam ? beam.groups : previewGroups();
      cell.style.setProperty('--beam', TYPE_RGB[preview[0] ? preview[0].type : 'force'] || '155,123,255');
      if (!animate) cell.style.animation = 'none';
      cell.style.setProperty('--i', String(i));
      if (beam) {
        if (beam.crit) cell.classList.add('crit');
        if (beam.hit === false) cell.classList.add('miss');
      } else {
        cell.classList.add('ghost');
      }
      cell.innerHTML = cellHtml(beam);
      el.grid.appendChild(cell);
    }
  }

  var TYPE_RGB = {
    force: '110,155,255',
    fire: '255,132,70',
    lightning: '255,212,71',
    necrotic: '122,216,111'
  };

  function renderSummary() {
    var power = R.powerOf(state.power);
    var beams = power.attacks + ' beam' + (power.attacks === 1 ? '' : 's');
    var attack = state.advantage
      ? 'attack 3d20+' + R.ATTACK_MOD + ' keep best'
      : 'attack d20+' + R.ATTACK_MOD;
    var crit = state.curse ? 'crit on 19-20' : 'crit on 20';

    var bits = [];
    power.dice.forEach(function (d, i) {
      bits.push(d.n + 'd' + d.s + (i === 0 && power.flat ? '+' + power.flat : '') +
        ' <em class="' + d.type + '">' + d.type + '</em>');
    });
    if (state.hex) bits.push('1d6 <em class="necrotic">necrotic</em>');
    var light = 0;
    if (state.elem) light = state.elemPlus ? 3 : 2;
    if (light) bits.push(light + 'd8 <em class="lightning">lightning</em>');
    if (state.curse) bits.push('+4');

    el.summary.innerHTML =
      '<span>' + beams + ' &middot; ' + attack + ' &middot; ' + crit + '</span>' +
      '<span>damage ' + bits.join(' + ') + '</span>';
  }

  function previewGroups() {
    var power = R.powerOf(state.power);
    var groups = [];
    power.dice.forEach(function (d) { groups.push({ label: d.n + 'd' + d.s, type: d.type }); });
    if (state.hex) groups.push({ label: '1d6', type: 'necrotic' });
    if (state.elem) groups.push({ label: state.elemPlus ? '3d8' : '2d8', type: 'lightning' });
    return groups;
  }

  function cellHtml(beam) {
    if (!beam) {
      var groups = previewGroups();
      var types = [];
      groups.forEach(function (g) { if (types.indexOf(g.type) === -1) types.push(g.type); });
      var flat = R.powerOf(state.power).flat + (state.curse ? 4 : 0);
      var out = '<div class="atk"><span class="at ghostnum">d20</span><span class="am">+' + R.ATTACK_MOD + '</span></div>';
      out += '<div class="d20"><span class="ghostroll">--</span></div>';
      out += '<div class="beam"></div>';
      out += '<div class="dmg"><div class="dtop"><span class="dt ghostnum">--</span><span class="kinds">';
      types.forEach(function (t) { out += '<em class="' + t + '">' + t + '</em>'; });
      out += '</span></div><div class="dice">';
      groups.forEach(function (g) {
        out += '<span class="g"><span class="lbl ' + g.type + '">' + g.label + '</span>';
        out += '<span class="roll ghostroll">--</span></span>';
      });
      if (flat) out += '<span class="g flat"><span class="lbl">+' + flat + '</span></span>';
      out += '</div></div>';
      return out;
    }

    var out = '<div class="atk">';
    out += '<span class="at">' + beam.total + '</span>';
    out += '<span class="am">+' + R.ATTACK_MOD + '</span>';
    if (beam.crit) out += '<span class="badge crit">crit</span>';
    else if (beam.hit === true) out += '<span class="badge hit">hit</span>';
    else if (beam.hit === false) out += '<span class="badge miss">miss</span>';
    out += '</div>';

    out += '<div class="d20">';
    beam.rolls.forEach(function (r) {
      out += '<span' + (r === beam.kept && beam.rolls.length > 1 ? ' class="kept"' : '') + '>' + r + '</span>';
    });
    out += '</div>';
    out += '<div class="beam"></div>';

    var types = [], i;
    for (i = 0; i < beam.groups.length; i++) {
      if (types.indexOf(beam.groups[i].type) === -1) types.push(beam.groups[i].type);
    }

    out += '<div class="dmg"><div class="dtop"><span class="dt">' + beam.damage + '</span><span class="kinds">';
    types.forEach(function (t) { out += '<em class="' + t + '">' + t + '</em>'; });
    out += '</span></div>';

    out += '<div class="dice">';
    beam.groups.forEach(function (g) {
      out += '<span class="g"><span class="lbl ' + g.type + '">' + g.label + '</span>';
      out += '<span class="roll' + (g.rolls.length > 3 ? ' tight' : '') + '">' + g.rolls.join(',') + '</span></span>';
    });
    if (beam.flat) out += '<span class="g flat"><span class="lbl">+' + beam.flat + '</span></span>';
    out += '</div></div>';

    return out;
  }

  function renderTally() {
    if (!volley) {
      el.tally.innerHTML = state.ac === null
        ? '<span style="color:#615c7d">No target AC set, so damage shows for every beam</span>'
        : '';
      return;
    }
    var t = R.tally(volley, state.ac);
    var out = '<span class="big">' + t.total + '</span><span>damage</span>';
    if (state.ac !== null) {
      out += '<span>&middot; ' + t.hits + ' hit' + (t.hits === 1 ? '' : 's');
      if (t.crits) out += ' &middot; ' + t.crits + ' crit' + (t.crits === 1 ? '' : 's');
      out += '</span>';
    }
    t.order.forEach(function (type) {
      out += '<em class="' + type + '">&middot; ' + t.byType[type] + ' ' + type + '</em>';
    });
    if (t.flat) out += '<em>&middot; ' + t.flat + ' flat</em>';
    el.tally.innerHTML = out;
  }

  /* ---- spells ---- */

  var editing = false;
  var dragged = false;

  function commit() { save(); render(); }

  function pipButton(full, lv, n, warlock) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'pip' + (warlock ? ' wl' : '') + (full ? ' full' : '');
    b.dataset.lv = String(lv);
    b.dataset.n = String(n);
    if (warlock) b.dataset.wl = '1';
    b.setAttribute('aria-label', (warlock ? 'Warlock slot ' : 'Slot ') + n);
    return b;
  }

  function editButton(sign, lv, warlock) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'mini';
    b.textContent = sign;
    b.dataset.edit = sign === '+' ? 'add' : 'take';
    b.dataset.lv = String(lv);
    if (warlock) b.dataset.wl = '1';
    return b;
  }

  function renderLevels() {
    var S = state.spell;
    el.levels.innerHTML = '';
    el.levels.classList.toggle('editing', editing);

    /* How many slots each level holds, so the columns can share the width
       and every slot can be the same size in the whole strip. */
    var counts = LEVELS.map(function (lv) {
      return (S.max[lv] || 0) + (lv === WARLOCK_LEVEL ? (S.warlockMax || 0) : 0);
    });
    var busiest = Math.max.apply(null, counts) || 1;
    var pipH = Math.max(9, Math.min(16, Math.floor((120 - (busiest - 1) * 2) / busiest)));
    el.levels.style.setProperty('--pip-h', pipH + 'px');

    LEVELS.forEach(function (lv, ix) {
      var max = S.max[lv] || 0;
      var left = Math.min(S.left[lv] || 0, max);
      var col = document.createElement('div');
      col.className = 'lv' + (lv === S.selected ? ' on' : '') + (editing ? ' editing' : '');
      if (lv > 0 && !counts[ix]) col.classList.add('dim');
      col.dataset.lv = String(lv);
      col.style.flexGrow = String(Math.max(1, counts[ix]));

      if (lv > 0) {
        var bolt = document.createElement('button');
        bolt.type = 'button';
        bolt.className = 'bolt';
        bolt.dataset.bolt = String(lv);
        bolt.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">' +
          '<path d="M13.6 2L4.2 13.4h5.4L9.6 22 19.4 10.2H14L13.6 2z"/></svg>';
        var hasSlot = S.left[lv] > 0 || (lv === WARLOCK_LEVEL && S.warlockLeft > 0);
        var why = S.sp >= S.spMax
          ? 'Your sorcery points are full'
          : (!hasSlot ? 'No level ' + lv + ' slot left' : '');
        bolt.setAttribute('aria-label', 'Turn a level ' + lv + ' slot into ' + lv + ' sorcery points' + (why ? ', ' + why : ''));
        bolt.title = why || ('Turn a level ' + lv + ' slot into ' + lv + ' sorcery points');
        bolt.disabled = !!why;
        col.appendChild(bolt);
      } else {
        var space = document.createElement('span');
        space.className = 'boltspace';
        col.appendChild(space);
      }

      var head = document.createElement('span');
      head.className = 'head';
      var n = document.createElement('span');
      n.className = 'n';
      n.textContent = String(lv);
      head.appendChild(n);
      col.appendChild(head);

      var pips = document.createElement('span');
      pips.className = 'pips';
      for (var i = 1; i <= max; i++) pips.appendChild(pipButton(i <= left, lv, i, false));
      if (lv === WARLOCK_LEVEL && S.warlockMax) {
        var wlGroup = document.createElement('span');
        wlGroup.className = 'wlgroup';
        for (var w = 1; w <= S.warlockMax; w++) wlGroup.appendChild(pipButton(w <= S.warlockLeft, lv, w, true));
        pips.appendChild(wlGroup);
      }
      col.appendChild(pips);

      var down = document.createElement('button');
      down.type = 'button';
      down.className = 'down';
      down.dataset.lv = String(lv);
      down.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
        'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
        '<path d="M6 9.5l6 6 6-6"/></svg>';
      down.setAttribute('aria-label', 'Show the spells of level ' + lv);
      down.title = 'Show the spells of level ' + lv;
      col.appendChild(down);

      var edit = document.createElement('span');
      edit.className = 'edit';
      if (lv > 0) {
        edit.appendChild(editButton('-', lv, false));
        edit.appendChild(editButton('+', lv, false));
      }
      if (lv === WARLOCK_LEVEL && S.warlockMax) {
        var wl = document.createElement('span');
        wl.className = 'plus';
        wl.textContent = 'W';
        edit.appendChild(wl);
        edit.appendChild(editButton('-', lv, true));
        edit.appendChild(editButton('+', lv, true));
      }
      col.appendChild(edit);

      el.levels.appendChild(col);
    });

    if (editing) {
      var cell = document.createElement('div');
      cell.className = 'lv editing';
      var head2 = document.createElement('span');
      head2.className = 'head';
      var lbl = document.createElement('span');
      lbl.className = 'n';
      lbl.textContent = 'Lv';
      head2.appendChild(lbl);
      cell.appendChild(head2);
      var val = document.createElement('span');
      val.className = 'val';
      val.textContent = String(S.sorcererLevel);
      cell.appendChild(val);
      var ed = document.createElement('span');
      ed.className = 'edit';
      ed.style.display = 'flex';
      var down2 = document.createElement('button');
      down2.type = 'button'; down2.className = 'mini'; down2.textContent = '-'; down2.dataset.lvl = '-1';
      var up = document.createElement('button');
      up.type = 'button'; up.className = 'mini'; up.textContent = '+'; up.dataset.lvl = '1';
      ed.appendChild(down2); ed.appendChild(up);
      cell.appendChild(ed);
      el.levels.appendChild(cell);
    }
  }

  /* The summary of a spell: the same fields, in the same order, on every
     card, so the labels line up down the list. */
  function spellFields(spell, full) {
    var comps = spell.components ? spell.components.split('').join(' ') : '-';
    var time = full ? (spell.timeFull || spell.time) : spell.time;
    var hasTrigger = !!(full && spell.timeFull && spell.timeFull !== spell.time);
    return field('Cast', time, '', hasTrigger) +
      field('Range', spell.range) +
      field('Duration', spell.duration) +
      field('Comps', comps, 'cmp') +
      field('Conc', spell.concentration ? 'Yes' : 'No', spell.concentration ? 'yes' : '') +
      field('Ritual', spell.ritual ? 'Yes' : 'No', spell.ritual ? 'rit' : '');
  }

  function sourceTag(source) {
    if (!source) return '';
    var cls = sourceClass(source);
    return '<span class="src' + (cls ? ' ' + cls : '') + '">' + esc(source) + '</span>';
  }

  function renderSpellList() {
    var S = state.spell;
    var list = S.lists[S.selected] || [];
    el.spellList.innerHTML = '';
    if (!list.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No spells at level ' + S.selected + ' yet. Open the grimoire with the + button to add some.';
      el.spellList.appendChild(empty);
      return;
    }
    list.forEach(function (name) {
      var spell = SPELL_BY_NAME[name];
      if (!spell) return;
      var card = document.createElement('div');
      card.className = 'card';
      card.dataset.name = name;
      card.innerHTML = '<div class="top"><span class="t">' + esc(spell.name) + '</span>' +
        sourceTag(spell.source) + '</div><div class="m">' + spellFields(spell) + '</div>';
      el.spellList.appendChild(card);
    });
  }

  function renderSpells() {
    var S = state.spell;
    el.dcValue.textContent = S.dc;
    el.spValue.textContent = S.sp + '/' + S.spMax;
    el.cunning.setAttribute('aria-pressed', S.cunning ? 'true' : 'false');
    el.sorcRest.setAttribute('aria-pressed', S.sorcRest ? 'true' : 'false');
    el.sorcRest.title = 'Restores ' + Math.floor(S.sorcererLevel / 2) + ' sorcery points';
    el.dcStat.classList.toggle('editing', editing);
    var list = S.lists[S.selected] || [];
    el.listTitle.textContent = 'Level ' + S.selected + ' spells · ' + list.length;
    renderLevels();
    renderSpellList();
  }

  /* What the overlay is showing, so the grimoire can come back as it was
     after a spell was read from it. */
  var sheetMode = '';
  var sheetParent = '';

  function closeSheet() {
    /* A spell read from the grimoire gives the grimoire back, it does not
       close the overlay. */
    if (sheetParent === 'grimoire') {
      sheetParent = '';
      sheetMode = 'grimoire';
      el.sheetText.textContent = '';
      el.grimoireLevel.hidden = false;
      el.sheetSearch.hidden = false;
      el.sheetList.hidden = false;
      el.sheetActions.innerHTML = '';
      grimoireChrome(state.spell.selected);
      renderGrimoire(state.spell.selected);
      return;
    }
    el.sheet.hidden = true;
    if (sheetMode === 'grimoire') renderGrimoire(state.spell.selected);
    sheetMode = '';
    sheetParent = '';
  }

  function renderBlocks(blocks) {
    var html = '';
    (blocks || []).forEach(function (b) {
      if (b.t === 'p') html += '<p>' + esc(b.text) + '</p>';
      else if (b.t === 'h') html += '<h3>' + esc(b.text) + '</h3>';
      else if (b.t === 'list') {
        html += '<ul>' + b.items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>';
      } else if (b.t === 'table') {
        if (b.caption) html += '<div class="tcap">' + esc(b.caption) + '</div>';
        html += '<table>';
        if (b.head && b.head.length) {
          html += '<thead><tr>' + b.head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead>';
        }
        html += '<tbody>' + b.rows.map(function (r) {
          return '<tr>' + r.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table>';
      }
    });
    return html;
  }

  function openSheet(name) {
    var spell = SPELL_BY_NAME[name];
    if (!spell) return;
    if (sheetMode === 'grimoire') sheetParent = 'grimoire';
    sheetMode = 'spell';
    el.sheetTitle.textContent = spell.name;
    el.sheetMeta.innerHTML = field('Level', spell.level) + spellFields(spell, true) + sourceTag(spell.source);
    el.sheetText.innerHTML = renderBlocks(spell.blocks);
    el.grimoireLevel.hidden = true;
    el.sheetSearch.hidden = true;
    el.sheetList.innerHTML = '';
    el.sheetList.hidden = true;
    el.sheetActions.innerHTML = '<button class="danger" type="button" id="dropSpell">Remove from level ' + state.spell.selected + '</button>';
    el.sheet.hidden = false;
    el.sheetActions.querySelector('#dropSpell').addEventListener('click', function () {
      var list = state.spell.lists[state.spell.selected] || [];
      var ix = list.indexOf(name);
      if (ix >= 0) list.splice(ix, 1);
      closeSheet();
      commit();
    });
  }

  /* The level a spell sits in, or -1 when it is not in the list. */
  function listLevelOf(name) {
    for (var i = 0; i < LEVELS.length; i++) {
      var list = state.spell.lists[LEVELS[i]] || [];
      if (list.indexOf(name) >= 0) return LEVELS[i];
    }
    return -1;
  }

  function renderGrimoire(lv) {
    var q = (el.sheetSearch.value || '').trim().toLowerCase();
    var on = state.spell.classes || {};
    var active = Object.keys(on).filter(function (c) { return on[c]; });
    var byLevel = state.spell.levelFilter !== false;

    el.sheetTitle.textContent = 'Grimoire' + (byLevel ? ', level ' + lv : '') +
      (active.length ? ' \u00b7 ' + active.join(', ') : '');
    el.grimoireLevel.setAttribute('aria-pressed', byLevel ? 'true' : 'false');
    el.grimoireLevel.textContent = byLevel ? 'Level ' + lv : 'All levels';

    var rows = (SPELLBOOK.spells || [])
      .filter(function (s) { return byLevel ? s.level === lv : true; })
      .filter(function (s) {
        if (!active.length) return true;
        return (s.classes || []).some(function (c) { return active.indexOf(c) >= 0; });
      })
      .filter(function (s) { return !q || s.name.toLowerCase().indexOf(q) >= 0; });

    el.sheetList.innerHTML = '';
    if (!rows.length) {
      var none = document.createElement('div');
      none.className = 'empty';
      none.textContent = active.length
        ? 'No spell of ' + active.join(', ') + (byLevel ? ' at this level' : '') + '.'
        : 'Nothing matches.';
      el.sheetList.appendChild(none);
      return;
    }
    rows.forEach(function (s) {
      var row = document.createElement('div');
      row.className = 'row';
      var at = listLevelOf(s.name);
      var added = at >= 0;

      var head = document.createElement('div');
      head.className = 'g1';
      var name = document.createElement('span');
      name.className = 'gn tappable';
      name.textContent = s.name;
      name.setAttribute('aria-label', 'Read ' + s.name);
      name.addEventListener('click', function () { openSheet(s.name); });
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'gadd';
      b.textContent = added ? '\u2713' : '+';
      b.setAttribute('aria-label', added ? 'Unlearn ' + s.name : 'Add ' + s.name);
      b.addEventListener('click', function () {
        var level = listLevelOf(s.name);
        if (level >= 0) {
          var list = state.spell.lists[level] || [];
          var ix = list.indexOf(s.name);
          if (ix >= 0) list.splice(ix, 1);
        } else {
          var target = state.spell.lists[s.level] || (state.spell.lists[s.level] = []);
          if (target.indexOf(s.name) < 0) target.push(s.name);
        }
        renderGrimoire(lv);
        renderSpellList();
        save();
      });
      head.appendChild(name);
      head.appendChild(b);

      /* One button per class that can learn the spell. A tap turns that
         class on for the whole list, and the list then shows only the
         spells of the classes that are on. */
      var foot = document.createElement('div');
      foot.className = 'g2';
      (s.classes || []).forEach(function (c) {
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'gcls' + (on[c] ? ' on' : '');
        chip.textContent = classShort(c);
        chip.title = c;
        chip.setAttribute('aria-label', c + (on[c] ? ', on' : ', off'));
        chip.addEventListener('click', function () {
          state.spell.classes[c] = !on[c];
          renderGrimoire(lv);
          save();
        });
        foot.appendChild(chip);
      });
      var side = document.createElement('span');
      side.className = 'gs';
      side.textContent = added ? 'in level ' + at : s.time;
      foot.appendChild(side);

      row.appendChild(head);
      row.appendChild(foot);
      el.sheetList.appendChild(row);
    });
  }

  function grimoireChrome(lv) {
    el.sheetMeta.innerHTML = '<span>Tap a spell to read it, a class to filter the list, + to learn it, a check to unlearn it</span>';
  }

  function openGrimoire(lv) {
    sheetMode = 'grimoire';
    sheetParent = '';
    state.spell.selected = lv;
    el.sheetText.textContent = '';
    el.grimoireLevel.hidden = false;
    el.sheetSearch.hidden = false;
    el.sheetSearch.value = '';
    el.sheetList.hidden = false;
    el.sheetActions.innerHTML = '';
    el.sheet.hidden = false;
    renderGrimoire(lv);
    commit();
  }

  /* ---- character sheet ---- */

  var editingChar = false;

  /* The tiles and the rows are built once, then only their numbers move.
     Rebuilding them on every keystroke would take the focus off the field
     the player is typing in. */
  function buildChar() {
    ABILITIES.forEach(function (a) {
      var col = document.createElement('div');
      col.className = 'abcol';

      var tile = document.createElement('div');
      tile.className = 'ab';
      tile.innerHTML = '<span class="an">' + a.name + '</span>' +
        '<input class="cinput" type="number" inputmode="numeric" min="0" max="30" data-ab="' + a.key + '" aria-label="' + a.long + ' score">' +
        '<span class="am" data-mod="' + a.key + '">+0</span>';
      col.appendChild(tile);

      /* The saving throw rides under the ability it comes from. */
      var save = document.createElement('div');
      save.className = 'prow';
      save.dataset.kind = 'save';
      save.dataset.key = a.key;
      save.innerHTML = '<span class="dot"></span><span class="nm dim">save</span>' +
        '<span class="vl">+0</span>';
      col.appendChild(save);

      el.charAbilities.appendChild(col);
    });

    SKILLS.forEach(function (s) {
      var row = document.createElement('div');
      row.className = 'prow';
      row.dataset.kind = 'skill';
      row.dataset.key = s.key;
      row.innerHTML = '<span class="dot"></span><span class="nm">' + s.name + '</span>' +
        '<span class="abk">' + s.ab.toUpperCase() + '</span><span class="vl">+0</span>';
      el.charSkills.appendChild(row);
    });
  }

  function renderChar() {
    var C = state.char;
    el.charBody.classList.toggle('editing', editingChar);
    el.charNameWrap.hidden = !editingChar;

    if (document.activeElement !== el.charName) el.charName.value = C.name;
    if (document.activeElement !== el.charAc) {
      el.charAc.value = C.ac === null ? '' : String(C.ac);
    }
    if (document.activeElement !== el.charInit) el.charInit.value = String(C.init);
    if (document.activeElement !== el.charLevel) el.charLevel.value = String(C.level);
    if (document.activeElement !== el.charHpNow) {
      el.charHpNow.value = C.hp.current ? String(C.hp.current) : '';
    }
    if (document.activeElement !== el.charHpMax) {
      el.charHpMax.value = C.hp.max ? String(C.hp.max) : '';
    }
    el.charHpDown.disabled = !C.hp.current;
    el.charHpUp.disabled = C.hp.max > 0 && C.hp.current >= C.hp.max;
    el.charHpRewind.disabled = !C.history.length;
    el.charHpRewind.title = C.history.length
      ? 'Rewind the last change, ' + C.history.length + ' to go back'
      : 'Nothing to rewind';

    ABILITIES.forEach(function (a) {
      var input = el.charAbilities.querySelector('[data-ab="' + a.key + '"]');
      if (input && document.activeElement !== input) input.value = String(C.abilities[a.key]);
      var mod = el.charAbilities.querySelector('[data-mod="' + a.key + '"]');
      if (mod) mod.textContent = SR.sign(SR.abilityMod(C.abilities[a.key]));
    });

    ABILITIES.forEach(function (a) {
      var row = el.charAbilities.querySelector('[data-kind="save"][data-key="' + a.key + '"]');
      if (!row) return;
      var v = Number(C.saves[a.key]) || 0;
      row.classList.toggle('prof', v === 1);
      row.classList.toggle('exp', v === 2);
      row.querySelector('.vl').textContent = SR.sign(SR.saveMod(C, a.key));
      row.title = a.long + ' saving throw, ' + SR.profLabel(v);
    });

    SKILLS.forEach(function (s) {
      var row = el.charSkills.querySelector('[data-key="' + s.key + '"]');
      if (!row) return;
      var v = Number(C.skills[s.key]) || 0;
      row.classList.toggle('prof', v === 1);
      row.classList.toggle('exp', v === 2);
      row.querySelector('.vl').textContent = SR.sign(SR.skillMod(C, s.key));
      row.title = s.name + ', ' + SR.profLabel(v);
    });

    el.charDerived.innerHTML =
      '<span>proficiency <b>' + SR.sign(SR.profBonus(C.level)) + '</b></span>' +
      '<span>spell attack <b>' + SR.sign(SR.spellAttack(C)) + '</b></span>' +
      '<span>save DC <b>' + SR.spellDC(C) + '</b></span>' +
      '<span>passive perception <b>' + (10 + SR.skillMod(C, 'perception')) + '</b></span>';

    renderFeatures();
  }

  function commitChar() { save(); render(); }

  /* The rewind undoes the last change of any kind: a point of hit points, a
     use of a feature, or a rest. Every change leaves a snapshot behind, so
     the rewind always knows what came before. */
  function pushSnapshot() {
    state.char.history.push(SR.snapshot(state.char, state.spell));
    if (state.char.history.length > 60) state.char.history.shift();
  }

  function setHp(next) {
    var C = state.char;
    if (next === C.hp.current) return;
    pushSnapshot();
    C.hp.current = next;
    commitChar();
  }

  var noteTimer = null;
  function note(message) {
    el.charNote.textContent = message;
    if (noteTimer) clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { el.charNote.textContent = ''; }, 2600);
  }

  /* ---- features ---- */

  /* A feature is something the character has uses for: the hexblade curse,
     a feature that comes back on a short rest, anything like it. The
     warlock slots live in the spell tab, so that row only reads them. */
  function featureByKey(key) {
    var found = null;
    state.char.features.forEach(function (f) { if (f.key === key) found = f; });
    return found;
  }

  function featureCount(f) {
    if (f.bind === 'warlock') {
      return {
        left: Number(state.spell.warlockLeft) || 0,
        max: Number(state.spell.warlockMax) || 0
      };
    }
    return { left: Number(f.left) || 0, max: Number(f.max) || 0 };
  }

  function eyeSvg(hidden) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
      '<path d="M2 12s3.7-6.5 10-6.5S22 12 22 12s-3.7 6.5-10 6.5S2 12 2 12z"/>' +
      '<circle cx="12" cy="12" r="2.6"/>' +
      (hidden ? '<path d="M3.5 3.5l17 17"/>' : '') +
      '</svg>';
  }

  function buildFeatures() {
    el.charFeatures.innerHTML = '';
    state.char.features.forEach(function (f) {
      var row = document.createElement('div');
      row.className = 'frow';
      row.dataset.key = f.key;
      row.innerHTML =
        '<input class="fname" type="text" data-role="name" aria-label="Feature name">' +
        '<button class="ftag" type="button" data-role="tag" data-rec="none">none</button>' +
        '<button class="fuse" type="button" data-role="use">0</button>' +
        '<span class="fof">/</span>' +
        '<input class="fmax" type="number" inputmode="numeric" min="0" max="9" data-role="max" aria-label="Maximum uses">' +
        '<button class="feye" type="button" data-role="eye" aria-label="Hide the feature"></button>' +
        '<button class="fdel" type="button" data-role="del" aria-label="Remove the feature">&times;</button>';
      el.charFeatures.appendChild(row);
    });
  }

  function renderFeatures() {
    state.char.features.forEach(function (f) {
      var row = el.charFeatures.querySelector('[data-key="' + f.key + '"]');
      if (!row) return;
      var count = featureCount(f);

      var name = row.querySelector('[data-role="name"]');
      if (name && document.activeElement !== name) name.value = f.name;

      var tag = row.querySelector('[data-role="tag"]');
      tag.dataset.rec = f.recovery;
      tag.textContent = f.recovery;
      tag.title = 'Recovery: ' + (f.recovery === 'none' ? 'never' : f.recovery + ' rest');

      var use = row.querySelector('[data-role="use"]');
      use.textContent = String(count.left);
      use.setAttribute('aria-label', f.name + ': ' + count.left + ' of ' + count.max + ' left');

      var max = row.querySelector('[data-role="max"]');
      if (max) {
        if (document.activeElement !== max) max.value = String(count.max);
        max.disabled = !!f.bind;
        max.title = f.bind ? 'The warlock slots are set in the spell tab' : 'How many uses in all';
      }

      var eye = row.querySelector('[data-role="eye"]');
      if (eye) {
        eye.innerHTML = eyeSvg(f.hidden);
        eye.setAttribute('aria-label', f.hidden ? 'Show the feature' : 'Hide the feature');
      }
      row.classList.toggle('hidden', !!f.hidden);
    });
  }

  el.charFeatures.addEventListener('input', function (ev) {
    var role = ev.target && ev.target.dataset ? ev.target.dataset.role : null;
    if (!role) return;
    var row = ev.target.closest('.frow');
    if (!row) return;
    var f = featureByKey(row.dataset.key);
    if (!f) return;
    if (role === 'name') f.name = ev.target.value;
    else if (role === 'max') {
      var m = Math.max(0, Math.min(9, Number(ev.target.value) || 0));
      f.max = m;
      if (f.left > m) f.left = m;
    } else return;
    commitChar();
  });

  el.charFeatures.addEventListener('click', function (ev) {
    var row = ev.target.closest('.frow');
    if (!row) return;
    var f = featureByKey(row.dataset.key);
    if (!f) return;
    /* The eye holds a drawing, so the role is found from the closest
       element that carries one. */
    var roleEl = ev.target.closest ? ev.target.closest('[data-role]') : null;
    var role = roleEl ? roleEl.dataset.role : null;

    /* One tap spends a use, and at zero it gives one back. */
    if (role === 'use') {
      var count = featureCount(f);
      var next = count.left > 0 ? count.left - 1 : (count.max > 0 ? 1 : count.left);
      if (next === count.left) return;
      pushSnapshot();
      if (f.bind === 'warlock') state.spell.warlockLeft = next;
      else f.left = next;
      commitChar();
      return;
    }

    if (!editingChar) return;

    if (role === 'tag') {
      f.recovery = f.recovery === 'short' ? 'long' : (f.recovery === 'long' ? 'none' : 'short');
      commitChar();
      return;
    }
    if (role === 'eye') {
      f.hidden = !f.hidden;
      commitChar();
      return;
    }
    if (role === 'del') {
      state.char.features = state.char.features.filter(function (x) { return x.key !== f.key; });
      buildFeatures();
      commitChar();
    }
  });

  el.addFeature.addEventListener('click', function () {
    state.char.features.push({
      key: 'f' + Date.now(),
      name: 'New feature',
      recovery: 'short',
      bind: null,
      max: 1,
      left: 1,
      short: 1
    });
    buildFeatures();
    commitChar();
  });

  /* ---- rests ---- */

  function applyRest(result) {
    state.char.hp.current = result.hp;
    state.char.hp.max = result.hpmax;
    state.char.features = result.features;
    state.spell.left = result.left;
    state.spell.warlockLeft = result.warlockLeft;
    state.spell.sp = result.sp;
    state.spell.cunning = result.cunning;
    state.spell.sorcRest = result.sorcRest;
  }

  function slotsDiffer(a, b) {
    var keys = {}, k;
    for (k in (a || {})) keys[k] = 1;
    for (k in (b || {})) keys[k] = 1;
    for (k in keys) if ((a[k] || 0) !== (b[k] || 0)) return true;
    return false;
  }

  function doRest(kind) {
    var before = SR.snapshot(state.char, state.spell);
    var after = kind === 'long' ? SR.longRest(state.char, state.spell) : SR.shortRest(state.char, state.spell);
    state.char.history.push(before);
    if (state.char.history.length > 60) state.char.history.shift();
    applyRest(after);
    commitChar();
    note(restNote(kind, before, after));
    if (navigator.vibrate) navigator.vibrate([14, 40, 14]);
  }

  /* What the rest actually gave back, so the note says it. */
  function restNote(kind, before, after) {
    var names = [];
    (after.features || []).forEach(function (f, i) {
      var b = (before.features || [])[i];
      if (b && f.left > b.left) names.push(f.name);
    });
    if (after.warlockLeft > before.warlockLeft && names.indexOf('Warlock spell slots') < 0) {
      names.push('Warlock spell slots');
    }
    if (kind === 'long') {
      var bits = [];
      if (after.hp !== before.hp) bits.push('hit points');
      if (slotsDiffer(after.left, before.left) || after.warlockLeft !== before.warlockLeft) bits.push('spell slots');
      if (after.sp !== before.sp) bits.push('sorcery points');
      if (names.length) bits.push(names.join(' and '));
      return 'Long rest' + (bits.length ? ': ' + bits.join(', ') + ' back.' : ': nothing to give back.');
    }
    return 'Short rest' + (names.length ? ': ' + names.join(' and ') + ' back.' : ': nothing to give back yet.');
  }


  el.charName.addEventListener('input', function () {
    state.char.name = el.charName.value;
    commitChar();
  });

  el.charAc.addEventListener('input', function () {
    var v = el.charAc.value.trim();
    state.char.ac = v === '' ? null : Number(v);
    commitChar();
  });

  el.charInit.addEventListener('input', function () {
    var v = el.charInit.value.trim();
    state.char.init = v === '' ? 0 : Number(v);
    commitChar();
  });

  el.charLevel.addEventListener('input', function () {
    var v = Number(el.charLevel.value);
    state.char.level = Math.max(1, Math.min(20, isFinite(v) && v ? v : 1));
    commitChar();
  });

  el.charAbilities.addEventListener('input', function (ev) {
    var input = ev.target.closest('[data-ab]');
    if (!input) return;
    var v = input.value.trim();
    state.char.abilities[input.dataset.ab] = v === '' ? 10 : Math.max(0, Math.min(30, Number(v) || 0));
    commitChar();
  });

  /* The field follows the typing, and the value it had when the field was
     opened goes to the history when the player is done with it, so the
     rewind takes back a whole typed change and not one keystroke. */
  var hpBefore = null;

  el.charHpNow.addEventListener('focus', function () {
    hpBefore = SR.snapshot(state.char, state.spell);
  });

  el.charHpNow.addEventListener('input', function () {
    var v = el.charHpNow.value.trim();
    state.char.hp.current = SR.hpApply(v === '' ? 0 : Number(v) || 0, state.char.hp.max, 0);
    commitChar();
  });

  el.charHpNow.addEventListener('change', function () {
    if (hpBefore && hpBefore.hp !== state.char.hp.current) {
      state.char.history.push(hpBefore);
      if (state.char.history.length > 60) state.char.history.shift();
    }
    hpBefore = null;
    commitChar();
  });

  el.charHpMax.addEventListener('input', function () {
    var v = el.charHpMax.value.trim();
    var max = v === '' ? 0 : Math.max(0, Number(v) || 0);
    state.char.hp.max = max;
    if (max > 0 && state.char.hp.current > max) state.char.hp.current = max;
    commitChar();
  });

  el.charHpUp.addEventListener('click', function () {
    setHp(SR.hpApply(state.char.hp.current, state.char.hp.max, 1));
  });

  el.charHpDown.addEventListener('click', function () {
    setHp(SR.hpApply(state.char.hp.current, state.char.hp.max, -1));
  });

  el.charHpRewind.addEventListener('click', function () {
    var r = SR.rewind(state.char.history);
    if (!r.current) return;
    state.char.history = r.history;
    applyRest(r.current);
    commitChar();
    note('Rewound to before the last change.');
  });

  /* The proficiencies only move in the edit mode, so a stray tap at the
     table never changes a modifier. */
  el.charBody.addEventListener('click', function (ev) {
    if (!editingChar) return;
    var row = ev.target.closest('.prow');
    if (!row) return;
    var C = state.char;
    if (row.dataset.kind === 'save') C.saves[row.dataset.key] = SR.nextProf(C.saves[row.dataset.key]);
    else if (row.dataset.kind === 'skill') C.skills[row.dataset.key] = SR.nextProf(C.skills[row.dataset.key]);
    else return;
    commitChar();
  });

  el.restShort.addEventListener('click', function () { doRest('short'); });

  el.restLong.addEventListener('click', function () { doRest('long'); });

  el.wrench.addEventListener('click', function () {
    if (view === 'char') { editingChar = !editingChar; commitChar(); return; }
    editing = !editing;
    commit();
  });

  el.cunning.addEventListener('click', function () {
    var S = state.spell;
    pushSnapshot();
    S.cunning = !S.cunning;
    if (S.cunning) S.warlockLeft = Math.min(S.warlockMax, S.warlockLeft + 1);
    else S.warlockLeft = Math.max(0, S.warlockLeft - 1);
    commit();
  });

  el.sorcRest.addEventListener('click', function () {
    var S = state.spell;
    var gain = Math.floor(S.sorcererLevel / 2);
    pushSnapshot();
    S.sorcRest = !S.sorcRest;
    if (S.sorcRest) S.sp = Math.min(S.spMax, S.sp + gain);
    else S.sp = Math.max(0, S.sp - gain);
    commit();
  });

  el.viewSpells.addEventListener('click', function (ev) {
    var m = ev.target.closest('.mini[data-act]');
    if (!m) return;
    var S = state.spell;
    var act = m.dataset.act;
    if (act === 'dc+') S.dc++;
    else if (act === 'dc-') S.dc = Math.max(0, S.dc - 1);
    else if (act === 'sp+') S.sp = Math.min(S.spMax, S.sp + 1);
    else if (act === 'sp-') S.sp = Math.max(0, S.sp - 1);
    commit();
  });

  el.levels.addEventListener('click', function (ev) {
    var S = state.spell;

    var bolt = ev.target.closest('.bolt');
    if (bolt) {
      var blv = Number(bolt.dataset.bolt);
      var moved = R.convertSlot({ sp: S.sp, spMax: S.spMax, left: S.left, warlockLeft: S.warlockLeft }, blv);
      if (moved) {
        S.left[blv] = moved.left;
        S.warlockLeft = moved.warlockLeft;
        S.sp = moved.sp;
        commit();
        el.spValue.classList.remove('bump');
        void el.spValue.offsetWidth;
        el.spValue.classList.add('bump');
        if (navigator.vibrate) navigator.vibrate(18);
      }
      return;
    }

    var pip = ev.target.closest('.pip');
    if (pip) {
      var lv = Number(pip.dataset.lv), n = Number(pip.dataset.n);
      var full = pip.classList.contains('full');
      if (pip.dataset.wl) {
        S.warlockLeft = full ? Math.max(0, S.warlockLeft - 1) : n;
      } else {
        S.left[lv] = full ? Math.max(0, S.left[lv] - 1) : n;
      }
      commit();
      return;
    }
    var lvBtn = ev.target.closest('.mini[data-lvl]');
    if (lvBtn) {
      S.sorcererLevel = Math.max(1, Math.min(20, S.sorcererLevel + Number(lvBtn.dataset.lvl)));
      commit();
      return;
    }
    var eb = ev.target.closest('.edit .mini');
    if (eb) {
      var l = Number(eb.dataset.lv);
      var d = eb.dataset.edit === 'add' ? 1 : -1;
      if (eb.dataset.wl) {
        var wBefore = S.warlockMax;
        S.warlockMax = Math.max(0, Math.min(9, wBefore + d));
        if (S.warlockMax > wBefore) S.warlockLeft = Math.min(S.warlockMax, S.warlockLeft + (S.warlockMax - wBefore));
        else S.warlockLeft = Math.min(S.warlockLeft, S.warlockMax);
      } else {
        var before = S.max[l] || 0;
        S.max[l] = Math.max(0, Math.min(9, before + d));
        if (S.max[l] > before) S.left[l] = Math.min(S.max[l], (S.left[l] || 0) + (S.max[l] - before));
        else S.left[l] = Math.min(S.left[l], S.max[l]);
      }
      commit();
      return;
    }
    var down = ev.target.closest('.down');
    if (down) {
      S.selected = Number(down.dataset.lv);
      commit();
      el.spellList.scrollTop = 0;
      return;
    }
    var row = ev.target.closest('.lv');
    if (row && row.dataset.lv !== undefined) {
      S.selected = Number(row.dataset.lv);
      commit();
      el.spellList.scrollTop = 0;
    }
  });

  el.spellList.addEventListener('click', function (ev) {
    if (dragged) { dragged = false; return; }
    var card = ev.target.closest('.card');
    if (card) openSheet(card.dataset.name);
  });

  el.spellList.addEventListener('pointerdown', function (ev) {
    var card = ev.target.closest('.card');
    if (!card) return;
    var startY = ev.clientY, startX = ev.clientX, timer = null, dragging = false;

    function begin() {
      timer = null;
      dragging = true;
      card.classList.add('dragging');
      if (navigator.vibrate) navigator.vibrate(12);
    }

    function move(e) {
      if (!dragging) {
        if (Math.abs(e.clientY - startY) > 8 || Math.abs(e.clientX - startX) > 8) {
          if (timer) { clearTimeout(timer); timer = null; }
          cleanup();
        }
        return;
      }
      if (e.cancelable) e.preventDefault();
      var cards = Array.prototype.slice.call(el.spellList.querySelectorAll('.card'));
      for (var i = 0; i < cards.length; i++) {
        var r = cards[i].getBoundingClientRect();
        if (e.clientY < r.top + r.height / 2 && cards[i] !== card) {
          el.spellList.insertBefore(card, cards[i]);
          startY = e.clientY;
          dragged = true;
          break;
        }
      }
    }

    function up() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (dragging) {
        card.classList.remove('dragging');
        dragged = true;
        setTimeout(function () { dragged = false; }, 80);
        var order = Array.prototype.slice.call(el.spellList.querySelectorAll('.card'))
          .map(function (c) { return c.dataset.name; });
        state.spell.lists[state.spell.selected] = order;
        save();
      }
      cleanup();
    }

    function blockScroll(e) { if (dragging && e.cancelable) e.preventDefault(); }
    function cleanup() {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      window.removeEventListener('touchmove', blockScroll);
    }

    timer = setTimeout(begin, 320);
    window.addEventListener('pointermove', move, { passive: false });
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
    window.addEventListener('touchmove', blockScroll, { passive: false });
  });

  el.addSpell.addEventListener('click', function () { openGrimoire(state.spell.selected); });

  el.sheetClose.addEventListener('click', closeSheet);
  el.sheet.addEventListener('click', function (ev) { if (ev.target === el.sheet) closeSheet(); });
  el.sheetSearch.addEventListener('input', function () { renderGrimoire(state.spell.selected); });

  el.grimoireLevel.addEventListener('click', function () {
    state.spell.levelFilter = state.spell.levelFilter === false;
    save();
    renderGrimoire(state.spell.selected);
  });

  buildChar();
  buildFeatures();
  render();
})();
</script>
</body>
</html>

      E.spellList.addEventListener('pointerdown', function (ev) {
        var card = ev.target.closest('.card');
        if (!card) return;
        var startY = ev.clientY, startX = ev.clientX, timer = null, moved = false;

        function begin() {
          timer = null;
          moved = true;
          card.classList.add('dragging');
          if (navigator.vibrate) navigator.vibrate(12);
        }

        function move(e) {
          if (!moved) {
            if (Math.abs(e.clientY - startY) > 8 || Math.abs(e.clientX - startX) > 8) {
              if (timer) { clearTimeout(timer); timer = null; }
              cleanup();
            }
            return;
          }
          if (e.cancelable) e.preventDefault();
          var cards = Array.prototype.slice.call(E.spellList.querySelectorAll('.card'));
          for (var i = 0; i < cards.length; i++) {
            var r = cards[i].getBoundingClientRect();
            if (e.clientY < r.top + r.height / 2 && cards[i] !== card) {
              E.spellList.insertBefore(card, cards[i]);
              startY = e.clientY;
              dragged = true;
              break;
            }
          }
        }

        function up() {
          if (timer) { clearTimeout(timer); timer = null; }
          if (moved) {
            card.classList.remove('dragging');
            dragged = true;
            setTimeout(function () { dragged = false; }, 80);
            var order = Array.prototype.slice.call(E.spellList.querySelectorAll('.card'))
              .map(function (c) { return c.dataset.name; });
            S.lists[S.selected] = order;
            api.save();
          }
          cleanup();
        }

        function blockScroll(e) { if (moved && e.cancelable) e.preventDefault(); }
        function cleanup() {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          window.removeEventListener('pointercancel', up);
          window.removeEventListener('touchmove', blockScroll);
        }

        timer = setTimeout(begin, 320);
        window.addEventListener('pointermove', move, { passive: false });
        window.addEventListener('pointerup', up);
        window.addEventListener('pointercancel', up);
        window.addEventListener('touchmove', blockScroll, { passive: false });
      });
    },

    /* The wrench edits the maximum of the slots. */
    head: function (root, a) {
      api = a;
      S = a.character().spells;
      var b = C.wrenchButton('Edit the slot maximums', function () {
        editing = !editing;
        api.save();
        api.refresh();
      });
      root.appendChild(b);
      E.wrench = b;
    },

    render: function (a) {
      api = a;
      S = a.character().spells;
      if (E.wrench) E.wrench.setAttribute('aria-pressed', editing ? 'true' : 'false');
      renderSpells();
    }
  });

  function bumpSp() {
    E.spValue.classList.remove('bump');
    void E.spValue.offsetWidth;
    E.spValue.classList.add('bump');
  }
})();

</script>
<script>
/* The features page: what the character has, what is left of it, and the
   rests that give it back. */
(function () {
  'use strict';

  var C = Sheet.core;
  var SR = C.SR;

  var api = null;   /* the shell gives it at mount */
  var E = {};       /* the elements of the page */

  var deleting = null;
  var editingFeatures = false;
  var dragged = false;
  var built = null;   /* the character the cards were built for */

  /* The library lands after the page does, and the shell repaints when it
     does, so the map is the one the shell fills. */
  var FEATURE_BY_KEY = C.featureByKey;

  var NEW_TYPES = [
    { id: 'short', label: 'short rest' },
    { id: 'long', label: 'long rest' },
    { id: 'special', label: 'special' },
    { id: 'passive', label: 'passive' }
  ];

  function commitChar() { api.save(); api.refresh(); }

  function features() { return api.character().char.features; }

  /* The feature waiting to be removed, and the question under it. */
  function featureByKey(key) {
    var found = null;
    features().forEach(function (f) { if (f.key === key) found = f; });
    return found;
  }

  function featureCount(f) {
    if (f.bind === 'warlock') {
      var S = api.character().spells;
      return {
        left: Number(S.warlockLeft) || 0,
        max: Number(S.warlockMax) || 0
      };
    }
    return { left: Number(f.left) || 0, max: Number(f.max) || 0 };
  }

  function eyeSvg(hidden) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
      '<path d="M2 12s3.7-6.5 10-6.5S22 12 22 12s-3.7 6.5-10 6.5S2 12 2 12z"/>' +
      '<circle cx="12" cy="12" r="2.6"/>' +
      (hidden ? '<path d="M3.5 3.5l17 17"/>' : '') +
      '</svg>';
  }

  /* The uses of a feature: how many are left and when they come back. */
  function usesText(f) {
    if (f.cost === 'sp') return '1 SP';
    if (!f.max) return '';
    if (f.recovery === 'short' || f.recovery === 'long') return f.left + ' / ' + f.recovery;
    return String(f.left);
  }

  function recoveryWord(f) {
    if (f.recovery === 'short' || f.recovery === 'long') return f.recovery;
    if (f.recovery === 'special') return 'special';
    return '';
  }

  /* ---- the cards ---- */

  function buildFeatureCards() {
    E.featureActive.innerHTML = '';
    E.featurePassive.innerHTML = '';
    features().forEach(function (f) {
      var card = document.createElement('div');
      card.className = 'fcard';
      card.dataset.key = f.key;
      card.innerHTML =
        '<div class="top"><span class="t" data-role="name"></span>' +
        '<span class="fsrc"></span>' +
        '<button class="fuses" type="button" data-role="uses"></button>' +
        '<input class="fusesin" type="number" inputmode="numeric" min="0" max="99" data-role="usesin" aria-label="Uses left">' +
        '<span class="fslash">/</span>' +
        '<input class="fmaxin" type="number" inputmode="numeric" min="0" max="99" data-role="maxin" aria-label="Maximum uses">' +
        '<span class="frec"></span></div>' +
        '<div class="fm"><span class="fdesc"></span>' +
        '<button class="feye" type="button" data-role="eye" aria-label="Hide the feature"></button>' +
        '<button class="fdel" type="button" data-role="del" aria-label="Remove the feature">&times;</button></div>' +
        '<div class="fconfirm"><span>Remove it?</span>' +
        '<button class="yes" type="button" data-role="yes">Remove</button>' +
        '<button class="no" type="button" data-role="no">Keep</button></div>';
      (f.active ? E.featureActive : E.featurePassive).appendChild(card);
    });
  }

  function renderFeatureCards() {
    E.featureBody.classList.toggle('editing', editingFeatures);
    features().forEach(function (f) {
      var card = E.featureBody.querySelector('.fcard[data-key="' + f.key + '"]');
      if (!card) return;
      var data = FEATURE_BY_KEY[f.key] || {};
      card.classList.toggle('hidden', !!f.hidden);

      var name = card.querySelector('[data-role="name"]');
      name.textContent = f.name;
      name.setAttribute('aria-label', 'Read ' + f.name);

      card.querySelector('.fsrc').innerHTML = C.sourceTag(f.source);

      var text = usesText(f);
      var uses = card.querySelector('[data-role="uses"]');
      uses.textContent = text;
      uses.hidden = !text;
      uses.classList.toggle('sp', f.recovery === 'sp');
      uses.setAttribute('aria-label', f.name + ': ' + text);

      /* A feature of the library starts with no counter, so the two fields
         are there in the edit mode for the player to give it one. */
      var input = card.querySelector('[data-role="usesin"]');
      if (input && document.activeElement !== input) input.value = String(f.left || 0);
      input.hidden = !f.max && !editingFeatures;

      var maxInput = card.querySelector('[data-role="maxin"]');
      if (maxInput && document.activeElement !== maxInput) maxInput.value = String(f.max || 0);
      maxInput.hidden = !f.max && !editingFeatures;

      var rec = card.querySelector('.frec');
      rec.textContent = editingFeatures ? (recoveryWord(f) ? ' ' + recoveryWord(f) : '') : '';

      var bits = [];
      if (data.desc) bits.push(data.desc);
      if (data.action) bits.push(data.action);
      if (data.duration) bits.push(data.duration);
      card.querySelector('.fdesc').textContent = bits.join(' \u00b7 ');

      var eye = card.querySelector('[data-role="eye"]');
      eye.innerHTML = eyeSvg(f.hidden);
      eye.setAttribute('aria-label', f.hidden ? 'Show the feature' : 'Hide the feature');

      card.classList.toggle('confirming', deleting === f.key);
    });
  }

  /* ---- the description of a feature ---- */

  function openFeature(key) {
    var f = featureByKey(key);
    if (!f) return;
    var data = FEATURE_BY_KEY[key] || {};
    var meta = C.field('Source', f.source);
    if (f.max || f.recovery === 'sp') meta += C.field('Uses', usesText(f));
    if (data.action) meta += C.field('Action', data.action);
    if (data.duration) meta += C.field('Duration', data.duration);
    if (f.recovery === 'sp') meta += C.field('Cost', '1 sorcery point');
    else if (f.recovery && f.recovery !== 'none') meta += C.field('Recovery', f.recovery + ' rest');

    api.sheet.open({
      id: 'feature:' + key,
      title: f.name,
      meta: meta + C.sourceTag(f.source),
      text: C.renderBlocks(data.blocks)
    });
  }

  /* ---- the creation of a feature: a name and a recovery type ---- */

  function openNewFeature() {
    var picked = 'short';
    api.sheet.open({
      id: 'newfeature',
      title: 'New feature',
      metaClass: 'sheet-meta one',
      meta: '<input class="sheet-search" id="featureName" type="text" placeholder="Name of the feature" aria-label="Name of the feature">',
      text: '<div class="fnew">' + NEW_TYPES.map(function (t) {
        return '<button class="fnewtype" type="button" data-type="' + t.id + '">' + t.label + '</button>';
      }).join('') + '</div>',
      actions: [{
        label: 'Create',
        onClick: function (root) {
          var field = root.querySelector('#featureName');
          var name = (field && field.value ? field.value : '').trim() || 'New feature';
          var passive = picked === 'passive';
          features().push({
            key: 'f' + Date.now(),
            name: name,
            source: 'Feat',
            active: !passive,
            recovery: picked,
            cost: '',
            bind: null,
            max: passive ? 0 : 1,
            left: passive ? 0 : 1,
            short: null,
            hidden: false
          });
          buildFeatureCards();
          api.sheet.close();
          commitChar();
        }
      }],
      onPaint: function (root) {
        var buttons = root.querySelectorAll('.fnewtype');
        Array.prototype.forEach.call(buttons, function (b) {
          b.addEventListener('click', function () {
            picked = b.dataset.type;
            Array.prototype.forEach.call(buttons, function (x) { x.classList.toggle('on', x === b); });
          });
        });
        if (buttons[0]) buttons[0].classList.add('on');
      }
    });
  }

  /* ---- one tap spends a use, and at zero it gives one back. The bend luck
     feature costs a sorcery point rather than a use. ---- */

  function spendFeature(f) {
    var S = api.character().spells;
    if (f.cost === 'sp') {
      if (S.sp > 0) {
        S.sp -= 1;
        api.toast('\u22121 sorcery point \u00b7 ' + S.sp + ' left');
      } else {
        S.sp = S.spMax;
        api.toast('The sorcery point is back \u00b7 ' + S.sp + ' left');
      }
      commitChar();
      C.bumpSp();
      return;
    }
    var count = featureCount(f);
    var next = count.left > 0 ? count.left - 1 : (count.max > 0 ? 1 : count.left);
    if (next === count.left) return;
    C.pushSnapshot(api);
    if (f.bind === 'warlock') S.warlockLeft = next;
    else f.left = next;
    commitChar();
  }

  /* The order the cards sit in becomes the order of the list. */
  function saveFeatureOrder(list) {
    var keys = Array.prototype.slice.call(list.querySelectorAll('.fcard')).map(function (c) { return c.dataset.key; });
    var byKey = {};
    features().forEach(function (f) { byKey[f.key] = f; });
    var others = features().filter(function (f) { return keys.indexOf(f.key) < 0; });
    api.character().char.features = keys.map(function (k) { return byKey[k]; }).concat(others);
    api.save();
    renderFeatureCards();
  }

  /* ---- the page ---- */

  Sheet.page({
    id: 'features',
    title: 'Features',
    order: 3,
    blurb: 'What the character has and what is left of it.',
    html: [
      '<div class="charbody" id="featureBody">',
      '  <div class="cshead"><span>Active</span><span class="rule"></span><button class="mini" id="addFeature" type="button" aria-label="Add a feature">+</button></div>',
      '  <div class="fcards" id="featureActive"></div>',
      '  <div class="cshead"><span>Passive</span><span class="rule"></span></div>',
      '  <div class="fcards" id="featurePassive"></div>',
      '</div>'
    ].join('\n'),

    mount: function (root, a) {
    a.core.data('features');
      api = a;
      E = {
        featureBody: root.querySelector('#featureBody'),
        featureActive: root.querySelector('#featureActive'),
        featurePassive: root.querySelector('#featurePassive'),
        addFeature: root.querySelector('#addFeature')
      };

      buildFeatureCards();
      built = a.state.current + '|' + features().map(function (f) { return f.key; }).join(',');

      E.featureBody.addEventListener('input', function (ev) {
        var roleEl = ev.target.closest ? ev.target.closest('[data-role]') : null;
        if (!roleEl || (roleEl.dataset.role !== 'usesin' && roleEl.dataset.role !== 'maxin')) return;
        var card = roleEl.closest('.fcard');
        if (!card) return;
        var f = featureByKey(card.dataset.key);
        if (!f) return;
        if (roleEl.dataset.role === 'usesin') {
          f.left = Math.max(0, Math.min(99, Number(roleEl.value) || 0));
        } else if (roleEl.dataset.role === 'maxin') {
          f.max = Math.max(0, Math.min(99, Number(roleEl.value) || 0));
          if (f.left > f.max) f.left = f.max;
        } else return;
        commitChar();
      });

      E.featureBody.addEventListener('click', function (ev) {
        var card = ev.target.closest('.fcard');
        if (!card) return;
        var f = featureByKey(card.dataset.key);
        if (!f) return;
        /* The eye holds a drawing, so the role is found from the closest
           element that carries one. */
        var roleEl = ev.target.closest ? ev.target.closest('[data-role]') : null;
        var role = roleEl ? roleEl.dataset.role : null;

        if (role === 'uses') { spendFeature(f); return; }
        if (role === 'name') { openFeature(f.key); return; }

        if (!editingFeatures) return;

        if (role === 'eye') {
          f.hidden = !f.hidden;
          f.toggled = true;
          commitChar();
          return;
        }
        if (role === 'del') {
          deleting = f.key;
          commitChar();
          return;
        }
        if (role === 'no') {
          deleting = null;
          commitChar();
          return;
        }
        if (role === 'yes') {
          api.character().char.features = features().filter(function (x) { return x.key !== f.key; });
          deleting = null;
          buildFeatureCards();
          commitChar();
        }
      });

      /* The cards can be dragged to reorder them, the way the spell list
         does. A press that turns into a move carries the card, a press that
         ends straight away is a tap. */
      E.featureBody.addEventListener('pointerdown', function (ev) {
        if (ev.target.closest('input, button')) return;
        var card = ev.target.closest('.fcard');
        if (!card) return;
        var startY = ev.clientY, startX = ev.clientX, timer = null, moved = false;

        function begin() {
          timer = null;
          moved = true;
          card.classList.add('dragging');
          if (navigator.vibrate) navigator.vibrate(12);
        }

        function move(e) {
          if (!moved) {
            if (Math.abs(e.clientY - startY) > 8 || Math.abs(e.clientX - startX) > 8) {
              if (timer) { clearTimeout(timer); timer = null; }
              cleanup();
            }
            return;
          }
          if (e.cancelable) e.preventDefault();
          var list = card.parentNode;
          var cards = Array.prototype.slice.call(list.querySelectorAll('.fcard'));
          for (var i = 0; i < cards.length; i++) {
            var r = cards[i].getBoundingClientRect();
            if (e.clientY < r.top + r.height / 2 && cards[i] !== card) {
              list.insertBefore(card, cards[i]);
              startY = e.clientY;
              break;
            }
          }
        }

        function up() {
          if (timer) { clearTimeout(timer); timer = null; }
          if (moved) {
            card.classList.remove('dragging');
            dragged = true;
            setTimeout(function () { dragged = false; }, 80);
            saveFeatureOrder(card.parentNode);
          }
          cleanup();
        }

        function blockScroll(e) { if (moved && e.cancelable) e.preventDefault(); }
        function cleanup() {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          window.removeEventListener('pointercancel', up);
          window.removeEventListener('touchmove', blockScroll);
        }

        timer = setTimeout(begin, 320);
        window.addEventListener('pointermove', move, { passive: false });
        window.addEventListener('pointerup', up);
        window.addEventListener('pointercancel', up);
        window.addEventListener('touchmove', blockScroll, { passive: false });
      });

      E.addFeature.addEventListener('click', function () { openNewFeature(); });
    },

    /* The wrench edits the features. */
    head: function (root, a) {
      api = a;
      var b = C.wrenchButton('Edit the features', function () {
        editingFeatures = !editingFeatures;
        api.save();
        api.refresh();
      });
      root.appendChild(b);
      E.wrench = b;
    },

    render: function (a) {
      api = a;
      /* The cards are built for one character and for the features it
         holds. Playing another one builds its own list, so the first
         character's cards never stay on screen, and a feature plugged into
         the character while it is on screen gets a card of its own. */
      var signature = a.state.current + '|' + features().map(function (f) { return f.key; }).join(',');
      if (built !== signature) {
        built = signature;
        buildFeatureCards();
      }
      if (E.wrench) E.wrench.setAttribute('aria-pressed', editingFeatures ? 'true' : 'false');
      renderFeatureCards();
    }
  });
})();

</script>
<script>
/* The settings page: the pages of the app, and the ones that are on. */
(function () {
  'use strict';

  var C = Sheet.core;

  var api = null;   /* the shell gives it at mount */
  var E = {};

  /* The pages belong to the character: a bard can live without the volley
     page the warlock plays. A character that never chose keeps the pages
     of the app. */
  function pages() {
    var rec = api.character();
    if (rec.pages) return rec.pages;
    if (api.state.ui.pages) return api.state.ui.pages;
    return api.defaultPages.slice();
  }

  function toggle(id) {
    var list = pages().slice();
    var ix = list.indexOf(id);
    if (ix >= 0) list.splice(ix, 1);
    else list.push(id);
    api.character().pages = list;
    api.save();
    api.refresh();
  }

  /* What has arrived, so a phone that cannot read a file can say so. */
  function files() {
    var rows = [
      { name: 'The book', got: (C.book.spells || []).length, what: 'spells' },
      { name: 'The library of features', got: Object.keys(C.featureByKey).length, what: 'features' },
      { name: 'The classes', got: (C.classData || []).length, what: 'classes' }
    ];
    E.files.innerHTML = '';
    rows.forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'srow';
      var on = r.got > 0;
      var why = C.dataError[r.what === 'spells' ? 'spellbook' : r.what];
      row.innerHTML = '<span class="t">' + C.esc(r.name) + '</span>' +
        '<span class="d">' + C.esc(on ? r.got + ' ' + r.what + ' ready' : (why ? why : 'not here yet')) + '</span>';
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'stog' + (on ? ' on' : '');
      b.textContent = on ? 'Here' : 'Read';
      b.setAttribute('aria-label', (on ? r.name + ' is ready' : 'Read ' + r.name));
      b.addEventListener('click', function () { C.data(r.what === 'spells' ? 'spellbook' : r.what); });
      row.appendChild(b);
      E.files.appendChild(row);
    });
  }

  /* The update route: the app asks the machine that serves it whether a
     newer build is there, and offers it. */
  function server() {
    var ui = api.state.ui || {};
    return ui.server || 'http://192.168.0.125:8123';
  }

  function update() {
    E.update.innerHTML = '';

    var row = document.createElement('div');
    row.className = 'srow';
    row.innerHTML = '<span class="t">This build</span><span class="d">' +
      C.esc((C.version || '').replace('T', ' ').slice(0, 19)) + '</span>';
    E.update.appendChild(row);

    var field = document.createElement('div');
    field.className = 'srow';
    var input = document.createElement('input');
    input.className = 'cinput';
    input.type = 'url';
    input.value = server();
    input.setAttribute('aria-label', 'The address of the machine that serves the app');
    input.addEventListener('input', function () {
      api.state.ui = api.state.ui || {};
      api.state.ui.server = input.value;
      api.save();
    });
    field.appendChild(input);
    E.update.appendChild(field);

    var line = document.createElement('div');
    line.className = 'srow';
    line.innerHTML = '<span class="t">The machine</span><span class="d">checking</span>';
    E.update.appendChild(line);

    var check = document.createElement('button');
    check.type = 'button';
    check.className = 'stog';
    check.textContent = 'Look';
    check.setAttribute('aria-label', 'Look for a newer build');
    check.addEventListener('click', function () {
      var address = server().replace(/\/$/, '');
      line.querySelector('.d').textContent = 'checking';
      C.readUrl(address + '/version.json')
        .then(function (text) { return JSON.parse(text); })
        .then(function (v) {
          if (!v || !v.version) { line.querySelector('.d').textContent = 'no answer'; return; }
          if (v.version === C.version) { line.querySelector('.d').textContent = 'this is the newest'; return; }
          line.querySelector('.d').textContent = 'a newer build is there';
          var get = document.createElement('button');
          get.type = 'button';
          get.className = 'stog on';
          get.textContent = 'Get it';
          get.setAttribute('aria-label', 'Open the newer build');
          get.addEventListener('click', function () {
            var apk = address + '/' + (v.apk || 'custom-sheet.apk');
            line.querySelector('.d').textContent = 'downloading';
            C.installUpdate(apk).then(function (answer) {
              line.querySelector('.d').textContent = answer === 'ok' ? 'the installer is open' : answer;
              if (answer !== 'ok') return;
              /* The installer of the phone does not always come up. The
                 browser is the way that always works. */
              var other = document.createElement('button');
              other.type = 'button';
              other.className = 'stog';
              other.textContent = 'Browser';
              other.setAttribute('aria-label', 'Open the build in the browser');
              other.addEventListener('click', function () { window.open(apk, '_blank'); });
              line.appendChild(other);
            }).catch(function (e) {
              line.querySelector('.d').textContent = String((e && e.message) || e);
            });
          });
          line.appendChild(get);
        })
        .catch(function () { line.querySelector('.d').textContent = 'no answer'; });
    });
    var holder = document.createElement('div');
    holder.className = 'srow';
    holder.appendChild(check);
    E.update.appendChild(holder);
  }

  /* The exchange: the character being played goes out, and one comes in. */
  function exchange() {
    E.exchange.innerHTML = '';

    var out = document.createElement('div');
    out.className = 'srow';
    out.innerHTML = '<span class="t">The character being played</span><span class="d">a package of it</span>';
    var send = document.createElement('button');
    send.type = 'button';
    send.className = 'stog';
    send.textContent = 'Send';
    send.setAttribute('aria-label', 'Send the character being played');
    send.addEventListener('click', function () {
      var answer = C.exportCharacter();
      C.toast(answer.ok ? answer.name + ' is ready to send' : answer.why);
    });
    out.appendChild(send);
    /* The link carries the character itself, so the other end needs nothing
       but the link. */
    var link = document.createElement('button');
    link.type = 'button';
    link.className = 'stog';
    link.textContent = 'Link';
    link.setAttribute('aria-label', 'Make a link of the character being played');
    link.addEventListener('click', function () {
      C.linkOf(C.packageOf(api.character())).then(function (where) {
        var answer = C.shareLink(where);
        C.toast(answer === 'ok' ? 'the link is ready to send' : 'the link is in the clipboard');
      }).catch(function (e) { C.toast(String((e && e.message) || e)); });
    });
    out.appendChild(link);
    E.exchange.appendChild(out);

    var into = document.createElement('div');
    into.className = 'srow';
    into.innerHTML = '<span class="t">A character</span><span class="d">from a file on the phone</span>';
    var open = document.createElement('button');
    open.type = 'button';
    open.className = 'stog';
    open.textContent = 'Open';
    open.setAttribute('aria-label', 'Open a file from the phone');
    open.addEventListener('click', function () { C.pickFile(); });
    into.appendChild(open);
    E.exchange.appendChild(into);

    /* A package that comes in by a link: the machine that holds the file
       answers for it, so a phone and a desktop can swap without a cable. */
    var link = document.createElement('div');
    link.className = 'srow';
    var field = document.createElement('input');
    field.className = 'cinput';
    field.type = 'url';
    field.placeholder = 'the link of a package';
    field.setAttribute('aria-label', 'The link of a package to bring in');
    var take = document.createElement('button');
    take.type = 'button';
    take.className = 'stog';
    take.textContent = 'Fetch';
    take.setAttribute('aria-label', 'Fetch the package at that link');
    take.addEventListener('click', function () {
      take.disabled = true;
      C.importAny(field.value).then(function (answer) {
        take.disabled = false;
        C.toast(answer && answer.ok ? answer.name + ' is here'
          : ((answer && answer.why) || 'that link holds no character'));
      });
    });
    link.appendChild(field);
    link.appendChild(take);
    E.exchange.appendChild(link);
  }

  /* The shelf: a folder in the public repository of the app. The app reads
     it with no secret, and anybody may open a branch and drop a character
     there. */
  function shelfRows() {
    E.shelf.innerHTML = '';

    var address = document.createElement('div');
    address.className = 'srow';
    var input = document.createElement('input');
    input.className = 'cinput';
    input.type = 'text';
    input.value = C.shelfRepo();
    input.placeholder = 'NewbornAI/custom-sheet';
    input.setAttribute('aria-label', 'The repository that holds the shelf');
    input.addEventListener('input', function () {
      api.state.ui = api.state.ui || {};
      api.state.ui.shelf = input.value;
      api.save();
    });
    address.appendChild(input);
    E.shelf.appendChild(address);

    var row = document.createElement('div');
    row.className = 'srow';
    row.innerHTML = '<span class="t">The characters</span><span class="d">the ones the shelf holds</span>';
    var list = document.createElement('button');
    list.type = 'button';
    list.className = 'stog';
    list.textContent = 'Open';
    list.setAttribute('aria-label', 'The characters the shelf holds');
    list.addEventListener('click', openShelf);
    row.appendChild(list);
    E.shelf.appendChild(row);
  }

  /* A character of the shelf comes in. */
  function takeFrom(url) {
    C.importUrl(url).then(function (pkg) {
      if (!pkg) { C.toast('that one is not there'); return; }
      var answer = C.importPackage(JSON.stringify(pkg));
      C.toast(answer.ok ? answer.name + ' is here' : answer.why);
    }).catch(function (e) { C.toast(String((e && e.message) || e)); });
  }

  /* The window of the shelf: the characters of the main branch, then the
     branches, which are the shelves of the players. */
  function openShelf() {
    C.shelfCharacters('').then(function (chars) {
      return C.shelfBranches().then(function (branches) {
        var html = chars.map(function (c) {
          return '<div class="crow">' +
            '<span class="cn">' + C.esc(c.name) + '</span>' +
            '<button class="mini" type="button" data-take="' + C.esc(c.url) + '" aria-label="Bring ' + C.esc(c.name) + ' in">&darr;</button>' +
            '</div>';
        }).join('');
        if (!html) html = '<div class="empty">The shelf is empty.</div>';
        html += '<div class="crow"><span class="cn">The branches</span></div>';
        html += branches.map(function (b) {
          return '<div class="crow">' +
            '<span class="cn">' + C.esc(b) + '</span>' +
            '<button class="mini" type="button" data-open="' + C.esc(b) + '" aria-label="Open the branch ' + C.esc(b) + '">&rarr;</button>' +
            '</div>';
        }).join('');
        api.sheet.open({
          id: 'shelf',
          title: 'The shelf',
          metaClass: 'sheet-meta one',
          meta: '<span>The characters of the main branch, then the branches of the players.</span>',
          list: html,
          onList: function (ev) {
            var take = ev.target.closest('[data-take]');
            if (take) { takeFrom(take.dataset.take); return; }
            var open = ev.target.closest('[data-open]');
            if (open) openBranch(open.dataset.open);
          }
        });
      });
    }).catch(function (e) { C.toast(String((e && e.message) || e)); });
  }

  /* The characters of one branch. */
  function openBranch(name) {
    C.shelfCharacters(name).then(function (rows) {
      var html = rows.map(function (c) {
        return '<div class="crow">' +
          '<span class="cn">' + C.esc(c.name) + '</span>' +
          '<button class="mini" type="button" data-take="' + C.esc(c.url) + '" aria-label="Bring ' + C.esc(c.name) + ' in">&darr;</button>' +
          '</div>';
      }).join('');
      if (!html) html = '<div class="empty">This branch holds no character.</div>';
      api.sheet.open({
        id: 'shelfbranch',
        title: name,
        metaClass: 'sheet-meta one',
        meta: '<span>The characters of the branch.</span>',
        list: html,
        onList: function (ev) {
          var take = ev.target.closest('[data-take]');
          if (take) takeFrom(take.dataset.take);
        }
      });
    }).catch(function (e) { C.toast(String((e && e.message) || e)); });
  }

  /* The credits. The text of the rules comes from the System Reference
     Document, which is under Creative Commons Attribution 4.0, and the
     licence asks for this notice wherever the text is published. */
  function credits() {
    E.credits.innerHTML = '';
    var rows = [
      { t: 'The rules', d: 'The spells, the classes, the archetypes and the surge table come from the System Reference Document 5.2 by Wizards of the Coast LLC, available at https://www.dndbeyond.com/srd, under the Creative Commons Attribution 4.0 International Licence, https://creativecommons.org/licenses/by/4.0/legalcode. The text was taken from 5e.tools and laid out by this app; the app itself is not part of the SRD and is not under that licence.' },
      { t: 'The name', d: 'Dungeons & Dragons, D&D and the D20 logo are trademarks of Wizards of the Coast LLC. This app is not affiliated with, endorsed by or sponsored by Wizards of the Coast.' },
      { t: 'The font', d: 'Cinzel is under the SIL Open Font Licence 1.1.' },
      { t: 'The licence', d: 'The app is under the MIT licence. The text of the rules in the data files is under the Creative Commons Attribution 4.0 International Licence, and the NOTICE file of the repository says where it comes from.' }
    ];
    rows.forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'srow';
      row.innerHTML = '<span class="t">' + C.esc(r.t) + '</span><span class="d">' + C.esc(r.d) + '</span>';
      E.credits.appendChild(row);
    });
  }

  Sheet.page({
    id: 'settings',
    title: 'Settings',
    order: 4,
    hidden: true,   /* the gear opens it, so it has no tab of its own */
    blurb: 'The pages of the app.',
    html: [
      '<div class="charbody" id="settingsBody">',
      '  <div class="cshead"><span>Pages</span><span class="rule"></span></div>',
      '  <div class="fcards" id="settingsList"></div>',
      '  <p class="note">A page that is off keeps its numbers. Turning it back on brings them back.</p>',
      '  <div class="cshead"><span>The files</span><span class="rule"></span></div>',
      '  <div class="fcards" id="settingsFiles"></div>',
      '  <p class="note">The book, the library of features and the classes sit beside the app and are read when a page asks for one.</p>',
      '  <div class="cshead"><span>Exchange</span><span class="rule"></span></div>',
      '  <div class="fcards" id="settingsExchange"></div>',
      '  <p class="note">A character is a package: the data in JSON. It can leave as a file or as a link, and come back in by either. Nothing has to be typed.</p>',
      '  <div class="cshead"><span>The shelf</span><span class="rule"></span></div>',
      '  <div class="fcards" id="settingsShelf"></div>',
      '  <p class="note">The shelf is a folder in the public repository of the app. The app reads it with no secret, and anybody may open a branch and drop a character there.</p>',
      '  <div class="cshead"><span>Credits</span><span class="rule"></span></div>',
      '  <div class="fcards" id="settingsCredits"></div>',
      '  <div class="cshead"><span>Update</span><span class="rule"></span></div>',
      '  <div class="fcards" id="settingsUpdate"></div>',
      '  <p class="note">The app is served from the machine that holds it. Give that address here and the app will tell you when a newer build is there.</p>',
      '</div>'
    ].join('\n'),

    mount: function (root, a) {
      api = a;
      E = {
        body: root.querySelector('#settingsBody'),
        list: root.querySelector('#settingsList'),
        files: root.querySelector('#settingsFiles'),
        exchange: root.querySelector('#settingsExchange'),
        shelf: root.querySelector('#settingsShelf'),
        credits: root.querySelector('#settingsCredits'),
        update: root.querySelector('#settingsUpdate')
      };
    },

    render: function (a) {
      api = a;
      E.list.innerHTML = '';
      files();
      update();
      exchange();
      shelfRows();
      credits();
      api.pages.forEach(function (p) {
        if (p.hidden) return;
        var on = p.home || pages().indexOf(p.id) >= 0;
        var row = document.createElement('div');
        row.className = 'srow';
        row.innerHTML = '<span class="t">' + C.esc(typeof p.title === 'function' ? p.title(api) : p.title) + '</span>' +
          '<span class="d">' + C.esc(p.blurb || '') + '</span>';
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'stog' + (on ? ' on' : '');
        b.textContent = p.home ? 'Always' : (on ? 'On' : 'Off');
        b.disabled = !!p.home;
        b.setAttribute('aria-label', (typeof p.title === 'function' ? p.title(api) : p.title) + ', ' + (on ? 'on' : 'off'));
        if (!p.home) {
          b.addEventListener('click', function () { toggle(p.id); });
        }
        row.appendChild(b);
        E.list.appendChild(row);
      });
    }
  });
})();

</script>
</script>
</body>
</html>

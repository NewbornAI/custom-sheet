  overscroll-behavior:none;
  overflow:hidden;
}

.app{
  height:100vh;
  height:100dvh;
  max-height:100dvh;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:9px 10px 10px;
  padding:calc(env(safe-area-inset-top) + 9px) 10px calc(env(safe-area-inset-bottom) + 10px);
  background:
    radial-gradient(130% 55% at 50% -8%, rgba(155,123,255,.20), transparent 62%),
    radial-gradient(100% 45% at 50% 112%, rgba(110,155,255,.12), transparent 60%),
    var(--void);
}

/* ---- header ---- */

.head{display:flex;align-items:center;gap:9px;min-height:30px;flex:0 0 auto}

.sigil{width:22px;height:22px;color:var(--arcane);flex:0 0 auto;opacity:.9}

.title{
  margin:0;
  flex:1 1 auto;
  min-width:0;
  font-family:var(--display);
  font-weight:700;
  font-size:24px;
  font-size:clamp(19px,5.6vw,26px);
  line-height:1.05;
  letter-spacing:.01em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.ac{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:5px;
  padding:4px 9px;
  min-height:28px;
  border:1px solid var(--edge);
  border-radius:999px;
  background:rgba(255,255,255,.03);
  font-size:10.5px;
  letter-spacing:.08em;
  color:var(--muted);
  cursor:pointer;
}
.ac input{
  width:26px;
  padding:0;
  border:0;
  background:none;
  color:var(--ink);
  font:inherit;
  font-variant-numeric:tabular-nums;
  text-align:center;
  outline:none;
  appearance:textfield;
  -moz-appearance:textfield;
}
.ac input::-webkit-outer-spin-button,
.ac input::-webkit-inner-spin-button{appearance:none;-webkit-appearance:none;margin:0}
.ac input::placeholder{color:#5c5778}
.ac:focus-within{border-color:rgba(155,123,255,.6);box-shadow:0 0 0 2px rgba(155,123,255,.15)}

/* ---- power slider ---- */

.slider{flex:0 0 auto}

input[type=range]{
  -webkit-appearance:none;
  appearance:none;
  display:block;
  width:100%;
  height:28px;
  margin:0;
  padding:0;
  background:transparent;
}
input[type=range]:focus-visible{outline:2px solid var(--arcane);outline-offset:3px;border-radius:6px}
input[type=range]::-webkit-slider-runnable-track{
  height:4px;
  border-radius:2px;
  background:linear-gradient(90deg,var(--arcane) 0 var(--fill,0%),rgba(255,255,255,.13) var(--fill,0%) 100%);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:26px;
  height:26px;
  margin-top:-11px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.42);
  background:radial-gradient(circle at 34% 28%,#dccaff,#8a68f5 58%,#5a3fd2);
  box-shadow:0 3px 10px rgba(0,0,0,.6);
}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.13)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--arcane)}
input[type=range]::-moz-range-thumb{
  width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.42);
  background:#8a68f5;box-shadow:0 3px 10px rgba(0,0,0,.6);
}

.stops{position:relative;height:15px}
.stop{
  position:absolute;
  top:0;
  transform:translateX(-50%);
  padding:1px 2px;
  border:0;
  background:none;
  color:#615c7d;
  font-family:var(--sans);
  font-size:10px;
  letter-spacing:.06em;
  cursor:pointer;
  white-space:nowrap;
}
.stop.on{color:var(--arcane);font-weight:600}
.stop:focus-visible{outline:2px solid var(--arcane);outline-offset:1px;border-radius:3px}

/* ---- toggle chips ---- */

.chips{display:flex;gap:6px;flex:0 0 auto;overflow:hidden}

.chip{
  flex:0 1 auto;
  min-width:0;
  padding:6px 10px;
  min-height:31px;
  border:1px solid var(--edge);
  border-radius:999px;
  background:rgba(255,255,255,.03);
  color:var(--muted);
  font-family:var(--sans);
  font-size:12px;
  line-height:1;
  letter-spacing:.02em;
  white-space:nowrap;
  cursor:pointer;
  transition:border-color .15s,color .15s,background-color .15s;
}
.chip:focus-visible{outline:2px solid var(--arcane);outline-offset:2px}
.chip[aria-pressed="true"]{
  border-color:rgba(var(--crgb),.55);
  background:rgba(var(--crgb),.12);
  color:rgb(var(--crgb));
}
.chip[hidden]{display:none}

/* ---- view tabs ---- */

.tabs{
  flex:0 0 auto;
  display:flex;
  gap:16px;
  border-bottom:1px solid var(--edge);
}
.tab{
  border:0;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
  padding:2px 0 5px;
  background:none;
  color:var(--muted);
  font-family:var(--sans);
  font-size:12px;
  letter-spacing:.04em;
  cursor:pointer;
}
.tab[aria-selected="true"]{color:var(--arcane);border-bottom-color:var(--arcane)}
.tab:focus-visible{outline:2px solid var(--arcane);outline-offset:2px}

/* ---- views ---- */

.views{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.view{display:none;flex:1 1 auto;min-height:0;flex-direction:column;gap:8px}
.view.on{display:flex}

/* ---- spells ---- */

.wrench{
  flex:0 0 auto;
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  border:1px solid var(--edge);
  border-radius:7px;
  background:rgba(255,255,255,.03);
  color:var(--muted);
  cursor:pointer;
}
.wrench svg{width:15px;height:15px}
.wrench[aria-pressed="true"]{border-color:rgba(155,123,255,.6);color:var(--arcane);background:rgba(155,123,255,.12)}
.wrench[hidden]{display:none}

.sbar{display:flex;gap:8px;align-items:center;flex:0 0 auto;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:3px;font-size:10.5px;color:var(--muted)}
.stat .k{letter-spacing:.08em}
.stat .mini{display:none}
.stat.editing .mini{display:flex}
.stat .v{
  font-family:var(--display);
  font-size:15px;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  min-width:28px;
  text-align:center;
}
.mini{
  width:22px;height:22px;
  border-radius:6px;
  border:1px solid var(--edge);
  background:rgba(255,255,255,.03);
  color:var(--muted);
  font-size:14px;line-height:1;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  padding:0;
  flex:0 0 auto;
}
.mini:active{background:rgba(155,123,255,.2);color:var(--ink)}
.tog{
  border:1px solid var(--edge);
  border-radius:999px;
  background:rgba(255,255,255,.03);
  color:var(--muted);
  font-family:var(--sans);
  font-size:10px;
  letter-spacing:.01em;
  padding:5px 8px;
  min-height:25px;
  cursor:pointer;
}
.tog[aria-pressed="true"]{border-color:rgba(255,196,77,.5);background:rgba(255,196,77,.10);color:var(--gold)}
.tog:disabled{opacity:.4;cursor:default}

.sbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:7px}
.slotstrip{
  flex:0 0 auto;
  display:flex;
  align-items:flex-start;
  gap:7px;
  padding:2px 0 6px;
  overflow-x:auto;
  scrollbar-width:none;
}
.slotstrip::-webkit-scrollbar{height:0}
.lv{display:flex;flex-direction:column;align-items:center;gap:5px;padding:3px;border-radius:6px;cursor:pointer;flex:0 0 auto}
.lv.on{background:rgba(155,123,255,.12)}
.lv .head{display:flex;align-items:center;gap:1px}
.lv .n{font-size:11px;color:var(--muted);line-height:1}
.lv.on .n{color:var(--arcane)}
.pip{
  width:14px;height:14px;
  border-radius:50%;
  border:1px solid #3a3454;
  background:transparent;
  flex:0 0 auto;
  padding:0;
  cursor:pointer;
}
.pip.full{background:var(--arcane);border-color:var(--arcane)}
.pip.wl{border-radius:3px}
.pip.wl.full{background:#54cfc4;border-color:#54cfc4}
.lv .plus{font-size:9px;color:#4f4a6b;flex:0 0 auto}
.lv .arrow{background:none;border:0;color:#615c7d;font-size:13px;padding:0;cursor:pointer;flex:0 0 auto;line-height:1}
.lv.dim{opacity:.35}
.lv .edit{display:none;gap:3px;flex:0 0 auto}
.lv.editing .edit{display:flex}
.lv.editing .pips{display:none}
.pips{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:14px}
.wlgroup{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:4px}
.lv .val{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

.listhead{flex:0 0 auto;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.listhead .t{color:var(--ink);font-size:12px}
.listhead .mini{margin-left:auto}

.grimoire{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px;overflow-y:auto;scrollbar-width:none}
.grimoire::-webkit-scrollbar{width:0}
.card{
  border:1px solid var(--edge);
  border-radius:5px;
  background:rgba(255,255,255,.03);
  padding:7px 8px;
  cursor:pointer;
  touch-action:pan-y;
}
.card .t{font-size:12.5px;color:var(--ink);line-height:1.25}
.card .m{font-size:10px;color:var(--muted);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:baseline}
.card .cmp{color:var(--arcane);letter-spacing:.1em}
.card .rit{color:var(--gold)}
.card .src{font-size:9.5px;color:var(--muted);border:1px solid var(--edge);border-radius:3px;padding:0 4px}
.card.dragging{opacity:.95;border-color:var(--arcane);box-shadow:0 10px 24px rgba(0,0,0,.55)}
.card.ghost{opacity:.25}
.empty{font-size:11px;color:#615c7d;padding:8px 2px;line-height:1.5}

/* ---- sheet ---- */

.sheet{
  position:fixed;
  inset:0;
  background:var(--void);
  z-index:30;
  display:flex;
  flex-direction:column;
}
.sheet[hidden]{display:none}
.sheet-in{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  padding:14px 14px calc(env(safe-area-inset-bottom) + 24px);
  display:flex;
  flex-direction:column;
  gap:10px;
  position:relative;
}
.sheet h2{font-family:var(--display);font-size:20px;font-weight:700;margin:0;padding-right:34px}
.sheet-meta{font-size:10.5px;color:var(--muted);display:flex;gap:9px;flex-wrap:wrap;align-items:baseline}
.sheet-meta .src{color:var(--arcane);border:1px solid rgba(155,123,255,.35);border-radius:3px;padding:0 4px}
.sheet-text{font-size:13px;line-height:1.6;color:#d9d5ec}
.sheet-text p{margin:0 0 9px}
.sheet-text h3{font-family:var(--display);font-size:14px;font-weight:700;color:var(--arcane);margin:14px 0 5px}
.sheet-text ul{margin:0 0 9px;padding-left:18px}
.sheet-text li{margin-bottom:4px}
.sheet-text table{width:100%;border-collapse:collapse;font-size:11.5px;margin:0 0 10px}
.sheet-text th,.sheet-text td{border:1px solid var(--edge);padding:5px 7px;text-align:left;vertical-align:top}
.sheet-text th{color:var(--muted);font-weight:600}
.tcap{font-size:10.5px;color:var(--muted);margin-bottom:3px}
.sheet-list{display:flex;flex-direction:column;gap:4px}
.sheet-list .row{display:flex;align-items:center;gap:8px;border:1px solid var(--edge);border-radius:5px;padding:7px 8px;font-size:12px;color:var(--ink);background:rgba(255,255,255,.02)}
.sheet-list .row .lv2{font-size:10px;color:var(--muted);margin-left:auto}
.sheet-list .row button{width:26px;height:26px;border-radius:6px;border:1px solid var(--edge);background:rgba(255,255,255,.03);color:var(--arcane);font-size:15px;line-height:1;cursor:pointer;flex:0 0 auto}
.sheet-actions{display:flex;gap:8px}
.sheet-actions button{
  border:1px solid var(--edge);
  border-radius:7px;
  background:rgba(255,255,255,.03);
  color:var(--muted);
  font-family:var(--sans);
  font-size:11px;
  padding:7px 11px;
  cursor:pointer;
}
.sheet-actions button.danger{color:#d08a9c;border-color:rgba(208,138,156,.4)}
.sheet-x{
  position:absolute;
  top:8px;right:10px;
  width:28px;height:28px;
  border:0;background:none;
  color:var(--muted);
  font-size:20px;line-height:1;
  cursor:pointer;
}
.sheet-search{
  border:1px solid var(--edge);
  border-radius:7px;
  background:rgba(255,255,255,.03);
  color:var(--ink);
  font-family:var(--sans);
  font-size:12px;
  padding:7px 9px;
  outline:none;
}
.sheet-search:focus{border-color:rgba(155,123,255,.6)}

/* ---- wild magic surge ---- */

.surge{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:18px;
  overflow-y:auto;
}
.sroll{display:flex;flex-direction:column;align-items:center;gap:3px}
.d100{
  font-family:var(--display);
  font-weight:700;
  font-size:54px;
  line-height:1;
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 26px rgba(155,123,255,.35);
}
.srange{
  font-family:var(--display);
  font-size:14px;
  letter-spacing:.14em;
  color:var(--muted);
}
.seffect{
  margin:0;
  padding-top:16px;
  border-top:1px solid var(--edge);
  font-size:13.5px;
  line-height:1.6;
  color:#d9d5ec;
}
.sdice{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.sdice .g .stot{font-family:var(--display);font-size:14px;color:var(--arcane);line-height:1.1}

/* ---- build summary ---- */

.summary{
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  gap:1px;
  font-size:10.5px;
  line-height:1.3;
  color:#7d7899;
}
.summary em{font-style:normal}
.summary b{color:var(--ink);font-weight:600}
.ghostnum{font-size:15px;color:#6f6a8d}
.ghostroll{color:#6f6a8d}

/* ---- result board ---- */

.board{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:none;
}
.board::-webkit-scrollbar{width:0;height:0}

.grid{
  flex:1 1 auto;
  display:grid;
  grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));
  gap:6px;
  align-content:stretch;
}

.cell{
  display:flex;
  flex-direction:column;
  gap:5px;
  padding:8px 8px 9px;
  border:1px solid var(--edge);
  border-radius:5px;
  background:
    radial-gradient(120% 55% at 50% 54%,rgba(var(--beam,155,123,255),.22),transparent 72%),
    linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
  min-width:0;
  animation:rise .22s ease-out both;
  animation-delay:calc(var(--i,0) * 45ms);
}
.cell.crit{
  border-color:rgba(255,196,77,.55);
  box-shadow:0 0 0 1px rgba(255,196,77,.14),0 8px 20px rgba(255,170,40,.10);
}
.cell.ghost{opacity:.55;animation:none}

@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.atk{display:flex;align-items:baseline;gap:4px}
.at{
  font-family:var(--display);
  font-weight:700;
  font-size:27px;
  line-height:1;
  font-variant-numeric:tabular-nums;
}
.am{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}

.badge{
  margin-left:auto;
  align-self:center;
  padding:2px 5px;
  border:1px solid;
  border-radius:3px;
  font-size:9px;
  letter-spacing:.1em;
  line-height:1.2;
}
.badge.crit{color:var(--gold);border-color:rgba(255,196,77,.5);background:rgba(255,196,77,.10)}
.badge.hit{color:#a9b6d8;border-color:rgba(169,182,216,.34);background:rgba(169,182,216,.08)}
.badge.miss{color:#d08a9c;border-color:rgba(208,138,156,.45);background:rgba(208,138,156,.10)}

.d20{display:flex;gap:4px;font-size:11px;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
.d20 span{padding:2px 4px;border-radius:3px;background:rgba(255,255,255,.05)}
.d20 .kept{color:var(--ink);background:rgba(155,123,255,.20);box-shadow:inset 0 0 0 1px rgba(155,123,255,.5)}

.beam{
  flex:1 1 auto;
  display:flex;
  justify-content:center;
  min-height:10px;
}
.beam::before{
  content:'';
  width:3px;
  border-radius:2px;
  background:linear-gradient(180deg,rgba(var(--beam,155,123,255),.5),rgba(var(--beam,155,123,255),.14));
  box-shadow:0 0 10px rgba(var(--beam,155,123,255),.35);
}

.dmg{
  padding-top:6px;
  border-top:1px solid var(--edge);
  display:flex;
  flex-direction:column;
  gap:5px;
}
.cell.miss .dmg{opacity:.38}

.dtop{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.dt{
  font-family:var(--display);
  font-weight:700;
  font-size:23px;
  line-height:1;
  font-variant-numeric:tabular-nums;
}
.kinds{display:flex;gap:5px;flex-wrap:wrap}
.kinds em{font-style:normal;font-size:9.5px;letter-spacing:.03em}

.force{color:var(--force)}
.fire{color:var(--fire)}
.lightning{color:var(--lightning)}
.necrotic{color:var(--necrotic)}

.dice{display:flex;gap:7px;flex-wrap:wrap}
.g{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.g .lbl{font-size:10px;line-height:1.1;color:var(--muted);font-variant-numeric:tabular-nums}
.g .roll{font-size:11.5px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.g .roll.tight{font-size:10px}
.g.flat .lbl{color:var(--muted)}

/* ---- tally ---- */

.tally{
  flex:0 0 auto;
  display:flex;
  align-items:baseline;
  gap:6px;
  min-height:22px;
  font-size:10.5px;
  color:var(--muted);
  overflow:hidden;
}
.tally .big{
  font-family:var(--display);
  font-weight:700;
  font-size:20px;
  line-height:1;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.tally em{font-style:normal}

/* ---- cast ---- */

.cast{
  position:relative;
  flex:0 0 auto;
  width:100%;
  height:92px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:16px;
  background:linear-gradient(180deg,#9573ff 0%,#5a39d6 100%);
  color:#fff;
  font-family:var(--display);
  font-weight:700;
  font-size:34px;
  letter-spacing:.16em;
  padding-left:.16em;
  text-shadow:0 1px 10px rgba(40,20,90,.5);
  box-shadow:0 12px 30px rgba(92,58,220,.32),inset 0 1px 0 rgba(255,255,255,.32);
  cursor:pointer;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
  overflow:hidden;
}
.cast:focus-visible{outline:2px solid #fff;outline-offset:3px}
.cast:active{transform:translateY(1px);box-shadow:0 5px 16px rgba(92,58,220,.34),inset 0 1px 0 rgba(255,255,255,.25)}
.cast .mark{
  position:absolute;
  right:-14px;
  top:50%;
  transform:translateY(-50%);
  width:150px;
  height:150px;
  color:#fff;
  opacity:.12;
  pointer-events:none;
}

@media (prefers-reduced-motion:reduce){
  .cell{animation:none}
  .cast{transition:none}
}

@media (min-height:760px){
  .cast{height:120px}
}

</head>

      <path d="M12 6.4L17.6 12 12 17.6 6.4 12z" fill="none" stroke="currentColor" stroke-width="1.2"/>

  function rollVolley(state, rng) {

    state = state || {};

        groups.push({
          label: count + 'd' + sources[j].s,
          type: sources[j].type,
          rolls: dice(rng, count, sources[j].s)

      var rolled = 0;
      for (k = 0; k < groups.length; k++) rolled += sum(groups[k].rolls);

        index: i,
        rolls: rolls,
        kept: kept,
        total: total,
        crit: crit,
        hit: hasAc ? total >= Number(state.ac) : null,
        groups: groups,
        flat: flat,
        damage: rolled + flat

      flatTotal += beam.flat;

        g = beam.groups[j];

  /* Rolls the surge table: a d100, the row it lands on, and that row's dice. */
  function rollSurge(rows, rng) {
    rng = rng || Math.random;
    rows = rows || [];
    if (!rows.length) throw new Error('the surge table is empty');
    var roll = 1 + Math.floor(rng() * 100);
    var row = null, i;
    for (i = 0; i < rows.length; i++) {
      if (roll >= rows[i].from && roll <= rows[i].to) { row = rows[i]; break; }
    }
    if (!row) throw new Error('no surge row for ' + roll);
    var specs = diceIn(row.text), rolled = [], j, values;
    for (j = 0; j < specs.length; j++) {
      values = dice(rng, specs[j].count, specs[j].sides);
      rolled.push({ label: specs[j].label, values: values, total: sum(values) });
    }
    return { roll: roll, from: row.from, to: row.to, text: row.text, dice: rolled };
  }

  root.Rules = {
    ATTACK_MOD: ATTACK_MOD,
    POWERS: POWERS,
    EXTRAS: EXTRAS,
    powerOf: powerOf,

<script>
(function () {
  'use strict';

  var R = window.Rules;
  var STORE = 'volley.state.v1';

  var DEFAULTS = {
    power: 'eb',
    advantage: false,
    hex: false,
    curse: false,
    elem: false,
    elemPlus: false,
    ac: null
  };

  var CHIPS = [
    { key: 'advantage', label: 'Adv',      rgb: '154,209,255' },
    { key: 'hex',       label: 'Hex',      rgb: '122,216,111' },
    { key: 'curse',     label: 'Curse',    rgb: '255,111,168' },
    { key: 'elem',      label: 'Elem',     rgb: '255,212,71' },
    { key: 'elemPlus',  label: '+3d8',     rgb: '255,176,59', needs: 'elem' }
  ];

  var volley = null;
  var view = 'volley';
  var SURGE = { rows: [] };
  try { SURGE = JSON.parse(document.getElementById('surge-data').textContent); } catch (e) {}
  var SPELLBOOK = { spells: [] };
  try { SPELLBOOK = JSON.parse(document.getElementById('spell-data').textContent); } catch (e) {}
  var SPELL_BY_NAME = {};
  (SPELLBOOK.spells || []).forEach(function (s) { SPELL_BY_NAME[s.name] = s; });

  /* the warlock slots sit on the second level row */
  var WARLOCK_LEVEL = 2;
  var LEVELS = [0, 1, 2, 3, 4, 5];

  var SPELL_DEFAULTS = {
    dc: 17,
    sp: 8,
    spMax: 8,
    cunning: false,
    sorcRest: false,
    sorcererLevel: 8,
    max: { 1: 4, 2: 3, 3: 3, 4: 2, 5: 0 },
    left: { 1: 4, 2: 3, 3: 3, 4: 2, 5: 0 },
    warlockMax: 2,
    warlockLeft: 2,
    selected: 1,
    lists: {}
  };

  var SPELL_SEED = (SPELLBOOK.seed || []).map(function (s) { return s.name; });

  var state = load();

  var el = {
    spellName: document.getElementById('spellName'),
    power: document.getElementById('power'),
    stops: document.getElementById('stops'),
    chips: document.getElementById('chips'),
    summary: document.getElementById('summary'),
    board: document.getElementById('board'),
    grid: document.getElementById('grid'),
    tally: document.getElementById('tally'),
    cast: document.getElementById('cast'),
    castLabel: document.getElementById('castLabel'),
    ac: document.getElementById('ac'),
    acField: document.getElementById('acField'),
    tabVolley: document.getElementById('tab-volley'),
    tabSurge: document.getElementById('tab-surge'),
    viewVolley: document.getElementById('view-volley'),
    viewSurge: document.getElementById('view-surge'),
    surgeRoll: document.getElementById('surgeRoll'),
    surgeRange: document.getElementById('surgeRange'),
    surgeText: document.getElementById('surgeText'),
    surgeDice: document.getElementById('surgeDice'),
    tabSpells: document.getElementById('tab-spells'),
    viewSpells: document.getElementById('view-spells'),
    wrench: document.getElementById('wrench'),
    dcValue: document.getElementById('dcValue'),
    dcStat: document.getElementById('dcStat'),
    spValue: document.getElementById('spValue'),
    cunning: document.getElementById('cunning'),
    sorcRest: document.getElementById('sorcRest'),
    levels: document.getElementById('levels'),
    listTitle: document.getElementById('listTitle'),
    addSpell: document.getElementById('addSpell'),
    spellList: document.getElementById('spellList'),
    sheet: document.getElementById('sheet'),
    sheetTitle: document.getElementById('sheetTitle'),
    sheetMeta: document.getElementById('sheetMeta'),
    sheetText: document.getElementById('sheetText'),
    sheetList: document.getElementById('sheetList'),
    sheetActions: document.getElementById('sheetActions'),
    sheetSearch: document.getElementById('sheetSearch'),
    sheetClose: document.getElementById('sheetClose')
  };

  /* ---- state ---- */

  function load() {
    var saved = {};
    try { saved = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { saved = {}; }
    var merged = {};
    Object.keys(DEFAULTS).forEach(function (k) { merged[k] = DEFAULTS[k]; });
    merged.spell = seedSpells(saved.spell || {});
    Object.keys(DEFAULTS).forEach(function (k) {
      if (Object.prototype.hasOwnProperty.call(saved, k) && saved[k] !== null && saved[k] !== undefined) merged[k] = saved[k];
    });
    if (merged.ac === null || merged.ac === '' || isNaN(Number(merged.ac))) merged.ac = null;
    else merged.ac = Number(merged.ac);
    if (!R.powerOf || merged.power !== R.powerOf(merged.power).id) merged.power = DEFAULTS.power;
    if (!merged.elem) merged.elemPlus = false;
    return merged;
  }

  function esc(text) {
    return String(text === undefined || text === null ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function seedSpells(saved) {
    var s = {};
    Object.keys(SPELL_DEFAULTS).forEach(function (k) { s[k] = SPELL_DEFAULTS[k]; });
    if (saved && typeof saved === 'object') {
      Object.keys(SPELL_DEFAULTS).forEach(function (k) {
        if (saved[k] !== undefined && saved[k] !== null && typeof saved[k] === typeof SPELL_DEFAULTS[k]) s[k] = saved[k];
      });
      if (saved.max) { s.max = {}; Object.keys(SPELL_DEFAULTS.max).forEach(function (k) { s.max[k] = Number(saved.max[k]) || 0; }); }
      if (saved.left) { s.left = {}; Object.keys(SPELL_DEFAULTS.left).forEach(function (k) { s.left[k] = Number(saved.left[k]) || 0; }); }
    }
    var lists = {};
    LEVELS.forEach(function (lv) {
      var seed = SPELL_SEED.filter(function (n) {
        var s = SPELL_BY_NAME[n];
        return s && s.level === lv;
      });
      var own = (saved.lists && saved.lists[lv]) || null;
      lists[lv] = (own && own.length) ? own.filter(function (n) { return SPELL_BY_NAME[n]; }) : seed;
    });
    s.lists = lists;
    return s;
  }

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
  }

  function setState(patch) {
    Object.keys(patch).forEach(function (k) { state[k] = patch[k]; });
    if (!state.elem) state.elemPlus = false;
    volley = null;
    save();
    render();
  }

  /* ---- controls ---- */

  el.power.addEventListener('input', function () {
    var p = R.POWERS[Number(el.power.value)];
    setState({ power: p.id });
  });

  el.ac.addEventListener('input', function () {
    var v = el.ac.value.trim();
    setState({ ac: v === '' ? null : Number(v) });
  });

  R.POWERS.forEach(function (p, i) {
    var stop = document.createElement('button');
    stop.type = 'button';
    stop.className = 'stop';
    stop.textContent = p.short;
    stop.style.left = 'calc(13px + (100% - 26px) * ' + (i / (R.POWERS.length - 1)) + ')';
    stop.addEventListener('click', function () {
      el.power.value = String(i);
      setState({ power: p.id });
    });
    el.stops.appendChild(stop);
  });

  CHIPS.forEach(function (chip) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.dataset.key = chip.key;
    b.textContent = chip.label;
    b.style.setProperty('--crgb', chip.rgb);
    b.addEventListener('click', function () {
      var next = !state[chip.key];
      var patch = {};
      patch[chip.key] = next;
      if (chip.key === 'elem' && !next) patch.elemPlus = false;
      setState(patch);
    });
    el.chips.appendChild(b);
  });

  el.tabVolley.addEventListener('click', function () { setView('volley'); });
  el.tabSurge.addEventListener('click', function () { setView('surge'); });
  el.tabSpells.addEventListener('click', function () { setView('spells'); });

  el.cast.addEventListener('click', function () {
    if (view === 'surge') { castSurge(); return; }
    volley = R.rollVolley(state);
    renderBoard(true);
    renderTally();
    var anyCrit = volley.beams.some(function (b) { return b.crit; });
    if (navigator.vibrate) navigator.vibrate(anyCrit ? [14, 45, 18] : 16);
  });

  /* ---- rendering ---- */

  function elemLabel() {
    if (!state.elem) return 'Elem';
    return state.elemPlus ? 'Elem 3d8' : 'Elem 2d8';
  }

  function setView(next) {
    view = next;
    el.viewVolley.classList.toggle('on', next === 'volley');
    el.viewSurge.classList.toggle('on', next === 'surge');
    el.viewSpells.classList.toggle('on', next === 'spells');
    el.tabVolley.setAttribute('aria-selected', next === 'volley' ? 'true' : 'false');
    el.tabSurge.setAttribute('aria-selected', next === 'surge' ? 'true' : 'false');
    el.tabSpells.setAttribute('aria-selected', next === 'spells' ? 'true' : 'false');
    el.acField.style.visibility = next === 'volley' ? 'visible' : 'hidden';
    el.wrench.hidden = next !== 'spells';
    el.cast.hidden = next === 'spells';
    el.castLabel.textContent = next === 'volley' ? 'Cast' : 'Surge';
    render();
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function castSurge() {
    if (!SURGE.rows || !SURGE.rows.length) {
      el.surgeText.textContent = 'The surge table did not load.';
      return;
    }
    var result = R.rollSurge(SURGE.rows);
    el.surgeRoll.textContent = result.roll;
    el.surgeRange.textContent = pad2(result.from) + '-' + pad2(result.to);
    el.surgeText.textContent = result.text;
    var html = '';
    result.dice.forEach(function (d) {
      html += '<span class="g"><span class="lbl">' + d.label + '</span>';
      html += '<span class="roll">' + d.values.join(',') + '</span>';
      html += '<span class="stot">= ' + d.total + '</span></span>';
    });
    el.surgeDice.innerHTML = html;
    if (navigator.vibrate) navigator.vibrate(result.dice.length ? [14, 45, 14] : 16);
  }

  function render() {
    var power = R.powerOf(state.power);

    el.spellName.textContent = view === 'volley' ? power.name : (view === 'surge' ? 'Wild magic surge' : 'Spells');
    el.power.value = String(R.POWERS.indexOf(power));
    var span = Number(el.power.max) - Number(el.power.min);
    el.power.style.setProperty('--fill', (span ? (Number(el.power.value) - Number(el.power.min)) / span * 100 : 0) + '%');

    Array.prototype.forEach.call(el.stops.children, function (s, i) {
      s.classList.toggle('on', R.POWERS[i].id === power.id);
    });

    Array.prototype.forEach.call(el.chips.children, function (b) {
      var key = b.dataset.key;
      var chip = CHIPS.filter(function (c) { return c.key === key; })[0];
      b.setAttribute('aria-pressed', state[key] ? 'true' : 'false');
      if (key === 'elem') b.textContent = elemLabel();
      if (chip.needs) b.hidden = !state[chip.needs];
    });

    if (el.ac.value !== (state.ac === null ? '' : String(state.ac))) {
      el.ac.value = state.ac === null ? '' : String(state.ac);
    }

    renderSummary();
    renderBoard(false);
    renderTally();
    renderSpells();
  }

  function renderBoard(animate) {
    var power = R.powerOf(state.power);
    var n = power.attacks;
    el.grid.style.setProperty('--cols', n === 4 ? '2' : '3');
    el.grid.innerHTML = '';

    for (var i = 0; i < n; i++) {
      var beam = volley ? volley.beams[i] : null;
      var cell = document.createElement('article');
      cell.className = 'cell';
      var preview = beam ? beam.groups : previewGroups();
      cell.style.setProperty('--beam', TYPE_RGB[preview[0] ? preview[0].type : 'force'] || '155,123,255');
      if (!animate) cell.style.animation = 'none';
      cell.style.setProperty('--i', String(i));
      if (beam) {
        if (beam.crit) cell.classList.add('crit');
        if (beam.hit === false) cell.classList.add('miss');
      } else {
        cell.classList.add('ghost');
      }
      cell.innerHTML = cellHtml(beam);
      el.grid.appendChild(cell);
    }
  }

  var TYPE_RGB = {
    force: '110,155,255',
    fire: '255,132,70',
    lightning: '255,212,71',
    necrotic: '122,216,111'
  };

  function renderSummary() {
    var power = R.powerOf(state.power);
    var beams = power.attacks + ' beam' + (power.attacks === 1 ? '' : 's');
    var attack = state.advantage
      ? 'attack 3d20+' + R.ATTACK_MOD + ' keep best'
      : 'attack d20+' + R.ATTACK_MOD;
    var crit = state.curse ? 'crit on 19-20' : 'crit on 20';

    var bits = [];
    power.dice.forEach(function (d, i) {
      bits.push(d.n + 'd' + d.s + (i === 0 && power.flat ? '+' + power.flat : '') +
        ' <em class="' + d.type + '">' + d.type + '</em>');
    });
    if (state.hex) bits.push('1d6 <em class="necrotic">necrotic</em>');
    var light = 0;
    if (state.elem) light = state.elemPlus ? 3 : 2;
    if (light) bits.push(light + 'd8 <em class="lightning">lightning</em>');
    if (state.curse) bits.push('+4');

    el.summary.innerHTML =
      '<span>' + beams + ' &middot; ' + attack + ' &middot; ' + crit + '</span>' +
      '<span>damage ' + bits.join(' + ') + '</span>';
  }

  function previewGroups() {
    var power = R.powerOf(state.power);
    var groups = [];
    power.dice.forEach(function (d) { groups.push({ label: d.n + 'd' + d.s, type: d.type }); });
    if (state.hex) groups.push({ label: '1d6', type: 'necrotic' });
    if (state.elem) groups.push({ label: state.elemPlus ? '3d8' : '2d8', type: 'lightning' });
    return groups;
  }

  function cellHtml(beam) {
    if (!beam) {
      var groups = previewGroups();
      var types = [];
      groups.forEach(function (g) { if (types.indexOf(g.type) === -1) types.push(g.type); });
      var flat = R.powerOf(state.power).flat + (state.curse ? 4 : 0);
      var out = '<div class="atk"><span class="at ghostnum">d20</span><span class="am">+' + R.ATTACK_MOD + '</span></div>';
      out += '<div class="d20"><span class="ghostroll">--</span></div>';
      out += '<div class="beam"></div>';
      out += '<div class="dmg"><div class="dtop"><span class="dt ghostnum">--</span><span class="kinds">';
      types.forEach(function (t) { out += '<em class="' + t + '">' + t + '</em>'; });
      out += '</span></div><div class="dice">';
      groups.forEach(function (g) {
        out += '<span class="g"><span class="lbl ' + g.type + '">' + g.label + '</span>';
        out += '<span class="roll ghostroll">--</span></span>';
      });
      if (flat) out += '<span class="g flat"><span class="lbl">+' + flat + '</span></span>';
      out += '</div></div>';
      return out;
    }

    var out = '<div class="atk">';
    out += '<span class="at">' + beam.total + '</span>';
    out += '<span class="am">+' + R.ATTACK_MOD + '</span>';
    if (beam.crit) out += '<span class="badge crit">crit</span>';
    else if (beam.hit === true) out += '<span class="badge hit">hit</span>';
    else if (beam.hit === false) out += '<span class="badge miss">miss</span>';
    out += '</div>';

    out += '<div class="d20">';
    beam.rolls.forEach(function (r) {
      out += '<span' + (r === beam.kept && beam.rolls.length > 1 ? ' class="kept"' : '') + '>' + r + '</span>';
    });
    out += '</div>';
    out += '<div class="beam"></div>';

    var types = [], i;
    for (i = 0; i < beam.groups.length; i++) {
      if (types.indexOf(beam.groups[i].type) === -1) types.push(beam.groups[i].type);
    }

    out += '<div class="dmg"><div class="dtop"><span class="dt">' + beam.damage + '</span><span class="kinds">';
    types.forEach(function (t) { out += '<em class="' + t + '">' + t + '</em>'; });
    out += '</span></div>';

    out += '<div class="dice">';
    beam.groups.forEach(function (g) {
      out += '<span class="g"><span class="lbl ' + g.type + '">' + g.label + '</span>';
      out += '<span class="roll' + (g.rolls.length > 3 ? ' tight' : '') + '">' + g.rolls.join(',') + '</span></span>';
    });
    if (beam.flat) out += '<span class="g flat"><span class="lbl">+' + beam.flat + '</span></span>';
    out += '</div></div>';

    return out;
  }

  function renderTally() {
    if (!volley) {
      el.tally.innerHTML = state.ac === null
        ? '<span style="color:#615c7d">No target AC set, so damage shows for every beam</span>'
        : '';
      return;
    }
    var t = R.tally(volley, state.ac);
    var out = '<span class="big">' + t.total + '</span><span>damage</span>';
    if (state.ac !== null) {
      out += '<span>&middot; ' + t.hits + ' hit' + (t.hits === 1 ? '' : 's');
      if (t.crits) out += ' &middot; ' + t.crits + ' crit' + (t.crits === 1 ? '' : 's');
      out += '</span>';
    }
    t.order.forEach(function (type) {
      out += '<em class="' + type + '">&middot; ' + t.byType[type] + ' ' + type + '</em>';
    });
    if (t.flat) out += '<em>&middot; ' + t.flat + ' flat</em>';
    el.tally.innerHTML = out;
  }

  /* ---- spells ---- */

  var editing = false;
  var dragged = false;

  function commit() { save(); renderSpells(); }

  function pipButton(full, lv, n, warlock) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'pip' + (warlock ? ' wl' : '') + (full ? ' full' : '');
    b.dataset.lv = String(lv);
    b.dataset.n = String(n);
    if (warlock) b.dataset.wl = '1';
    b.setAttribute('aria-label', (warlock ? 'Warlock slot ' : 'Slot ') + n);
    return b;
  }

  function editButton(sign, lv, warlock) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'mini';
    b.textContent = sign;
    b.dataset.edit = sign === '+' ? 'add' : 'take';
    b.dataset.lv = String(lv);
    if (warlock) b.dataset.wl = '1';
    return b;
  }

  function renderLevels() {
    var S = state.spell;
    el.levels.innerHTML = '';
    LEVELS.forEach(function (lv) {
      var max = S.max[lv] || 0;
      var left = Math.min(S.left[lv] || 0, max);
      var col = document.createElement('div');
      col.className = 'lv' + (lv === S.selected ? ' on' : '') + (editing ? ' editing' : '');
      if (lv > 0 && !max) col.classList.add('dim');
      col.dataset.lv = String(lv);

      var head = document.createElement('span');
      head.className = 'head';
      var n = document.createElement('span');
      n.className = 'n';
      n.textContent = String(lv);
      head.appendChild(n);
      var arrow = document.createElement('button');
      arrow.type = 'button';
      arrow.className = 'arrow';
      arrow.textContent = '›';
      arrow.setAttribute('aria-label', 'Show the spells of level ' + lv);
      head.appendChild(arrow);
      col.appendChild(head);

      var pips = document.createElement('span');
      pips.className = 'pips';
      for (var i = 1; i <= max; i++) pips.appendChild(pipButton(i <= left, lv, i, false));
      if (lv === WARLOCK_LEVEL && S.warlockMax) {
        var wlGroup = document.createElement('span');
        wlGroup.className = 'wlgroup';
        for (var w = 1; w <= S.warlockMax; w++) wlGroup.appendChild(pipButton(w <= S.warlockLeft, lv, w, true));
        pips.appendChild(wlGroup);
      }
      col.appendChild(pips);

      var edit = document.createElement('span');
      edit.className = 'edit';
      if (lv > 0) {
        edit.appendChild(editButton('-', lv, false));
        edit.appendChild(editButton('+', lv, false));
      }
      if (lv === WARLOCK_LEVEL && S.warlockMax) {
        var wl = document.createElement('span');
        wl.className = 'plus';
        wl.textContent = 'W';
        edit.appendChild(wl);
        edit.appendChild(editButton('-', lv, true));
        edit.appendChild(editButton('+', lv, true));
      }
      col.appendChild(edit);

      el.levels.appendChild(col);
    });

    if (editing) {
      var cell = document.createElement('div');
      cell.className = 'lv editing';
      var head2 = document.createElement('span');
      head2.className = 'head';
      var lbl = document.createElement('span');
      lbl.className = 'n';
      lbl.textContent = 'Lv';
      head2.appendChild(lbl);
      cell.appendChild(head2);
      var val = document.createElement('span');
      val.className = 'val';
      val.textContent = String(S.sorcererLevel);
      cell.appendChild(val);
      var ed = document.createElement('span');
      ed.className = 'edit';
      ed.style.display = 'flex';
      var down = document.createElement('button');
      down.type = 'button'; down.className = 'mini'; down.textContent = '-'; down.dataset.lvl = '-1';
      var up = document.createElement('button');
      up.type = 'button'; up.className = 'mini'; up.textContent = '+'; up.dataset.lvl = '1';
      ed.appendChild(down); ed.appendChild(up);
      cell.appendChild(ed);
      el.levels.appendChild(cell);
    }
  }

  function renderSpellList() {
    var S = state.spell;
    var list = S.lists[S.selected] || [];
    el.spellList.innerHTML = '';
    if (!list.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No spells at level ' + S.selected + ' yet. Open the grimoire with the arrow on the left to add some.';
      el.spellList.appendChild(empty);
      return;
    }
    list.forEach(function (name) {
      var spell = SPELL_BY_NAME[name];
      if (!spell) return;
      var card = document.createElement('div');
      card.className = 'card';
      card.dataset.name = name;
      var meta = '<span>' + esc(spell.time) + '</span><span>' + esc(spell.range) + '</span><span>' + esc(spell.duration) + '</span>';
      if (spell.components) meta += '<span class="cmp">' + esc(spell.components) + '</span>';
      if (spell.ritual) meta += '<span class="rit">ritual</span>';
      if (spell.concentration) meta += '<span class="rit">conc</span>';
      if (spell.source) meta += '<span class="src">' + esc(spell.source) + '</span>';
      card.innerHTML = '<div class="t">' + spell.name + '</div><div class="m">' + meta + '</div>';
      el.spellList.appendChild(card);
    });
  }

  function renderSpells() {
    var S = state.spell;
    el.dcValue.textContent = S.dc;
    el.spValue.textContent = S.sp + '/' + S.spMax;
    el.cunning.setAttribute('aria-pressed', S.cunning ? 'true' : 'false');
    el.sorcRest.setAttribute('aria-pressed', S.sorcRest ? 'true' : 'false');
    el.sorcRest.title = 'Restores ' + Math.floor(S.sorcererLevel / 2) + ' sorcery points';
    el.wrench.setAttribute('aria-pressed', editing ? 'true' : 'false');
    el.dcStat.classList.toggle('editing', editing);
    var list = S.lists[S.selected] || [];
    el.listTitle.textContent = 'Level ' + S.selected + ' spells · ' + list.length;
    renderLevels();
    renderSpellList();
  }

  function closeSheet() { el.sheet.hidden = true; }

  function renderBlocks(blocks) {
    var html = '';
    (blocks || []).forEach(function (b) {
      if (b.t === 'p') html += '<p>' + esc(b.text) + '</p>';
      else if (b.t === 'h') html += '<h3>' + esc(b.text) + '</h3>';
      else if (b.t === 'list') {
        html += '<ul>' + b.items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>';
      } else if (b.t === 'table') {
        if (b.caption) html += '<div class="tcap">' + esc(b.caption) + '</div>';
        html += '<table>';
        if (b.head && b.head.length) {
          html += '<thead><tr>' + b.head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead>';
        }
        html += '<tbody>' + b.rows.map(function (r) {
          return '<tr>' + r.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table>';
      }
    });
    return html;
  }

  function openSheet(name) {
    var spell = SPELL_BY_NAME[name];
    if (!spell) return;
    el.sheetTitle.textContent = spell.name;
    var meta = '<span>level ' + spell.level + '</span><span>' + esc(spell.time) + '</span><span>' + esc(spell.range) + '</span><span>' + esc(spell.duration) + '</span>';
    if (spell.components) meta += '<span class="cmp">' + esc(spell.components) + '</span>';
    if (spell.source) meta += '<span class="src">' + esc(spell.source) + '</span>';
    if (spell.ritual) meta += '<span class="rit">ritual</span>';
    if (spell.concentration) meta += '<span class="rit">concentration</span>';
    el.sheetMeta.innerHTML = meta;
    el.sheetText.innerHTML = renderBlocks(spell.blocks);
    el.sheetSearch.hidden = true;
    el.sheetList.hidden = true;
    el.sheetActions.innerHTML = '<button class="danger" type="button" id="dropSpell">Remove from level ' + state.spell.selected + '</button>';
    el.sheet.hidden = false;
    el.sheetActions.querySelector('#dropSpell').addEventListener('click', function () {
      var list = state.spell.lists[state.spell.selected] || [];
      var ix = list.indexOf(name);
      if (ix >= 0) list.splice(ix, 1);
      closeSheet();
      commit();
    });
  }

  function renderGrimoire(lv) {
    var q = (el.sheetSearch.value || '').trim().toLowerCase();
    var have = state.spell.lists[lv] || [];
    var rows = (SPELLBOOK.spells || []).filter(function (s) { return s.level === lv; })
      .filter(function (s) { return !q || s.name.toLowerCase().indexOf(q) >= 0; });
    el.sheetList.innerHTML = '';
    if (!rows.length) {
      var none = document.createElement('div');
      none.className = 'empty';
      none.textContent = 'Nothing matches.';
      el.sheetList.appendChild(none);
      return;
    }
    rows.forEach(function (s) {
      var row = document.createElement('div');
      row.className = 'row';
      var added = have.indexOf(s.name) >= 0;
      var name = document.createElement('span');
      name.textContent = s.name;
      var side = document.createElement('span');
      side.className = 'lv2';
      side.textContent = added ? 'in the list' : s.time;
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = added ? '\u2713' : '+';
      b.disabled = added;
      b.setAttribute('aria-label', added ? 'Already in the list' : 'Add ' + s.name);
      b.addEventListener('click', function () {
        var list = state.spell.lists[lv] || (state.spell.lists[lv] = []);
        if (list.indexOf(s.name) < 0) list.push(s.name);
        renderGrimoire(lv);
        renderSpellList();
        save();
      });
      row.appendChild(name);
      row.appendChild(side);
      row.appendChild(b);
      el.sheetList.appendChild(row);
    });
  }

  function openGrimoire(lv) {
    state.spell.selected = lv;
    el.sheetTitle.textContent = 'Grimoire, level ' + lv;
    el.sheetMeta.innerHTML = '<span>Tap + to add a spell to level ' + lv + '</span>';
    el.sheetText.textContent = '';
    el.sheetSearch.hidden = false;
    el.sheetSearch.value = '';
    el.sheetList.hidden = false;
    el.sheetActions.innerHTML = '';
    el.sheet.hidden = false;
    renderGrimoire(lv);
    commit();
  }

  el.wrench.addEventListener('click', function () { editing = !editing; commit(); });

  el.cunning.addEventListener('click', function () {
    var S = state.spell;
    S.cunning = !S.cunning;
    if (S.cunning) S.warlockLeft = Math.min(S.warlockMax, S.warlockLeft + 1);
    else S.warlockLeft = Math.max(0, S.warlockLeft - 1);
    commit();
  });

  el.sorcRest.addEventListener('click', function () {
    var S = state.spell;
    var gain = Math.floor(S.sorcererLevel / 2);
    S.sorcRest = !S.sorcRest;
    if (S.sorcRest) S.sp = Math.min(S.spMax, S.sp + gain);
    else S.sp = Math.max(0, S.sp - gain);
    commit();
  });

  el.viewSpells.addEventListener('click', function (ev) {
    var m = ev.target.closest('.mini[data-act]');
    if (!m) return;
    var S = state.spell;
    var act = m.dataset.act;
    if (act === 'dc+') S.dc++;
    else if (act === 'dc-') S.dc = Math.max(0, S.dc - 1);
    else if (act === 'sp+') S.sp = Math.min(S.spMax, S.sp + 1);
    else if (act === 'sp-') S.sp = Math.max(0, S.sp - 1);
    commit();
  });

  el.levels.addEventListener('click', function (ev) {
    var S = state.spell;
    var pip = ev.target.closest('.pip');
    if (pip) {
      var lv = Number(pip.dataset.lv), n = Number(pip.dataset.n);
      var full = pip.classList.contains('full');
      if (pip.dataset.wl) {
        S.warlockLeft = full ? Math.max(0, S.warlockLeft - 1) : n;
      } else {
        S.left[lv] = full ? Math.max(0, S.left[lv] - 1) : n;
      }
      commit();
      return;
    }
    var eb = ev.target.closest('.edit .mini');
    if (eb) {
      var l = Number(eb.dataset.lv);
      var d = eb.dataset.edit === 'add' ? 1 : -1;
      if (eb.dataset.wl) {
        var wBefore = S.warlockMax;
        S.warlockMax = Math.max(0, Math.min(9, wBefore + d));
        if (S.warlockMax > wBefore) S.warlockLeft = Math.min(S.warlockMax, S.warlockLeft + (S.warlockMax - wBefore));
        else S.warlockLeft = Math.min(S.warlockLeft, S.warlockMax);
      } else {
        var before = S.max[l] || 0;
        S.max[l] = Math.max(0, Math.min(9, before + d));
        if (S.max[l] > before) S.left[l] = Math.min(S.max[l], (S.left[l] || 0) + (S.max[l] - before));
        else S.left[l] = Math.min(S.left[l], S.max[l]);
      }
      commit();
      return;
    }
    var lvBtn = ev.target.closest('.mini[data-lvl]');
    if (lvBtn) {
      S.sorcererLevel = Math.max(1, Math.min(20, S.sorcererLevel + Number(lvBtn.dataset.lvl)));
      commit();
      return;
    }
    var row = ev.target.closest('.lv');
    if (row && row.dataset.lv !== undefined) { S.selected = Number(row.dataset.lv); commit(); }
  });

  el.spellList.addEventListener('click', function (ev) {
    if (dragged) { dragged = false; return; }
    var card = ev.target.closest('.card');
    if (card) openSheet(card.dataset.name);
  });

  el.spellList.addEventListener('pointerdown', function (ev) {
    var card = ev.target.closest('.card');
    if (!card) return;
    var startY = ev.clientY, startX = ev.clientX, timer = null, dragging = false;

    function begin() {
      timer = null;
      dragging = true;
      card.classList.add('dragging');
      if (navigator.vibrate) navigator.vibrate(12);
    }

    function move(e) {
      if (!dragging) {
        if (Math.abs(e.clientY - startY) > 8 || Math.abs(e.clientX - startX) > 8) {
          if (timer) { clearTimeout(timer); timer = null; }
          cleanup();
        }
        return;
      }
      if (e.cancelable) e.preventDefault();
      var cards = Array.prototype.slice.call(el.spellList.querySelectorAll('.card'));
      for (var i = 0; i < cards.length; i++) {
        var r = cards[i].getBoundingClientRect();
        if (e.clientY < r.top + r.height / 2 && cards[i] !== card) {
          el.spellList.insertBefore(card, cards[i]);
          startY = e.clientY;
          dragged = true;
          break;
        }
      }
    }

    function up() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (dragging) {
        card.classList.remove('dragging');
        dragged = true;
        setTimeout(function () { dragged = false; }, 80);
        var order = Array.prototype.slice.call(el.spellList.querySelectorAll('.card'))
          .map(function (c) { return c.dataset.name; });
        state.spell.lists[state.spell.selected] = order;
        save();
      }
      cleanup();
    }

    function blockScroll(e) { if (dragging && e.cancelable) e.preventDefault(); }
    function cleanup() {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      window.removeEventListener('touchmove', blockScroll);
    }

    timer = setTimeout(begin, 320);
    window.addEventListener('pointermove', move, { passive: false });
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
    window.addEventListener('touchmove', blockScroll, { passive: false });
  });

  el.addSpell.addEventListener('click', function () { openGrimoire(state.spell.selected); });

  el.sheetClose.addEventListener('click', closeSheet);
  el.sheet.addEventListener('click', function (ev) { if (ev.target === el.sheet) closeSheet(); });
  el.sheetSearch.addEventListener('input', function () { renderGrimoire(state.spell.selected); });

  render();
})();
</script>
</body>
</html>

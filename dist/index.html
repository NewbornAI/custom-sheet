    var own = (saved && Array.isArray(saved.features)) ? saved.features : null;
    var keys = null;
    if (!own) {
      if (saved && Array.isArray(saved.featureKeys)) keys = saved.featureKeys;
      else if (!fresh) keys = CHAR_DEFAULTS.features.map(function (f) { return f.key; });
    }
    var c = {
      name: '',
      level: CHAR_DEFAULTS.level,
      classes: CHAR_DEFAULTS.classes.map(function (k) {
        return { name: k.name, level: k.level, subclass: k.subclass || '' };
      }),
      abilities: {},
      saves: {},
      skills: {},
      features: own ? [] : (keys || []).map(function (k) {
        return rowForKey(k);
      }).filter(Boolean),
      init: CHAR_DEFAULTS.init,
      ac: CHAR_DEFAULTS.ac,
      hp: { current: 0, max: 0 },
      dice: (CHAR_DEFAULTS.dice || []).map(function (d) { return { type: d.type, spent: false }; }),
      history: []
    };
    ABILITIES.forEach(function (a) {
      c.abilities[a.key] = CHAR_DEFAULTS.abilities[a.key];
      c.saves[a.key] = CHAR_DEFAULTS.saves[a.key];
    });
    SKILLS.forEach(function (s) { c.skills[s.key] = 0; });
    /* A character that is new starts from nothing: no name, no features,
       no dice, and the scores at ten. */
    if (fresh) {
      c.name = '';
      c.level = 1;
      c.classes = [];
      ABILITIES.forEach(function (a) {
        c.abilities[a.key] = 10;
        c.saves[a.key] = 0;
      });
      c.dice = [];
      c.init = 0;
      c.ac = null;
      c.hp = { current: 0, max: 0 };
      c.history = [];
    }
    if (saved && typeof saved === 'object') {
      if (typeof saved.name === 'string') c.name = saved.name;
      if (saved.level) c.level = Math.max(1, Math.min(20, Number(saved.level) || CHAR_DEFAULTS.level));
      if (Array.isArray(saved.classes)) {
        c.classes = saved.classes.filter(function (k) { return k && k.name; }).map(function (k) {
          return {
            name: String(k.name),
            level: Math.max(0, Math.min(20, Number(k.level) || 0)),
            subclass: k.subclass ? String(k.subclass) : ''
          };
        });
      }
      /* The initiative follows the dexterity until the player sets one. */
      if (saved.initTouched) {
        c.init = Number(saved.init) || 0;
        c.initTouched = true;
      }
      if (saved.ac !== undefined && saved.ac !== null && saved.ac !== '') c.ac = Number(saved.ac) || 0;
      ABILITIES.forEach(function (a) {
        if (saved.abilities && saved.abilities[a.key] !== undefined && saved.abilities[a.key] !== null) {
          c.abilities[a.key] = Math.max(0, Math.min(30, Number(saved.abilities[a.key]) || 0));
        }
        if (saved.saves && saved.saves[a.key] !== undefined) c.saves[a.key] = profValue(saved.saves[a.key]);
      });
      SKILLS.forEach(function (s) {
        if (saved.skills && saved.skills[s.key] !== undefined) c.skills[s.key] = profValue(saved.skills[s.key]);
      });
      if (saved.hp) {
        c.hp.current = Math.max(0, Number(saved.hp.current) || 0);
        c.hp.max = Math.max(0, Number(saved.hp.max) || 0);
      }
      if (saved.dice && saved.dice.length) {
        c.dice = saved.dice.map(function (d) { return { type: Number(d.type) || 6, spent: !!d.spent }; });
      }
      /* The classes own the dice, and the record says which of them were
         spent, so a level up brings the new dice and keeps the old marks. */
      var fromClasses = diceFromClasses(c.classes);
      if (fromClasses.length) {
        var spentByType = {};
        (c.dice || []).forEach(function (d) { if (d.spent) spentByType[d.type] = (spentByType[d.type] || 0) + 1; });
        fromClasses.forEach(function (d) {
          if (spentByType[d.type]) { d.spent = true; spentByType[d.type] -= 1; }
        });
        c.dice = fromClasses;
      }
      if (saved.features && saved.features.length) {
        var savedByKey = {};
        saved.features.forEach(function (f) { savedByKey[f.key] = f; });
        c.features = c.features.map(function (f) {
          var s = savedByKey[f.key];
          if (!s) return f;
          var copy = Object.assign({}, f);
          if (s.name) copy.name = s.name;
          if (s.max !== undefined) copy.max = Math.max(0, Number(s.max) || 0);
          if (s.left !== undefined) copy.left = Math.max(0, Number(s.left) || 0);
          if (s.recovery !== undefined) copy.recovery = s.recovery;
          if (s.cost !== undefined) copy.cost = s.cost;
          if (s.short !== undefined) copy.short = s.short;
          /* the hidden flag follows the data, unless the player moved it */
          copy.hidden = s.toggled ? !!s.hidden : !!f.hidden;
          return copy;
        });
        /* the features that are not in the seed any more */
        saved.features.forEach(function (f) {
          var known = c.features.some(function (x) { return x.key === f.key; });
          if (!known) c.features.push(copyRow(f));
        });
      }
      if (saved.history && saved.history.length) {
        c.history = saved.history.filter(function (h) { return h && typeof h === 'object'; }).slice(-60);
      }
    }
    /* The level of a character is the sum of its classes, when it has any. */
    if (c.classes.length) c.level = Math.max(1, Math.min(20, SR.classLevels(c.classes)));
    return c;
  }

  /* ---- the sheet ---- */

  function buildChar() {
    ABILITIES.forEach(function (a) {
      var col = document.createElement('div');
      col.className = 'abcol';

      var tile = document.createElement('div');
      tile.className = 'ab';
      tile.innerHTML = '<span class="an">' + a.name + '</span>' +
        '<input class="cinput" type="number" inputmode="numeric" min="0" max="30" data-ab="' + a.key + '" aria-label="' + a.long + ' score">' +
        '<span class="am" data-mod="' + a.key + '">+0</span>';
      col.appendChild(tile);

      /* The saving throw rides under the ability it comes from. */
      var save = document.createElement('div');
      save.className = 'prow';
      save.dataset.kind = 'save';
      save.dataset.key = a.key;
      save.innerHTML = '<span class="dot"></span><span class="nm dim">save</span>' +
        '<span class="vl">+0</span>';
      col.appendChild(save);

      E.charAbilities.appendChild(col);
    });

    SKILLS.forEach(function (s) {
      var row = document.createElement('div');
      row.className = 'prow';
      row.dataset.kind = 'skill';
      row.dataset.key = s.key;
      row.innerHTML = '<span class="dot"></span><span class="nm">' + s.name + '</span>' +
        '<span class="abk">' + s.ab.toUpperCase() + '</span><span class="vl">+0</span>';
      E.charSkills.appendChild(row);
    });
  }

  function renderChar() {
    E.charBody.classList.toggle('editing', editingChar);
    E.charName.hidden = !editingChar;
    E.charNameShow.hidden = editingChar;
    if (!editingChar) E.charNameShow.textContent = CH.name || 'Unnamed character';

    if (document.activeElement !== E.charName) E.charName.value = CH.name;
    if (document.activeElement !== E.charAc) {
      E.charAc.value = CH.ac === null ? '' : String(CH.ac);
    }
    if (document.activeElement !== E.charInit) E.charInit.value = String(SR.initMod(CH));
    if (document.activeElement !== E.charLevel) E.charLevel.value = String(CH.level);
    if (document.activeElement !== E.charHpNow) {
      E.charHpNow.value = CH.hp.current ? String(CH.hp.current) : '';
    }
    if (document.activeElement !== E.charHpMax) {
      E.charHpMax.value = CH.hp.max ? String(CH.hp.max) : '';
    }
    E.charHpDown.disabled = !CH.hp.current;
    E.charHpUp.disabled = CH.hp.max > 0 && CH.hp.current >= CH.hp.max;
    E.charHpRewind.disabled = !CH.history.length;
    E.charHpRewind.title = CH.history.length
      ? 'Rewind the last change, ' + CH.history.length + ' to go back'
      : 'Nothing to rewind';

    ABILITIES.forEach(function (a) {
      var input = E.charAbilities.querySelector('[data-ab="' + a.key + '"]');
      if (input && document.activeElement !== input) input.value = String(CH.abilities[a.key]);
      var mod = E.charAbilities.querySelector('[data-mod="' + a.key + '"]');
      if (mod) mod.textContent = SR.sign(SR.abilityMod(CH.abilities[a.key]));
    });

    ABILITIES.forEach(function (a) {
      var row = E.charAbilities.querySelector('[data-kind="save"][data-key="' + a.key + '"]');
      if (!row) return;
      var v = Number(CH.saves[a.key]) || 0;
      row.classList.toggle('prof', v === 1);
      row.classList.toggle('exp', v === 2);
      row.querySelector('.vl').textContent = SR.sign(SR.saveMod(CH, a.key));
      row.title = a.long + ' saving throw, ' + SR.profLabel(v);
    });

    SKILLS.forEach(function (s) {
      var row = E.charSkills.querySelector('[data-key="' + s.key + '"]');
      if (!row) return;
      var v = Number(CH.skills[s.key]) || 0;
      row.classList.toggle('prof', v === 1);
      row.classList.toggle('exp', v === 2);
      row.querySelector('.vl').textContent = SR.sign(SR.skillMod(CH, s.key));
      row.title = s.name + ', ' + SR.profLabel(v);
    });

    /* The ability the character casts with is the one of the class that
       carries the most levels. */
    var ability = C.primaryAbility(CH);
    E.charDerived.innerHTML =
      '<span>proficiency <b>' + SR.sign(SR.profBonus(CH.level)) + '</b></span>' +
      '<span>spell attack <b>' + SR.sign(SR.spellAttack(CH, ability)) + '</b></span>' +
      '<span>save DC <b>' + SR.spellDC(CH, ability) + '</b></span>' +
      '<span>passive perception <b>' + (10 + SR.skillMod(CH, 'perception')) + '</b></span>';

    var rows = C.classRows(CH);
    E.charLevel.disabled = rows.length > 0;
    if (rows.length && document.activeElement !== E.charLevel) E.charLevel.value = String(SR.classLevels(rows));
    E.charClassSum.hidden = !rows.length;
    E.charClassSum.textContent = rows.map(function (r) {
      return r.name + ' ' + r.level + (r.subclass ? ', ' + r.subclass : '');
    }).join(' · ');

    renderDice();
    if (editingChar) {
      buildClasses();
      buildStyle();
    }
  }

  /* ---- the classes ---- */

  function classes() {
    var ch = api.character().char;
    if (!Array.isArray(ch.classes)) ch.classes = [];
    return ch.classes;
  }

  /* The level of the character is the sum of its classes. */
  function syncLevel() {
    var ch = api.character().char;
    ch.level = Math.max(1, Math.min(20, SR.classLevels(ch.classes || [])));
  }

  function openClassPicker(index, onPick) {
    var list = C.classData.map(function (c) {
      var what = c.caster === 'full' ? 'full caster' : (c.caster === 'pact' ? 'pact magic' : ((c.caster === 'half' || c.caster === 'artificer') ? 'half caster' : 'no spellcasting'));
      return '<div class="crow" data-c="' + C.esc(c.name) + '"><span class="cn">' + C.esc(c.name) + '</span>' +
        '<span class="cl">' + C.esc(what + (c.ability ? ', ' + c.ability.toUpperCase() : '')) + '</span></div>';
    }).join('');
    api.sheet.open({
      id: 'pickclass',
      title: index >= 0 ? 'The class' : 'A class to add',
      metaClass: 'sheet-meta one',
      meta: '<span>Tap a class.</span>',
      list: list,
      onList: function (ev) {
        var row = ev.target.closest('[data-c]');
        if (!row) return;
        onPick(row.dataset.c);
        api.sheet.close();
      }
    });
  }

  function openSubclassPicker(index) {
    var row = classes()[index];
    if (!row) return;
    var info = C.classInfo(row.name);
    var list = ((info && info.subclasses) || []).map(function (s) {
      return '<div class="crow" data-s="' + C.esc(s.name) + '"><span class="cn">' + C.esc(s.name) + '</span>' +
        '<span class="cl">' + C.esc(s.source) + '</span></div>';
    }).join('') + '<div class="crow" data-s=""><span class="cn">No subclass</span></div>';
    api.sheet.open({
      id: 'picksub',
      title: info ? info.name : 'The subclass',
      metaClass: 'sheet-meta one',
      meta: '<span>' + C.esc((info && info.subclassTitle) || 'Tap the subclass.') + '</span>',
      list: list,
      onList: function (ev) {
        var picked = ev.target.closest('[data-s]');
        if (!picked) return;
        classes()[index].subclass = picked.dataset.s;
        api.sheet.close();
        commitChar();
      }
    });
  }

  function buildClasses() {
    if (!E.charClasses) return;
    var list = classes();
    E.charClasses.innerHTML = '';
    if (!list.length) {
      var none = document.createElement('p');
      none.className = 'note';
      none.textContent = 'No class yet. The plus adds one.';
      E.charClasses.appendChild(none);
    }
    list.forEach(function (k, ix) {
      var info = C.classInfo(k.name) || {};
      var what = info.caster === 'full' ? 'full caster' : (info.caster === 'pact' ? 'pact magic' : ((info.caster === 'half' || info.caster === 'artificer') ? 'half caster' : 'no spellcasting'));
      var row = document.createElement('div');
      row.className = 'srow clrow';
      row.dataset.ix = String(ix);
      row.innerHTML =
        '<span class="t"><button class="clname" type="button" data-pick="name">' + C.esc(k.name || 'A class') + '</button>' +
        '<button class="clsub" type="button" data-pick="sub">' + C.esc(k.subclass || 'no subclass') + '</button></span>' +
        '<span class="d">' + C.esc(what + (info.ability ? ', ' + info.ability.toUpperCase() : '')) + '</span>' +
        '<button class="mini" type="button" data-lv="-">&minus;</button>' +
        '<span class="clvl">' + k.level + '</span>' +
        '<button class="mini" type="button" data-lv="+">+</button>' +
        '<button class="cdel" type="button" data-del="1">&times;</button>';
      E.charClasses.appendChild(row);
    });
  }

  /* ---- the style of the character ---- */

  /* The colours and the icon are the character's own, and they are set
     here, in the edit mode, so a stray tap never repaints the app at the
     table. The gallery shows every one of them at once. */
  function buildStyle() {
    if (!E.charThemes) return;
    var rec = api.character();
    E.charThemes.innerHTML = '';
    E.charIcons.innerHTML = '';

    C.themes.forEach(function (t) {
      var on = (rec.theme || '') === t.id;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'gcell' + (on ? ' on' : '');
      b.dataset.theme = t.id;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.setAttribute('aria-label', t.label + ', ' + t.blurb + (on ? ', on' : ''));
      b.innerHTML = '<span class="gprev" style="background:' + t.swatch[0] + ';border-color:' + t.swatch[1] + '">' +
        '<i style="background:' + t.swatch[1] + '"></i><i style="background:' + t.swatch[2] + '"></i></span>' +
        '<span class="gname">' + C.esc(t.label) + '</span>';
      b.addEventListener('click', function () {
        if ((rec.theme || '') === t.id) return;
        rec.theme = t.id;
        commitChar();
      });
      E.charThemes.appendChild(b);
    });

    Object.keys(C.icons).forEach(function (key) {
      var on = C.iconOf(rec) === key;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'gcell' + (on ? ' on' : '');
      b.dataset.icon = key;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.setAttribute('aria-label', C.icons[key].label + ', ' + C.icons[key].blurb + (on ? ', on' : ''));
      b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + C.icons[key].svg + '</svg>';
      b.addEventListener('click', function () {
        if (C.iconOf(rec) === key) return;
        rec.icon = key;
        commitChar();
      });
      E.charIcons.appendChild(b);
    });
  }

  /* ---- the hit dice ---- */

  function dieSvg(type) {
    var pts = SR.DIE_SHAPES[type];
    if (!pts) {
      var built = [], i, a;
      for (i = 0; i < type; i++) {
        a = -Math.PI / 2 + i * 2 * Math.PI / type;
        built.push((12 + 9.2 * Math.cos(a)).toFixed(2) + ',' + (12 + 9.2 * Math.sin(a)).toFixed(2));
      }
      pts = built.join(' ');
    }
    var label = SR.DIE_LABEL[type] || { y: 15.4, size: 9 };
    return '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
      '<polygon points="' + pts + '" fill="none" stroke="currentColor" stroke-width="1.5"/>' +
      '<text x="12" y="' + label.y + '" text-anchor="middle" font-size="' + label.size + '" fill="currentColor" ' +
      'font-family="Cinzel, Georgia, serif">' + type + '</text></svg>';
  }

  /* The dice of a character are the dice of its classes: a sorcerer rolls
     a d6 and a warlock a d8. A character with no class keeps the ones it
     was given. */
  function diceFromClasses(classes) {
    var out = [];
    (classes || []).forEach(function (k) {
      var info = C.classInfo(k.name);
      var known = (C.seeds && C.seeds.dice) || {};
      var die = (info && info.hd) || known[k.name] || 6;
      var n = Number(k.level) || 0;
      for (var i = 0; i < n; i++) out.push({ type: die, spent: false });
    });
    return out;
  }

  function countDice(type) {
    var n = 0;
    (CH.dice || []).forEach(function (d) { if (d.type === type) n++; });
    return n;
  }

  function renderDice() {
    E.diceBox.innerHTML = '';

    if (editingChar) {
      if (C.classRows(CH).length) {
        var from = document.createElement('span');
        from.className = 'dnote';
        from.textContent = 'The dice come from the classes.';
        E.diceBox.appendChild(from);
        return;
      }
      var grid = document.createElement('div');
      grid.className = 'diceedit';
      [12, 10, 8, 6].forEach(function (t) {
        var row = document.createElement('div');
        row.className = 'drow';
        row.innerHTML = '<span class="dico">' + dieSvg(t) + '</span>' +
          '<span class="dty">d' + t + '</span>' +
          '<button class="mini" type="button" data-type="' + t + '" data-sign="-">&minus;</button>' +
          '<span class="dval">' + countDice(t) + '</span>' +
          '<button class="mini" type="button" data-type="' + t + '" data-sign="+">+</button>';
        grid.appendChild(row);
      });
      E.diceBox.appendChild(grid);
      return;
    }

    /* One counter for each kind of die, so a row of eleven dice does not
       wrap on a phone: the shape of the die, what is left of it, and a
       button to spend one or to take one back. */
    var kinds = {};
    (CH.dice || []).forEach(function (d) {
      if (!kinds[d.type]) kinds[d.type] = { total: 0, left: 0 };
      kinds[d.type].total += 1;
      if (!d.spent) kinds[d.type].left += 1;
    });
    var types = Object.keys(kinds).map(Number).sort(function (a, b) { return b - a; });
    if (!types.length) {
      var none = document.createElement('span');
      none.className = 'dnote';
      none.textContent = 'No hit dice yet.';
      E.diceBox.appendChild(none);
      return;
    }
    types.forEach(function (t) {
      var row = document.createElement('div');
      row.className = 'dcount';
      row.innerHTML = '<span class="dico">' + dieSvg(t) + '</span>' +
        '<span class="dnum">' + kinds[t].left + '<span class="dof"> of ' + kinds[t].total + '</span></span>';
      var spend = document.createElement('button');
      spend.type = 'button';
      spend.className = 'dsp';
      spend.dataset.type = String(t);
      spend.setAttribute('aria-label', 'Spend one d' + t);
      spend.textContent = '\u2212';
      row.appendChild(spend);
      if (kinds[t].left < kinds[t].total) {
        var back = document.createElement('button');
        back.type = 'button';
        back.className = 'dsp';
        back.dataset.type = String(t);
        back.dataset.back = '1';
        back.setAttribute('aria-label', 'Take one d' + t + ' back');
        back.textContent = '+';
        row.appendChild(back);
      }
      E.diceBox.appendChild(row);
    });
  }

  /* ---- the rests ---- */

  function pushSnapshot() {
    CH.history.push(SR.snapshot(CH, api.character().spells));
    if (CH.history.length > 60) CH.history.shift();
  }

  function setHp(next) {
    if (next === CH.hp.current) return;
    pushSnapshot();
    CH.hp.current = next;
    commitChar();
  }

  function applyRest(result) {
    CH.hp.current = result.hp;
    CH.hp.max = result.hpmax;
    if (result.dice) CH.dice = result.dice;
    CH.features = result.features;
    var S = api.character().spells;
    S.left = result.left;
    S.warlockLeft = result.warlockLeft;
    S.sp = result.sp;
    S.cunning = result.cunning;
    S.sorcRest = result.sorcRest;
  }

  function slotsDiffer(a, b) {
    var keys = {}, k;
    for (k in (a || {})) keys[k] = 1;
    for (k in (b || {})) keys[k] = 1;
    for (k in keys) if ((a[k] || 0) !== (b[k] || 0)) return true;
    return false;
  }

  function doRest(kind) {
    var before = SR.snapshot(CH, api.character().spells);
    var after = kind === 'long' ? SR.longRest(CH, api.character().spells) : SR.shortRest(CH, api.character().spells);
    CH.history.push(before);
    if (CH.history.length > 60) CH.history.shift();
    applyRest(after);
    commitChar();
    note(restNote(kind, before, after));
    if (navigator.vibrate) navigator.vibrate([14, 40, 14]);
  }

  /* What the rest actually gave back, so the note says it. */
  function restNote(kind, before, after) {
    var names = [];
    (after.features || []).forEach(function (f, i) {
      var b = (before.features || [])[i];
      if (b && f.left > b.left) names.push(f.name);
    });
    if (after.warlockLeft > before.warlockLeft && names.indexOf('Warlock spell slots') < 0) {
      names.push('Warlock spell slots');
    }
    if (kind === 'long') {
      var bits = [];
      if (after.hp !== before.hp) bits.push('hit points');
      if (slotsDiffer(after.left, before.left) || after.warlockLeft !== before.warlockLeft) bits.push('spell slots');
      if (after.sp !== before.sp) bits.push('sorcery points');
      if (names.length) bits.push(names.join(' and '));
      return 'Long rest' + (bits.length ? ': ' + bits.join(', ') + ' back.' : ': nothing to give back.');
    }
    return 'Short rest' + (names.length ? ': ' + names.join(' and ') + ' back.' : ': nothing to give back yet.');
  }

  function note(message) {
    E.charNote.textContent = message;
    if (noteTimer) clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { E.charNote.textContent = ''; }, 2600);
  }

  /* ---- the page ---- */

  Sheet.page({
    id: 'character',
    title: function (a) {
      var c = a.character().char || {};
      return c.name || 'Character';
    },
    tab: 'Character',
    home: true,
    order: 0,
    slice: 'char',
    blurb: 'The sheet of the character. It is always there.',
    html: [
      '<div class="charbody" id="charBody">',
      '  <div class="csname" id="charNameWrap">',
      '    <span class="ck">NAME</span>',
      '    <input class="cinput" id="charName" type="text" placeholder="your character" aria-label="Character name">',
      '    <span class="cname-show" id="charNameShow"></span>',
      '  </div>',
      '  <div class="clsum" id="charClassSum"></div>',
      '  <div class="ctop">',
      '    <label class="ctile" for="charAc">',
      '      <span class="ck">AC</span>',
      '      <input class="cinput" id="charAc" type="number" inputmode="numeric" min="0" max="40" placeholder="--" aria-label="Armor class">',
      '    </label>',
      '    <label class="ctile" for="charInit">',
      '      <span class="ck">INIT</span>',
      '      <input class="cinput" id="charInit" type="number" inputmode="numeric" min="-9" max="20" placeholder="0" aria-label="Initiative modifier">',
      '    </label>',
      '    <label class="ctile" for="charLevel">',
      '      <span class="ck">LEVEL</span>',
      '      <input class="cinput" id="charLevel" type="number" inputmode="numeric" min="1" max="20" placeholder="1" aria-label="Character level">',
      '    </label>',
      '  </div>',
      '  <div class="hpstrip">',
      '    <span class="ck">HP</span>',
      '    <input class="cinput cur" id="charHpNow" type="number" inputmode="numeric" min="0" placeholder="--" aria-label="Current hit points">',
      '    <span class="of">/</span>',
      '    <input class="cinput max" id="charHpMax" type="number" inputmode="numeric" min="0" placeholder="--" aria-label="Maximum hit points">',
      '    <span class="tools">',
      '      <button class="mini" id="charHpDown" type="button" aria-label="Lose a hit point">&minus;</button>',
      '      <button class="mini" id="charHpUp" type="button" aria-label="Gain a hit point">+</button>',
      '      <button class="mini" id="charHpRewind" type="button" aria-label="Rewind the last change">',
      '        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">',
      '          <path d="M3.5 12a8.5 8.5 0 1 0 2.8-6.3"/><path d="M3.5 4.4v5.2h5.2"/>',
      '        </svg>',
      '      </button>',
      '    </span>',
      '  </div>',
      '  <div class="dicebox" id="diceBox"></div>',
      '  <div class="cshead"><span>Abilities</span><span class="rule"></span></div>',
      '  <div class="abgrid" id="charAbilities"></div>',
      '  <div class="derived" id="charDerived"></div>',
      '  <div class="cshead"><span>Skills</span><span class="rule"></span></div>',
      '  <div class="sgrid" id="charSkills"></div>',
      '  <div class="charstyle" id="charStyle">',
      '    <div class="cshead"><span>Classes</span><span class="rule"></span><button class="mini" id="addClass" type="button" aria-label="Add a class">+</button></div>',
      '    <div class="fcards" id="charClasses"></div>',
      '    <div class="cshead"><span>Colours</span><span class="rule"></span></div>',
      '    <div class="gal" id="charThemes"></div>',
      '    <div class="cshead"><span>Icon</span><span class="rule"></span></div>',
      '    <div class="gal icons" id="charIcons"></div>',
      '  </div>',
      '</div>',
      '<div class="charfoot">',
      '  <p class="note" id="charNote"></p>',
      '  <div class="rests">',
      '    <button class="rest" id="restShort" type="button">Short rest</button>',
      '    <button class="rest" id="restLong" type="button">Long rest</button>',
      '  </div>',
      '</div>'
    ].join('\n'),

    seed: seed,

    mount: function (root, a) {
    a.core.data('classes');
      api = a;
      CH = a.character().char;
      E = {
        charBody: root.querySelector('#charBody'),
        charNameWrap: root.querySelector('#charNameWrap'),
        charName: root.querySelector('#charName'),
        charNameShow: root.querySelector('#charNameShow'),
        charAc: root.querySelector('#charAc'),
        charInit: root.querySelector('#charInit'),
        charLevel: root.querySelector('#charLevel'),
        charHpNow: root.querySelector('#charHpNow'),
        charHpMax: root.querySelector('#charHpMax'),
        charHpDown: root.querySelector('#charHpDown'),
        charHpUp: root.querySelector('#charHpUp'),
        charHpRewind: root.querySelector('#charHpRewind'),
        diceBox: root.querySelector('#diceBox'),
        charAbilities: root.querySelector('#charAbilities'),
        charDerived: root.querySelector('#charDerived'),
        charSkills: root.querySelector('#charSkills'),
        charClassSum: root.querySelector('#charClassSum'),
        charClasses: root.querySelector('#charClasses'),
        addClass: root.querySelector('#addClass'),
        charThemes: root.querySelector('#charThemes'),
        charIcons: root.querySelector('#charIcons'),
        charNote: root.querySelector('#charNote'),
        restShort: root.querySelector('#restShort'),
        restLong: root.querySelector('#restLong')
      };

      buildChar();

      E.charName.addEventListener('input', function () {
        CH.name = E.charName.value;
        commitChar();
      });

      /* The name opens the list of the characters. */
  
      /* The classes are set in the section the wrench opens. */
      E.charClasses.addEventListener('click', function (ev) {
        var row = ev.target.closest('.clrow');
        if (!row) return;
        var ix = Number(row.dataset.ix);
        var pick = ev.target.closest('[data-pick]');
        if (pick) {
          if (pick.dataset.pick === 'name') {
            openClassPicker(ix, function (name) {
              classes()[ix].name = name;
              classes()[ix].subclass = '';
              syncLevel();
              commitChar();
            });
          } else {
            openSubclassPicker(ix);
          }
          return;
        }
        if (ev.target.closest('[data-del]')) {
          classes().splice(ix, 1);
          syncLevel();
          commitChar();
          return;
        }
        var step = ev.target.closest('[data-lv]');
        if (step) {
          var k = classes()[ix];
          k.level = Math.max(0, Math.min(20, k.level + (step.dataset.lv === '+' ? 1 : -1)));
          syncLevel();
          commitChar();
        }
      });

      E.addClass.addEventListener('click', function () {
        openClassPicker(-1, function (name) {
          classes().push({ name: name, level: 1, subclass: '' });
          syncLevel();
          commitChar();
        });
      });

      E.charAc.addEventListener('input', function () {
        var v = E.charAc.value.trim();
        CH.ac = v === '' ? null : Number(v);
        commitChar();
      });

      E.charInit.addEventListener('input', function () {
        var v = E.charInit.value.trim();
        CH.init = v === '' ? 0 : Number(v);
        CH.initTouched = true;
        commitChar();
      });

      E.charLevel.addEventListener('input', function () {
        var v = Number(E.charLevel.value);
        CH.level = Math.max(1, Math.min(20, isFinite(v) && v ? v : 1));
        commitChar();
      });

      E.charAbilities.addEventListener('input', function (ev) {
        var input = ev.target.closest('[data-ab]');
        if (!input) return;
        var v = input.value.trim();
        CH.abilities[input.dataset.ab] = v === '' ? 10 : Math.max(0, Math.min(30, Number(v) || 0));
        commitChar();
      });

      /* The field follows the typing, and the value it had when the field
         was opened goes to the history when the player is done with it, so
         the rewind takes back a whole typed change and not one keystroke. */
      var hpBefore = null;

      E.charHpNow.addEventListener('focus', function () {
        hpBefore = SR.snapshot(CH, api.character().spells);
      });

      E.charHpNow.addEventListener('input', function () {
        var v = E.charHpNow.value.trim();
        CH.hp.current = SR.hpApply(v === '' ? 0 : Number(v) || 0, CH.hp.max, 0);
        commitChar();
      });

      E.charHpNow.addEventListener('change', function () {
        if (hpBefore && hpBefore.hp !== CH.hp.current) {
          CH.history.push(hpBefore);
          if (CH.history.length > 60) CH.history.shift();
        }
        hpBefore = null;
        commitChar();
      });

      E.charHpMax.addEventListener('input', function () {
        var v = E.charHpMax.value.trim();
        var max = v === '' ? 0 : Math.max(0, Number(v) || 0);
        CH.hp.max = max;
        if (max > 0 && CH.hp.current > max) CH.hp.current = max;
        commitChar();
      });

      E.charHpUp.addEventListener('click', function () {
        setHp(SR.hpApply(CH.hp.current, CH.hp.max, 1));
      });

      E.charHpDown.addEventListener('click', function () {
        setHp(SR.hpApply(CH.hp.current, CH.hp.max, -1));
      });

      E.charHpRewind.addEventListener('click', function () {
        var r = SR.rewind(CH.history);
        if (!r.current) return;
        CH.history = r.history;
        applyRest(r.current);
        commitChar();
        note('Rewound to before the last change.');
      });

      E.diceBox.addEventListener('click', function (ev) {
        var pick = ev.target.closest('[data-type][data-sign]');
        if (pick) {
          var type = Number(pick.dataset.type);
          var add = pick.dataset.sign === '+';
          var dice = CH.dice || (CH.dice = []);
          if (add) {
            dice.push({ type: type, spent: false });
          } else {
            for (var i = dice.length - 1; i >= 0; i--) {
              if (dice[i].type === type) { dice.splice(i, 1); break; }
            }
          }
          pushSnapshot();
          commitChar();
          return;
        }
        var counter = ev.target.closest('.dsp');
        if (counter) {
          var ctype = Number(counter.dataset.type);
          var give = counter.dataset.back === '1';
          var list = CH.dice || (CH.dice = []);
          var ix = -1;
          for (var i = 0; i < list.length; i++) {
            if (list[i].type !== ctype) continue;
            if (give ? list[i].spent : !list[i].spent) { ix = i; break; }
          }
          if (ix < 0) return;
          pushSnapshot();
          list[ix].spent = !give;
          commitChar();
          return;
        }
      });

      /* The proficiencies only move in the edit mode, so a stray tap at the
         table never changes a modifier. */
      E.charBody.addEventListener('click', function (ev) {
        if (!editingChar) return;
        var row = ev.target.closest('.prow');
        if (!row) return;
        if (row.dataset.kind === 'save') CH.saves[row.dataset.key] = SR.nextProf(CH.saves[row.dataset.key]);
        else if (row.dataset.kind === 'skill') CH.skills[row.dataset.key] = SR.nextProf(CH.skills[row.dataset.key]);
        else return;
        commitChar();
      });

      E.restShort.addEventListener('click', function () { doRest('short'); });
      E.restLong.addEventListener('click', function () { doRest('long'); });
    },

    /* The wrench edits the proficiencies. */
    head: function (root, a) {
      api = a;
      CH = a.character().char;
      var b = C.wrenchButton('Edit the proficiencies', function () {
        editingChar = !editingChar;
        api.save();
        api.refresh();
      });
      root.appendChild(b);
      E.wrench = b;
    },

    render: function (a) {
      api = a;
      CH = a.character().char;
      if (E.wrench) E.wrench.setAttribute('aria-pressed', editingChar ? 'true' : 'false');
      renderChar();
    }
  });
})();

</script>
<script>
/* The volley page: the spell slider, the toggles, the beams and the tally. */
(function () {
  'use strict';

  var C = Sheet.core;
  var R = C.R;

  var api = null;   /* the shell gives it at mount */
  var E = {};       /* the elements of the page */
  var S = {};       /* the state of the page */

  var CHIPS = [
    { key: 'advantage', label: 'Adv',      rgb: '154,209,255' },
    { key: 'hex',       label: 'Hex',      rgb: '122,216,111' },
    { key: 'curse',     label: 'Curse',    rgb: '255,111,168' },
    { key: 'elem',      label: 'Elem',     rgb: '255,212,71' },
    { key: 'elemPlus',  label: '+3d8',     rgb: '255,176,59', needs: 'elem' },
    { key: 'quicken',   label: 'Quicken',  rgb: '92,214,220', only: 'eb' }
  ];

  var TYPE_RGB = {
    force: '110,155,255',
    fire: '255,132,70',
    lightning: '255,212,71',
    necrotic: '122,216,111'
  };

  var volley = null;
  var ATK = R.ATTACK_MOD;   /* the attack bonus of the caster */
  var FLAT = 0;             /* the modifier that rides on the damage */

  function commit() { api.save(); api.refresh(); }

  /* The state of the caster, with the numbers of the character sheet in
     it: the attack bonus and the modifier the damage carries. */
  function casting() {
    var st = Object.assign({}, S);
    var ch = api.character().char;
    if (ch && ch.abilities) {
      st.attackMod = C.SR.spellAttack(ch);
      st.flatMod = C.SR.abilityMod(ch.abilities.cha);
    }
    return st;
  }

  function setState(patch) {
    Object.keys(patch).forEach(function (k) { S[k] = patch[k]; });
    if (!S.elem) S.elemPlus = false;
    if (S.power !== 'eb') S.quicken = false;
    volley = null;
    commit();
  }

  function elemLabel() {
    if (!S.elem) return 'Elem';
    return S.elemPlus ? 'Elem 3d8' : 'Elem 2d8';
  }

  /* ---- the board ---- */

  function previewGroups() {
    var power = R.powerOf(S.power);
    var groups = [];
    power.dice.forEach(function (d) { groups.push({ label: d.n + 'd' + d.s, type: d.type }); });
    if (S.hex) groups.push({ label: '1d6', type: 'necrotic' });
    if (S.elem) groups.push({ label: S.elemPlus ? '3d8' : '2d8', type: 'lightning' });
    return groups;
  }

  function cellHtml(beam) {
    if (!beam) {
      var groups = previewGroups();
      var types = [];
      groups.forEach(function (g) { if (types.indexOf(g.type) === -1) types.push(g.type); });
      var power = R.powerOf(S.power);
      var flat = FLAT + (S.curse ? 4 : 0);
      var flatType = R.primaryType(power);
      var out = '<div class="atk"><span class="at ghostnum">d20</span><span class="am">+' + ATK + '</span></div>';
      out += '<div class="d20"><span class="ghostroll">--</span></div>';
      out += '<div class="beam"></div>';
      out += '<div class="dmg"><div class="dtop"><span class="dt ghostnum">--</span><span class="kinds">';
      types.forEach(function (t) { out += '<em class="' + t + '">' + t + '</em>'; });
      out += '</span></div><div class="dice">';
      groups.forEach(function (g) {
        out += '<span class="g"><span class="lbl ' + g.type + '">' + g.label + '</span>';
        out += '<span class="roll ghostroll">--</span></span>';
      });
      if (flat) out += '<span class="g flat"><span class="lbl ' + flatType + '">+' + flat + '</span></span>';
      out += '</div></div>';
      return out;
    }

    var out = '<div class="atk">';
    out += '<span class="at">' + beam.total + '</span>';
    out += '<span class="am">+' + ATK + '</span>';
    if (beam.crit) out += '<span class="badge crit">crit</span>';
    else if (beam.hit === true) out += '<span class="badge hit">hit</span>';
    else if (beam.hit === false) out += '<span class="badge miss">miss</span>';
    out += '</div>';

    out += '<div class="d20">';
    beam.rolls.forEach(function (r) {
      out += '<span' + (r === beam.kept && beam.rolls.length > 1 ? ' class="kept"' : '') + '>' + r + '</span>';
    });
    out += '</div>';
    out += '<div class="beam"></div>';

    var types = [], i;
    for (i = 0; i < beam.groups.length; i++) {
      if (types.indexOf(beam.groups[i].type) === -1) types.push(beam.groups[i].type);
    }
    /* the flat bonus is damage of the spell's own type */
    var flatType = R.primaryType(R.powerOf(S.power));

    out += '<div class="dmg"><div class="dtop"><span class="dt">' + beam.damage + '</span><span class="kinds">';
    types.forEach(function (t) { out += '<em class="' + t + '">' + t + '</em>'; });
    out += '</span></div>';

    out += '<div class="dice">';
    beam.groups.forEach(function (g) {
      out += '<span class="g"><span class="lbl ' + g.type + '">' + g.label + '</span>';
      out += '<span class="roll' + (g.rolls.length > 3 ? ' tight' : '') + '">' + g.rolls.join(',') + '</span></span>';
    });
    if (beam.flat) out += '<span class="g flat"><span class="lbl ' + flatType + '">+' + beam.flat + '</span></span>';
    out += '</div></div>';

    return out;
  }

  function renderBoard(animate) {
    var power = R.powerOf(S.power);
    var n = power.attacks;
    var count = R.beamCount(S);
    var quick = R.quickened(S);
    E.grid.style.setProperty('--cols', n === 4 ? '2' : '3');
    E.grid.classList.toggle('quick', quick);
    E.grid.innerHTML = '';

    for (var i = 0; i < count; i++) {
      /* the quickened cast starts a second row */
      if (quick && i === n) {
        var sep = document.createElement('div');
        sep.className = 'rowsep';
        sep.innerHTML = '<span>Quickened</span>';
        E.grid.appendChild(sep);
      }
      var beam = volley ? volley.beams[i] : null;
      var cell = document.createElement('article');
      cell.className = 'cell' + (beam && beam.quick ? ' quick' : '');
      var preview = beam ? beam.groups : previewGroups();
      cell.style.setProperty('--beam', TYPE_RGB[preview[0] ? preview[0].type : 'force'] || '155,123,255');
      if (!animate) cell.style.animation = 'none';
      cell.style.setProperty('--i', String(i));
      if (beam) {
        if (beam.crit) cell.classList.add('crit');
        if (beam.hit === false) cell.classList.add('miss');
      } else {
        cell.classList.add('ghost');
      }
      cell.innerHTML = cellHtml(beam);
      E.grid.appendChild(cell);
    }
  }

  function renderSummary() {
    var power = R.powerOf(S.power);
    var count = R.beamCount(S);
    /* The flat bonus is damage of the spell's own type, the curse one too. */
    var flat = FLAT + (S.curse ? 4 : 0);
    var beams = count + ' beam' + (count === 1 ? '' : 's');
    var attack = S.advantage
      ? 'attack 3d20+' + ATK + ' keep best'
      : 'attack d20+' + ATK;
    var crit = S.curse ? 'crit on 19-20' : 'crit on 20';
    var head = beams + (R.quickened(S) ? ' &middot; quickened' : '') +
      ' &middot; ' + attack + ' &middot; ' + crit;

    var bits = [];
    power.dice.forEach(function (d, i) {
      bits.push(d.n + 'd' + d.s + (i === 0 && flat ? '+' + flat : '') +
        ' <em class="' + d.type + '">' + d.type + '</em>');
    });
    if (S.hex) bits.push('1d6 <em class="necrotic">necrotic</em>');
    var light = 0;
    if (S.elem) light = S.elemPlus ? 3 : 2;
    if (light) bits.push(light + 'd8 <em class="lightning">lightning</em>');

    E.summary.innerHTML =
      '<span>' + head + '</span>' +
      '<span>damage ' + bits.join(' + ') + '</span>';
  }

  function renderTally() {
    if (!volley) {
      E.tally.innerHTML = S.ac === null
        ? '<span style="color:#615c7d">No target AC set, so damage shows for every beam</span>'
        : '';
      return;
    }
    var t = R.tally(volley, S.ac);
    var out = '<span class="big">' + t.total + '</span><span>damage</span>';
    if (S.ac !== null) {
      out += '<span>&middot; ' + t.hits + ' hit' + (t.hits === 1 ? '' : 's');
      if (t.crits) out += ' &middot; ' + t.crits + ' crit' + (t.crits === 1 ? '' : 's');
      out += '</span>';
    }
    /* the flat bonus sits in its own type, so the tally shows it there */
    t.order.forEach(function (type) {
      out += '<em class="' + type + '">&middot; ' + t.byType[type] + ' ' + type + '</em>';
    });
    E.tally.innerHTML = out;
  }

  /* ---- the page ---- */

  Sheet.page({
    id: 'volley',
    title: 'Volley',
    order: 1,
    blurb: 'The spell slider, the toggles and the beams.',
    html: [
      '<div class="slider">',
      '  <input id="power" type="range" min="0" max="4" step="1" value="0" aria-label="Spell power">',
      '  <div class="stops" id="stops"></div>',
      '</div>',
      '<div class="chips" id="chips"></div>',
      '<div class="summary" id="summary"></div>',
      '<div class="board" id="board">',
      '  <div class="grid" id="grid"></div>',
      '</div>',
      '<div class="tally" id="tally"></div>',
      '<button class="cast" id="cast">',
      '  <span id="castLabel">Cast</span>',
      '  <svg class="mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">',
      '    <circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width=".8"/>',
      '    <path d="M12 2.2V6M12 18v3.8M2.2 12H6M18 12h3.8" stroke="currentColor" stroke-width=".8"/>',
      '    <path d="M12 6.4L17.6 12 12 17.6 6.4 12z" fill="none" stroke="currentColor" stroke-width="1"/>',
      '  </svg>',
      '</button>'
    ].join('\n'),

    seed: function (saved, fresh) {
      var s = {
        power: 'eb', advantage: false, hex: false, curse: false,
        elem: false, elemPlus: false, quicken: false, ac: null
      };
      if (saved && typeof saved === 'object') {
        Object.keys(s).forEach(function (k) {
          if (saved[k] !== undefined && saved[k] !== null) s[k] = saved[k];
        });
      }
      if (!R.powerOf || s.power !== R.powerOf(s.power).id) s.power = 'eb';
      if (!s.elem) s.elemPlus = false;
      if (s.power !== 'eb') s.quicken = false;
      if (s.ac === '' || s.ac === null || isNaN(Number(s.ac))) s.ac = null;
      else s.ac = Number(s.ac);
      return s;
    },

    mount: function (root, a) {
      api = a;
      S = a.character().volley;
      E = {
        power: root.querySelector('#power'),
        stops: root.querySelector('#stops'),
        chips: root.querySelector('#chips'),
        summary: root.querySelector('#summary'),
        grid: root.querySelector('#grid'),
        tally: root.querySelector('#tally'),
        cast: root.querySelector('#cast'),
        ac: null
      };

      E.power.addEventListener('input', function () {
        var p = R.POWERS[Number(E.power.value)];
        setState({ power: p.id });
      });

      R.POWERS.forEach(function (p, i) {
        var stop = document.createElement('button');
        stop.type = 'button';
        stop.className = 'stop';
        stop.textContent = p.short;
        stop.style.left = 'calc(13px + (100% - 26px) * ' + (i / (R.POWERS.length - 1)) + ')';
        stop.addEventListener('click', function () {
          E.power.value = String(i);
          setState({ power: p.id });
        });
        E.stops.appendChild(stop);
      });

      CHIPS.forEach(function (chip) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip';
        b.dataset.key = chip.key;
        b.textContent = chip.label;
        b.style.setProperty('--crgb', chip.rgb);
        b.addEventListener('click', function () {
          var next = !S[chip.key];
          var patch = {};
          patch[chip.key] = next;
          if (chip.key === 'elem' && !next) patch.elemPlus = false;
          setState(patch);
        });
        E.chips.appendChild(b);
      });

      E.cast.addEventListener('click', function () {
        volley = R.rollVolley(casting());
        renderBoard(true);
        renderTally();
        var anyCrit = volley.beams.some(function (b) { return b.crit; });
        if (navigator.vibrate) navigator.vibrate(anyCrit ? [14, 45, 18] : 16);
      });
    },

    /* The target armor class sits in the head of the app, next to the name
       of the spell. */
    head: function (root, a) {
      api = a;
      S = a.character().volley;
      var wrap = document.createElement('label');
      wrap.className = 'ac';
      wrap.id = 'acField';
      wrap.innerHTML = '<span>AC</span><input id="ac" type="number" inputmode="numeric" min="1" max="40" step="1" placeholder="—" aria-label="Target armor class">';
      root.appendChild(wrap);
      E.ac = wrap.querySelector('#ac');
      E.ac.addEventListener('input', function () {
        var v = E.ac.value.trim();
        setState({ ac: v === '' ? null : Number(v) });
      });
    },

    render: function (a) {
      api = a;
      S = a.character().volley;
      var st = casting();
      ATK = R.attackMod(st);
      FLAT = R.flatMod(st, R.powerOf(S.power));
      var power = R.powerOf(S.power);

      E.power.value = String(R.POWERS.indexOf(power));
      var span = Number(E.power.max) - Number(E.power.min);
      E.power.style.setProperty('--fill', (span ? (Number(E.power.value) - Number(E.power.min)) / span * 100 : 0) + '%');

      Array.prototype.forEach.call(E.stops.children, function (s, i) {
        s.classList.toggle('on', R.POWERS[i].id === power.id);
      });

      Array.prototype.forEach.call(E.chips.children, function (b) {
        var key = b.dataset.key;
        var chip = CHIPS.filter(function (c) { return c.key === key; })[0];
        b.setAttribute('aria-pressed', S[key] ? 'true' : 'false');
        if (key === 'elem') b.textContent = elemLabel();
        if (chip.only) b.hidden = S.power !== chip.only;
        if (chip.needs) b.hidden = !S[chip.needs];
      });

      if (E.ac && E.ac.value !== (S.ac === null ? '' : String(S.ac))) {
        E.ac.value = S.ac === null ? '' : String(S.ac);
      }

      renderSummary();
      renderBoard(false);
      renderTally();
    }
  });
})();

</script>
<script>
/* The spells page: the slots, the sorcery points and the list of spells. */
(function () {
  'use strict';

  var C = Sheet.core;
  var R = C.R;
  var SR = C.SR;
  var LEVELS = C.LEVELS;
  var WARLOCK_LEVEL = C.WARLOCK_LEVEL;

  var api = null;   /* the shell gives it at mount */
  var E = {};       /* the elements of the page */
  var S = {};       /* the state of the page */

  var editing = false;
  var dragged = false;

  var SPELL_DEFAULTS = {
    dc: 17,
    dcTouched: false,
    sp: 8,
    spMax: 8,
    cunning: false,
    sorcRest: false,
    sorcererLevel: 8,
    max: { 1: 4, 2: 3, 3: 3, 4: 2, 5: 0, 6: 0, 7: 0, 8: 0, 9: 0 },
    left: { 1: 4, 2: 3, 3: 3, 4: 2, 5: 0, 6: 0, 7: 0, 8: 0, 9: 0 },
    warlockMax: 2,
    warlockLeft: 2,
    warlockLevel: 2,
    slotsTouched: false,
    selected: 1,
    lists: {},
    /* The source of each spell is the character's own: the class or the
       feature that granted it. A spell with no entry has no source. */
    sources: {},
    pick: '',
    classes: {},
    levelFilter: true,
    surge: null
  };

  /* The spells of the app's own sheet travel in the page; the book itself is
     a file the app reads when the spells page opens. */
  var SPELL_SEED = C.seeds.spells || [];

  function commit() { api.save(); api.refresh(); }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  /* ---- the state ---- */

  function seed(saved, fresh, rec) {
    var s = {};
    Object.keys(SPELL_DEFAULTS).forEach(function (k) { s[k] = SPELL_DEFAULTS[k]; });
    /* A character that is new holds nothing: no point, no slot, no spell.
       Its own record is read after, so one made from a ready-made
       character keeps everything that character was given. */
    if (fresh) {
      s.sp = 0;
      s.spMax = 0;
      s.max = {};
      s.left = {};
      s.warlockMax = 0;
      s.warlockLeft = 0;
      s.sorcererLevel = 1;
      s.classes = {};
      s.levelFilter = true;
      s.dcTouched = false;
    }
    if (saved && typeof saved === 'object') {
      Object.keys(SPELL_DEFAULTS).forEach(function (k) {
        if (saved[k] !== undefined && saved[k] !== null && typeof saved[k] === typeof SPELL_DEFAULTS[k]) s[k] = saved[k];
      });
      if (saved.classes) {
        s.classes = {};
        /* the class names were canonicalised, so an old key follows */
        Object.keys(saved.classes).forEach(function (k) { s.classes[C.canonSource(k)] = !!saved.classes[k]; });
      }
      if (saved.levelFilter !== undefined) s.levelFilter = !!saved.levelFilter;
      /* A save DC the player moved in an earlier version stays where it was
         put, and from now on it follows the character. */
      if (saved.dc !== undefined && Number(saved.dc) !== 17) s.dcTouched = true;
      if (saved.max) { s.max = {}; Object.keys(SPELL_DEFAULTS.max).forEach(function (k) { s.max[k] = Number(saved.max[k]) || 0; }); }
      if (saved.left) { s.left = {}; Object.keys(SPELL_DEFAULTS.left).forEach(function (k) { s.left[k] = Number(saved.left[k]) || 0; }); }
    }
    /* The spells of the character come first: a level it filled itself
       stays the way it left it, an empty one included. */
    var lists = {};
    LEVELS.forEach(function (lv) {
      var own = (saved && saved.lists && saved.lists[lv]) || null;
      if (own) {
        /* Until the book is in there is nothing to check a name against. */
        lists[lv] = C.book.spells.length ? own.filter(function (n) { return C.bookByName[n]; }) : own.slice();
        return;
      }
      if (fresh) { lists[lv] = []; return; }
      lists[lv] = SPELL_SEED.filter(function (sp) { return sp.level === lv; }).map(function (sp) { return sp.name; });
    });
    s.lists = lists;
    /* The slots of a character that holds classes come from the multiclass
       table, and its pact slots from the warlock level. The wrench can set
       them by hand, and they then stay where they are put. */
    if (!s.slotsTouched && rec && rec.char && Array.isArray(rec.char.classes) && rec.char.classes.length) {
      var rows = C.classRows(rec.char);
      var slots = SR.slotsFor(SR.casterLevel(rows));
      var pact = SR.pactFor(SR.warlockLevel(rows));
      var max = {}, left = {};
      LEVELS.forEach(function (lv) {
        if (!lv) return;
        var want = slots[lv] || 0;
        var before = Number(s.max[lv]) || 0;
        max[lv] = want;
        left[lv] = Math.max(0, Math.min(want, (Number(s.left[lv]) || 0) + (want - before)));
      });
      s.max = max;
      s.left = left;
      var wl = Number(s.warlockLeft) || 0;
      var wb = Number(s.warlockMax) || 0;
      s.warlockLevel = pact.level;
      s.warlockMax = pact.max;
      s.warlockLeft = Math.max(0, Math.min(pact.max, wl + (pact.max - wb)));
    }

    /* A record that names its own sources keeps exactly those. One saved
       before a character could name them takes the ones of the book, which
       are the ones of the sheet the book was built from, and a character
       that is new starts with none. */
    var declared = saved && saved.sources && typeof saved.sources === 'object';
    s.sources = {};
    if (declared) {
      Object.keys(saved.sources).forEach(function (n) {
        if (C.bookByName[n] && saved.sources[n]) s.sources[n] = String(saved.sources[n]);
      });
    } else if (!fresh) {
      LEVELS.forEach(function (lv) {
        (lists[lv] || []).forEach(function (n) {
          var spell = C.bookByName[n];
          if (spell && spell.source) s.sources[n] = C.canonSource(spell.source);
        });
      });
    }
    return s;
  }

  /* ---- the strip of levels ---- */

  function pipButton(full, lv, n, warlock) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'pip' + (warlock ? ' wl' : '') + (full ? ' full' : '');
    b.dataset.lv = String(lv);
    b.dataset.n = String(n);
    if (warlock) b.dataset.wl = '1';
    b.setAttribute('aria-label', (warlock ? 'Warlock slot ' : 'Slot ') + n);
    return b;
  }

  function editButton(sign, lv, warlock) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'mini';
    b.textContent = sign;
    b.dataset.edit = sign === '+' ? 'add' : 'take';
    b.dataset.lv = String(lv);
    if (warlock) b.dataset.wl = '1';
    return b;
  }

  function renderLevels() {
    E.levels.innerHTML = '';
    E.levels.classList.toggle('editing', editing);

    /* How many slots each level holds, so the columns can share the width
       and every slot can be the same size in the whole strip. */
    var counts = LEVELS.map(function (lv) {
      return (S.max[lv] || 0) + (lv === S.warlockLevel ? (S.warlockMax || 0) : 0);
    });
    var busiest = Math.max.apply(null, counts) || 1;
    var pipH = Math.max(9, Math.min(16, Math.floor((120 - (busiest - 1) * 2) / busiest)));
    E.levels.style.setProperty('--pip-h', pipH + 'px');

    LEVELS.forEach(function (lv, ix) {
      var max = S.max[lv] || 0;
      var left = Math.min(S.left[lv] || 0, max);
      var col = document.createElement('div');
      col.className = 'lv' + (lv === S.selected ? ' on' : '') + (editing ? ' editing' : '');
      if (lv > 0 && !counts[ix]) col.classList.add('dim');
      col.dataset.lv = String(lv);
      col.style.flexGrow = String(Math.max(1, counts[ix]));

      /* The bolt turns a slot into sorcery points, so a character with no
         sorcery points has nothing to do with it. */
      if (lv > 0 && S.spMax) {
        var bolt = document.createElement('button');
        bolt.type = 'button';
        bolt.className = 'bolt';
        bolt.dataset.bolt = String(lv);
        bolt.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">' +
          '<path d="M13.6 2L4.2 13.4h5.4L9.6 22 19.4 10.2H14L13.6 2z"/></svg>';
        var hasSlot = S.left[lv] > 0 || (lv === S.warlockLevel && S.warlockLeft > 0);
        var why = S.sp >= S.spMax
          ? 'Your sorcery points are full'
          : (!hasSlot ? 'No level ' + lv + ' slot left' : '');
        bolt.setAttribute('aria-label', 'Turn a level ' + lv + ' slot into ' + lv + ' sorcery points' + (why ? ', ' + why : ''));
        bolt.title = why || ('Turn a level ' + lv + ' slot into ' + lv + ' sorcery points');
        bolt.disabled = !!why;
        col.appendChild(bolt);
      } else {
        var space = document.createElement('span');
        space.className = 'boltspace';
        col.appendChild(space);
      }

      var head = document.createElement('span');
      head.className = 'head';
      var n = document.createElement('span');
      n.className = 'n';
      n.textContent = String(lv);
      head.appendChild(n);
      col.appendChild(head);

      var pips = document.createElement('span');
      pips.className = 'pips';
      for (var i = 1; i <= max; i++) pips.appendChild(pipButton(i <= left, lv, i, false));
      if (lv === S.warlockLevel && S.warlockMax) {
        var wlGroup = document.createElement('span');
        wlGroup.className = 'wlgroup';
        for (var w = 1; w <= S.warlockMax; w++) wlGroup.appendChild(pipButton(w <= S.warlockLeft, lv, w, true));
        pips.appendChild(wlGroup);
      }
      col.appendChild(pips);

      var down = document.createElement('button');
      down.type = 'button';
      down.className = 'down';
      down.dataset.lv = String(lv);
      down.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
        'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
        '<path d="M6 9.5l6 6 6-6"/></svg>';
      down.setAttribute('aria-label', 'Show the spells of level ' + lv);
      down.title = 'Show the spells of level ' + lv;
      col.appendChild(down);

      var edit = document.createElement('span');
      edit.className = 'edit';
      if (lv > 0) {
        edit.appendChild(editButton('-', lv, false));
        edit.appendChild(editButton('+', lv, false));
      }
      if (lv === S.warlockLevel && S.warlockMax) {
        var wl = document.createElement('span');
        wl.className = 'plus';
        wl.textContent = 'W';
        edit.appendChild(wl);
        edit.appendChild(editButton('-', lv, true));
        edit.appendChild(editButton('+', lv, true));
      }
      col.appendChild(edit);

      E.levels.appendChild(col);
    });

    if (editing) {
      var cell = document.createElement('div');
      cell.className = 'lv editing';
      var head2 = document.createElement('span');
      head2.className = 'head';
      var lbl = document.createElement('span');
      lbl.className = 'n';
      lbl.textContent = 'Lv';
      head2.appendChild(lbl);
      cell.appendChild(head2);
      var val = document.createElement('span');
      val.className = 'val';
      val.textContent = String(S.sorcererLevel);
      cell.appendChild(val);
      var ed = document.createElement('span');
      ed.className = 'edit';
      ed.style.display = 'flex';
      var down2 = document.createElement('button');
      down2.type = 'button'; down2.className = 'mini'; down2.textContent = '-'; down2.dataset.lvl = '-1';
      var up = document.createElement('button');
      up.type = 'button'; up.className = 'mini'; up.textContent = '+'; up.dataset.lvl = '1';
      ed.appendChild(down2); ed.appendChild(up);
      cell.appendChild(ed);
      E.levels.appendChild(cell);
    }
  }

  /* ---- the list of spells ---- */

  /* The summary of a spell: the same fields, in the same order, on every
     card, so the labels line up down the list. */
  function spellFields(spell, full) {
    var comps = spell.components ? spell.components.split('').join(' ') : '-';
    var time = full ? (spell.timeFull || spell.time) : spell.time;
    var hasTrigger = !!(full && spell.timeFull && spell.timeFull !== spell.time);
    return C.field('Cast', time, '', hasTrigger) +
      C.field('Range', spell.range) +
      C.field('Duration', spell.duration) +
      C.field('Comps', comps, 'cmp') +
      C.field('Conc', spell.concentration ? 'Yes' : 'No', spell.concentration ? 'yes' : '') +
      C.field('Ritual', spell.ritual ? 'Yes' : 'No', spell.ritual ? 'rit' : '');
  }

  function renderSpellList() {
    var list = S.lists[S.selected] || [];
    E.spellList.innerHTML = '';
    if (!list.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No spells at level ' + S.selected + ' yet. Open the grimoire with the + button to add some.';
      E.spellList.appendChild(empty);
      return;
    }
    list.forEach(function (name) {
      var spell = C.bookByName[name];
      if (!spell) return;
      var card = document.createElement('div');
      card.className = 'card';
      card.dataset.name = name;
      card.innerHTML = '<div class="top"><span class="t">' + C.esc(spell.name) + '</span>' +
        C.sourceTag(S.sources[name]) + '</div><div class="m">' + spellFields(spell) + '</div>';
      E.spellList.appendChild(card);
    });
  }

  /* The level a spell sits in, or -1 when it is not in the list. */
  function listLevelOf(name) {
    for (var i = 0; i < LEVELS.length; i++) {
      var list = S.lists[LEVELS[i]] || [];
      if (list.indexOf(name) >= 0) return LEVELS[i];
    }
    return -1;
  }

  /* The save DC is the character's, until the player moves it here. */
  function saveDC() {
    if (S.dcTouched) return S.dc;
    var ch = api.character().char;
    if (ch && ch.abilities) return C.SR.spellDC(ch, C.primaryAbility(ch));
    return S.dc;
  }

  /* The slots follow the classes until the wrench sets them by hand, so a
     class that gains a level moves them at once. */
  function syncSlots() {
    if (S.slotsTouched) return;
    var ch = api.character().char;
    if (!ch || !Array.isArray(ch.classes) || !ch.classes.length) return;
    var rows = C.classRows(ch);
    var want = SR.slotsFor(SR.casterLevel(rows));
    var pact = SR.pactFor(SR.warlockLevel(rows));
    var changed = false;
    LEVELS.forEach(function (lv) {
      if (!lv) return;
      var wantMax = want[lv] || 0;
      var before = Number(S.max[lv]) || 0;
      if (before !== wantMax) {
        S.left[lv] = Math.max(0, Math.min(wantMax, (Number(S.left[lv]) || 0) + (wantMax - before)));
        S.max[lv] = wantMax;
        changed = true;
      }
    });
    if (Number(S.warlockMax) !== pact.max || Number(S.warlockLevel) !== pact.level) {
      S.warlockLeft = Math.max(0, Math.min(pact.max, (Number(S.warlockLeft) || 0) + (pact.max - (Number(S.warlockMax) || 0))));
      S.warlockMax = pact.max;
      S.warlockLevel = pact.level;
      changed = true;
    }
    if (changed) api.save();
  }

  function renderSpells() {
    syncSlots();
    E.dcValue.textContent = saveDC();
    E.spValue.textContent = S.sp + '/' + S.spMax;
    /* A character with no sorcery point and no pact slot has no use for
       the sorcerer's controls, and one with no wild surge has no use for
       the table, so they go away rather than sit there doing nothing. */
    var sorc = S.spMax > 0;
    var wild = (api.character().char.features || []).some(function (f) { return f.key === 'wildSurge'; });
    E.spStat.hidden = !sorc;
    E.sorcRest.hidden = !sorc;
    E.cunning.hidden = !(S.warlockMax > 0);
    E.wildSurge.hidden = !wild;
    E.cunning.setAttribute('aria-pressed', S.cunning ? 'true' : 'false');
    E.sorcRest.setAttribute('aria-pressed', S.sorcRest ? 'true' : 'false');
    E.sorcRest.title = 'Restores ' + Math.floor(S.sorcererLevel / 2) + ' sorcery points';
    E.dcStat.classList.toggle('editing', editing);
    var list = S.lists[S.selected] || [];
    E.listTitle.textContent = 'Level ' + S.selected + ' spells · ' + list.length;
    renderLevels();
    renderSpellList();
  }

  /* ---- the source of a spell ---- */

  /* What a character can declare as the source of a spell: the sources its
     own features name, which are its classes and the features that grant a
     spell, and the ones it already uses. A feat is a feature of its own and
     not a class, so it is left out. */
  function sourceChoices() {
    var ch = api.character().char || {};
    var out = [];
    function add(name) {
      name = String(name || '').trim();
      if (!name || name === 'Feat') return;
      if (out.indexOf(name) < 0) out.push(name);
    }
    (ch.features || []).forEach(function (f) { add(f.source); });
    Object.keys(S.sources || {}).forEach(function (n) { add(S.sources[n]); });
    return out;
  }

  /* The source the next spell learns with. Nothing picked means the first
     class of the character, which is what a spell usually comes from. */
  function pickValue() {
    if (S.pick === 'none') return '';
    if (S.pick && sourceChoices().indexOf(S.pick) >= 0) return S.pick;
    return sourceChoices()[0] || '';
  }

  /* The row that declares it. */
  function sourceRow() {
    var chosen = pickValue();
    var html = '<div class="srcpick" id="srcpick"><span class="k">SOURCE</span>';
    sourceChoices().forEach(function (name) {
      var on = name === chosen;
      html += '<button type="button" class="spick' + (on ? ' on' : '') + '" data-src="' + C.esc(name) + '" ' +
        'aria-pressed="' + (on ? 'true' : 'false') + '">' + C.esc(name) + '</button>';
    });
    html += '<button type="button" class="spick' + (chosen ? '' : ' on') + '" data-src="none" ' +
      'aria-pressed="' + (chosen ? 'false' : 'true') + '">None</button></div>';
    return html;
  }

  function pickOn(root, onPick, onDone) {
    var row = root.querySelector('#srcpick');
    if (!row) return;
    row.addEventListener('click', function (ev) {
      var b = ev.target.closest('.spick');
      if (!b) return;
      S.pick = b.dataset.src;
      onPick(b.dataset.src === 'none' ? '' : b.dataset.src);
      onDone();
    });
  }

  /* ---- the spell of the page ---- */

  function openSpell(name) {
    var spell = C.bookByName[name];
    if (!spell) return;
    api.sheet.open({
      id: 'spell:' + name,
      title: spell.name,
      meta: C.field('Level', spell.level) + spellFields(spell, true) + C.sourceTag(S.sources[name]),
      text: sourceRow() + C.renderBlocks(spell.blocks),
      actions: [{
        label: 'Remove from level ' + S.selected,
        kind: 'danger',
        onClick: function () {
          var list = S.lists[S.selected] || [];
          var ix = list.indexOf(name);
          if (ix >= 0) list.splice(ix, 1);
          delete S.sources[name];
          api.sheet.close();
          commit();
        }
      }],
      onPaint: function (root) {
        pickOn(root, function (source) {
          if (source) S.sources[name] = source;
          else delete S.sources[name];
        }, function () {
          api.save();
          openSpell(name);
          renderSpellList();
        });
      }
    });
  }

  /* ---- the grimoire ---- */

  function grimoireTitle(lv) {
    var on = S.classes || {};
    var active = Object.keys(on).filter(function (c) { return on[c]; });
    var byLevel = S.levelFilter !== false;
    return 'Grimoire' + (byLevel ? ', level ' + lv : '') +
      (active.length ? ' \u00b7 ' + active.join(', ') : '');
  }

  function grimoireList(lv, q) {
    var on = S.classes || {};
    var active = Object.keys(on).filter(function (c) { return on[c]; });
    var byLevel = S.levelFilter !== false;
    var rows = (C.book.spells || [])
      .filter(function (s) { return byLevel ? s.level === lv : true; })
      .filter(function (s) {
        if (!active.length) return true;
        return (s.classes || []).some(function (c) { return active.indexOf(c) >= 0; });
      })
      .filter(function (s) {
        if (!q) return true;
        var needle = q.toLowerCase();
        if (s.name.toLowerCase().indexOf(needle) >= 0) return true;
        /* A player looking for the spells of a class says its name, so the
           classes of a spell answer to it as well. */
        return (s.classes || []).some(function (c) { return c.toLowerCase().indexOf(needle) >= 0; });
      });

    if (!rows.length) {
      if (!(C.book.spells || []).length) {
        return '<div class="empty">The book has not arrived yet.</div>';
      }
      return '<div class="empty">' + C.esc(active.length
        ? 'No spell of ' + active.join(', ') + (byLevel ? ' at this level' : '') + '.'
        : 'Nothing matches.') + '</div>';
    }

    return rows.map(function (s) {
      var at = listLevelOf(s.name);
      var added = at >= 0;
      var chips = (s.classes || []).map(function (c) {
        return '<button type="button" class="gcls' + (on[c] ? ' on' : '') + '" data-cls="' + C.esc(c) + '" ' +
          'title="' + C.esc(c) + '" aria-label="' + C.esc(c) + (on[c] ? ', on' : ', off') + '">' +
          C.esc(C.classShort(c)) + '</button>';
      }).join('');
      return '<div class="row">' +
        '<div class="g1">' +
          '<span class="gn tappable" data-name="' + C.esc(s.name) + '" aria-label="Read ' + C.esc(s.name) + '">' + C.esc(s.name) + '</span>' +
          '<button type="button" class="gadd" data-name="' + C.esc(s.name) + '" aria-label="' +
            (added ? 'Unlearn ' : 'Add ') + C.esc(s.name) + '">' + (added ? '\u2713' : '+') + '</button>' +
        '</div>' +
        '<div class="g2">' + chips +
          '<span class="gs">' + C.esc(added ? 'in level ' + at : s.time) + '</span>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function openGrimoire(lv) {
    S.selected = lv;
    api.sheet.open({
      id: 'grimoire',
      title: grimoireTitle(lv),
      metaClass: 'sheet-meta one',
      meta: '<span>Tap to read, + learns, a check unlearns</span>' + sourceRow(),
      list: true,
      search: true,
      level: true,
      levelLabel: S.levelFilter !== false ? 'Level ' + lv : 'All levels',
      levelOn: S.levelFilter !== false,
      onPaint: function (root) {
        root.querySelector('#sheetTitle').textContent = grimoireTitle(lv);
        root.querySelector('#sheetList').innerHTML = grimoireList(lv, (api.sheet.search() || '').toLowerCase());
        pickOn(root, function () {}, function () { api.save(); openGrimoire(lv); });
        var tog = root.querySelector('#grimoireLevel');
        tog.textContent = S.levelFilter !== false ? 'Level ' + lv : 'All levels';
        tog.setAttribute('aria-pressed', S.levelFilter !== false ? 'true' : 'false');
      },
      onSearch: function () { openGrimoire(lv); },
      onLevel: function () {
        S.levelFilter = S.levelFilter === false;
        api.save();
        openGrimoire(lv);
      },
      onList: function (ev) {
        var chip = ev.target.closest('.gcls');
        if (chip) {
          var cls = chip.dataset.cls;
          S.classes[cls] = !S.classes[cls];
          api.save();
          openGrimoire(lv);
          return;
        }
        var name = ev.target.closest('.gn, .gadd');
        if (!name) return;
        var spell = name.dataset.name;
        if (name.classList.contains('gadd')) {
          var level = listLevelOf(spell);
          if (level >= 0) {
            var list = S.lists[level] || [];
            var ix = list.indexOf(spell);
            if (ix >= 0) list.splice(ix, 1);
            delete S.sources[spell];
          } else {
            var target = S.lists[S.selected] || (S.lists[S.selected] = []);
            if (target.indexOf(spell) < 0) target.push(spell);
            /* the spell takes the source declared above the list */
            if (pickValue()) S.sources[spell] = pickValue();
            else delete S.sources[spell];
          }
          api.save();
          openGrimoire(lv);
          renderSpellList();
          return;
        }
        openSpell(spell);
      }
    });
    commit();
  }

  /* ---- the wild magic surge ---- */

  function openSurge() {
    var s = S.surge;
    var html = '<button class="surgelarge" type="button" id="surgeRoll" aria-label="Roll the wild magic surge">' +
      '<span class="surged100">' + (s ? s.roll : '--') + '</span></button>';
    if (s) {
      html += '<p>' + C.markup(s.text) + '</p>';
      if (s.dice && s.dice.length) {
        html += '<p>' + s.dice.map(function (d) {
          return C.esc(d.label) + ': ' + d.values.join(' + ') + ' = ' + d.total;
        }).join('<br>') + '</p>';
      }
    } else {
      html += '<p>Roll the surge to see what the wild magic does.</p>';
    }

    api.sheet.open({
      id: 'surge',
      title: 'Wild magic surge',
      meta: s
        ? C.field('Range', pad2(s.from) + '-' + pad2(s.to)) + C.field('Roll', 'd100: ' + s.roll)
        : C.field('Roll', 'd100'),
      text: html,
      actions: [{ label: 'Roll the surge', onClick: rollSurge }],
      onPaint: function (root) {
        var big = root.querySelector('#surgeRoll');
        if (big) big.addEventListener('click', rollSurge);
      }
    });
  }

  function rollSurge() {
    if (!C.surge.rows || !C.surge.rows.length) {
      api.toast('The surge table did not load.');
      return;
    }
    var result = R.rollSurge(C.surge.rows);
    S.surge = { roll: result.roll, from: result.from, to: result.to, text: result.text, dice: result.dice };
    api.save();
    openSurge();
    if (navigator.vibrate) navigator.vibrate(result.dice.length ? [14, 45, 14] : 16);
  }

  /* ---- the page ---- */

  Sheet.page({
    id: 'spells',
    title: 'Spells',
    order: 2,
    blurb: 'The spell slots, the sorcery points and the list of spells.',
    html: [
      '<div class="sbar">',
      '  <div class="stat" id="dcStat">',
      '    <span class="k">DC</span>',
      '    <span class="v" id="dcValue">17</span>',
      '    <button class="mini" type="button" data-act="dc-" aria-label="Lower the DC">&minus;</button>',
      '    <button class="mini" type="button" data-act="dc+" aria-label="Raise the DC">+</button>',
      '  </div>',
      '  <div class="stat live" id="spStat">',
      '    <span class="k">SP</span>',
      '    <span class="v" id="spValue">8/8</span>',
      '    <button class="mini" type="button" data-act="sp-" aria-label="Spend a sorcery point">&minus;</button>',
      '    <button class="mini" type="button" data-act="sp+" aria-label="Regain a sorcery point">+</button>',
      '  </div>',
      '  <button class="tog" id="cunning" type="button" aria-pressed="false" title="Restores 1 warlock slot">Cunning</button>',
      '  <button class="tog" id="sorcRest" type="button" aria-pressed="false" title="Restores half your sorcerer level in sorcery points">Sorc rest</button>',
      '  <button class="tog wild" id="wildSurge" type="button" title="The wild magic surge">Wild</button>',
      '</div>',
      '<div class="sbody">',
      '  <div class="slotstrip" id="levels"></div>',
      '  <div class="listhead">',
      '    <span class="t" id="listTitle">Level 1 spells</span>',
      '    <button class="mini" id="addSpell" type="button" aria-label="Add a spell">+</button>',
      '  </div>',
      '  <div class="grimoire" id="spellList"></div>',
      '</div>'
    ].join('\n'),

    seed: seed,

    mount: function (root, a) {
    a.core.data('spellbook');
      api = a;
      S = a.character().spells;
      E = {
        dcStat: root.querySelector('#dcStat'),
        dcValue: root.querySelector('#dcValue'),
        spValue: root.querySelector('#spValue'),
        spStat: root.querySelector('#spStat'),
        cunning: root.querySelector('#cunning'),
        sorcRest: root.querySelector('#sorcRest'),
        wildSurge: root.querySelector('#wildSurge'),
        levels: root.querySelector('#levels'),
        listTitle: root.querySelector('#listTitle'),
        addSpell: root.querySelector('#addSpell'),
        spellList: root.querySelector('#spellList')
      };

      E.cunning.addEventListener('click', function () {
        S.cunning = !S.cunning;
        if (S.cunning) S.warlockLeft = Math.min(S.warlockMax, S.warlockLeft + 1);
        else S.warlockLeft = Math.max(0, S.warlockLeft - 1);
        commit();
      });

      E.sorcRest.addEventListener('click', function () {
        var gain = Math.floor(S.sorcererLevel / 2);
        S.sorcRest = !S.sorcRest;
        if (S.sorcRest) S.sp = Math.min(S.spMax, S.sp + gain);
        else S.sp = Math.max(0, S.sp - gain);
        commit();
        bumpSp();
      });

      E.wildSurge.addEventListener('click', function () { openSurge(); });

      E.addSpell.addEventListener('click', function () { openGrimoire(S.selected); });

      root.querySelector('.sbar').addEventListener('click', function (ev) {
        var m = ev.target.closest('.mini[data-act]');
        if (!m) return;
        var act = m.dataset.act;
        if (act === 'dc+') { S.dc = saveDC() + 1; S.dcTouched = true; }
        else if (act === 'dc-') { S.dc = Math.max(0, saveDC() - 1); S.dcTouched = true; }
        else if (act === 'sp+') S.sp = Math.min(S.spMax, S.sp + 1);
        else if (act === 'sp-') S.sp = Math.max(0, S.sp - 1);
        commit();
      });

      E.levels.addEventListener('click', function (ev) {
        var bolt = ev.target.closest('.bolt');
        if (bolt) {
          var blv = Number(bolt.dataset.bolt);
          var moved = R.convertSlot({ sp: S.sp, spMax: S.spMax, left: S.left, warlockLeft: S.warlockLeft }, blv, S.warlockLevel);
          if (moved) {
            S.left[blv] = moved.left;
            S.warlockLeft = moved.warlockLeft;
            S.sp = moved.sp;
            commit();
            bumpSp();
          }
          return;
        }

        var pip = ev.target.closest('.pip');
        if (pip) {
          var lv = Number(pip.dataset.lv), n = Number(pip.dataset.n);
          var full = pip.classList.contains('full');
          if (pip.dataset.wl) {
            S.warlockLeft = full ? Math.max(0, S.warlockLeft - 1) : n;
          } else {
            S.left[lv] = full ? Math.max(0, S.left[lv] - 1) : n;
          }
          commit();
          return;
        }
        var lvBtn = ev.target.closest('.mini[data-lvl]');
        if (lvBtn) {
          S.sorcererLevel = Math.max(1, Math.min(20, S.sorcererLevel + Number(lvBtn.dataset.lvl)));
          commit();
          return;
        }
        var eb = ev.target.closest('.edit .mini');
        if (eb) {
          var l = Number(eb.dataset.lv);
          var d = eb.dataset.edit === 'add' ? 1 : -1;
          if (eb.dataset.wl) {
            var wBefore = S.warlockMax;
            S.slotsTouched = true;
            S.warlockMax = Math.max(0, Math.min(9, wBefore + d));
            if (S.warlockMax > wBefore) S.warlockLeft = Math.min(S.warlockMax, S.warlockLeft + (S.warlockMax - wBefore));
            else S.warlockLeft = Math.min(S.warlockLeft, S.warlockMax);
          } else {
            var before = S.max[l] || 0;
            S.slotsTouched = true;
            S.max[l] = Math.max(0, Math.min(9, before + d));
            if (S.max[l] > before) S.left[l] = Math.min(S.max[l], (S.left[l] || 0) + (S.max[l] - before));
            else S.left[l] = Math.min(S.left[l], S.max[l]);
          }
          commit();
          return;
        }
        var down = ev.target.closest('.down');
        if (down) {
          S.selected = Number(down.dataset.lv);
          commit();
          E.spellList.scrollTop = 0;
          return;
        }
        var row = ev.target.closest('.lv');
        if (row && row.dataset.lv !== undefined) {
          S.selected = Number(row.dataset.lv);
          commit();
          E.spellList.scrollTop = 0;
        }
      });

      E.spellList.addEventListener('click', function (ev) {
        if (dragged) { dragged = false; return; }
        var card = ev.target.closest('.card');
        if (card) openSpell(card.dataset.name);
      });

      /* The cards can be dragged to reorder them, the way the feature cards
         are. A press that turns into a move carries the card, a press that
         ends straight away is a tap. */

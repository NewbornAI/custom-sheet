  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
  overflow:hidden;
}

.app{
  height:100vh;
  height:100dvh;
  max-height:100dvh;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:9px 10px 10px;
  padding:calc(env(safe-area-inset-top) + 9px) 10px calc(env(safe-area-inset-bottom) + 10px);
  background:
    radial-gradient(130% 55% at 50% -8%, rgba(155,123,255,.20), transparent 62%),
    radial-gradient(100% 45% at 50% 112%, rgba(110,155,255,.12), transparent 60%),
    var(--void);
}

/* ---- header ---- */

.head{display:flex;align-items:center;gap:9px;min-height:30px;flex:0 0 auto}

.sigil{width:22px;height:22px;color:var(--arcane);flex:0 0 auto;opacity:.9}

.title{
  margin:0;
  flex:1 1 auto;
  min-width:0;
  font-family:var(--display);
  font-weight:700;
  font-size:24px;
  font-size:clamp(19px,5.6vw,26px);
  line-height:1.05;
  letter-spacing:.01em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.ac{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:5px;
  padding:4px 9px;
  min-height:28px;
  border:1px solid var(--edge);
  border-radius:999px;
  background:rgba(255,255,255,.03);
  font-size:10.5px;
  letter-spacing:.08em;
  color:var(--muted);
  cursor:pointer;
}
.ac input{
  width:26px;
  padding:0;
  border:0;
  background:none;
  color:var(--ink);
  font:inherit;
  font-variant-numeric:tabular-nums;
  text-align:center;
  outline:none;
  appearance:textfield;
  -moz-appearance:textfield;
}
.ac input::-webkit-outer-spin-button,
.ac input::-webkit-inner-spin-button{appearance:none;-webkit-appearance:none;margin:0}
.ac input::placeholder{color:#5c5778}
.ac:focus-within{border-color:rgba(155,123,255,.6);box-shadow:0 0 0 2px rgba(155,123,255,.15)}

/* ---- power slider ---- */

.slider{flex:0 0 auto}

input[type=range]{
  -webkit-appearance:none;
  appearance:none;
  display:block;
  width:100%;
  height:28px;
  margin:0;
  padding:0;
  background:transparent;
}
input[type=range]:focus-visible{outline:2px solid var(--arcane);outline-offset:3px;border-radius:6px}
input[type=range]::-webkit-slider-runnable-track{
  height:4px;
  border-radius:2px;
  background:linear-gradient(90deg,var(--arcane) 0 var(--fill,0%),rgba(255,255,255,.13) var(--fill,0%) 100%);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:26px;
  height:26px;
  margin-top:-11px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.42);
  background:radial-gradient(circle at 34% 28%,#dccaff,#8a68f5 58%,#5a3fd2);
  box-shadow:0 3px 10px rgba(0,0,0,.6);
}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.13)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--arcane)}
input[type=range]::-moz-range-thumb{
  width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.42);
  background:#8a68f5;box-shadow:0 3px 10px rgba(0,0,0,.6);
}

.stops{position:relative;height:15px}
.stop{
  position:absolute;
  top:0;
  transform:translateX(-50%);
  padding:1px 2px;
  border:0;
  background:none;
  color:#615c7d;
  font-family:var(--sans);
  font-size:10px;
  letter-spacing:.06em;
  cursor:pointer;
  white-space:nowrap;
}
.stop.on{color:var(--arcane);font-weight:600}
.stop:focus-visible{outline:2px solid var(--arcane);outline-offset:1px;border-radius:3px}

/* ---- toggle chips ---- */

.chips{display:flex;gap:6px;flex:0 0 auto;overflow:hidden}

.chip{
  flex:0 1 auto;
  min-width:0;
  padding:6px 10px;
  min-height:31px;
  border:1px solid var(--edge);
  border-radius:999px;
  background:rgba(255,255,255,.03);
  color:var(--muted);
  font-family:var(--sans);
  font-size:12px;
  line-height:1;
  letter-spacing:.02em;
  white-space:nowrap;
  cursor:pointer;
  transition:border-color .15s,color .15s,background-color .15s;
}
.chip:focus-visible{outline:2px solid var(--arcane);outline-offset:2px}
.chip[aria-pressed="true"]{
  border-color:rgba(var(--crgb),.55);
  background:rgba(var(--crgb),.12);
  color:rgb(var(--crgb));
}
.chip[hidden]{display:none}

/* ---- view tabs ---- */

.tabs{
  flex:0 0 auto;
  display:flex;
  gap:16px;
  border-bottom:1px solid var(--edge);
}
.tab{
  border:0;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
  padding:2px 0 5px;
  background:none;
  color:var(--muted);
  font-family:var(--sans);
  font-size:12px;
  letter-spacing:.04em;
  cursor:pointer;
}
.tab[aria-selected="true"]{color:var(--arcane);border-bottom-color:var(--arcane)}
.tab:focus-visible{outline:2px solid var(--arcane);outline-offset:2px}

/* ---- views ---- */

.views{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.view{display:none;flex:1 1 auto;min-height:0;flex-direction:column;gap:8px}
.view.on{display:flex}

/* ---- spells ---- */

.wrench{
  flex:0 0 auto;
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  border:1px solid var(--edge);
  border-radius:7px;
  background:rgba(255,255,255,.03);
  color:var(--muted);
  cursor:pointer;
}
.wrench svg{width:15px;height:15px}
.wrench[aria-pressed="true"]{border-color:rgba(155,123,255,.6);color:var(--arcane);background:rgba(155,123,255,.12)}
.wrench[hidden]{display:none}

.sbar{display:flex;gap:8px;align-items:center;flex:0 0 auto;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:3px;font-size:10.5px;color:var(--muted)}
.stat .k{letter-spacing:.08em}
.stat .mini{display:none}
.stat.editing .mini,.stat.live .mini{display:flex}
.stat .v{
  font-family:var(--display);
  font-size:15px;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  min-width:28px;
  text-align:center;
}
.mini{
  width:22px;height:22px;
  border-radius:6px;
  border:1px solid var(--edge);
  background:rgba(255,255,255,.03);
  color:var(--muted);
  font-size:14px;line-height:1;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  padding:0;
  flex:0 0 auto;
}
.mini:active{background:rgba(155,123,255,.2);color:var(--ink)}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.2);color:var(--gold)}100%{transform:scale(1)}}
.stat .v.bump{animation:bump .45s ease-out;display:inline-block}
.tog{
  border:1px solid var(--edge);
  border-radius:999px;
  background:rgba(255,255,255,.03);
  color:var(--muted);
  font-family:var(--sans);
  font-size:10px;
  letter-spacing:.01em;
  padding:5px 8px;
  min-height:25px;
  cursor:pointer;
}
.tog[aria-pressed="true"]{border-color:rgba(255,196,77,.5);background:rgba(255,196,77,.10);color:var(--gold)}
.d20{width:34px;height:34px;padding:0;border:1px solid var(--edge);border-radius:8px;background:rgba(255,255,255,.03);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.d20 svg{width:25px;height:25px;display:block}
.d20.mid{color:#7ad86f;border-color:rgba(122,216,111,.45);background:rgba(122,216,111,.08)}
.d20.hit{color:#ff6b6b;border-color:rgba(255,107,107,.55);background:rgba(255,107,107,.12)}
.tog:disabled{opacity:.4;cursor:default}

.sbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:7px}
.slotstrip{
  flex:0 0 auto;
  --pip-h:16px;
  display:flex;
  align-items:stretch;
  gap:3px;
  padding:2px 0 6px;
  overflow-x:auto;
  scrollbar-width:none;
}
.slotstrip::-webkit-scrollbar{height:0}
.lv{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  padding:3px 1px;
  border-radius:6px;
  cursor:pointer;
  flex:1 1 26px;
  min-width:26px;
}
.lv.on{background:rgba(155,123,255,.12)}
.lv .head{display:flex;align-items:center;gap:1px}
.lv .n{font-size:11px;color:var(--muted);line-height:1}
.lv.on .n{color:var(--arcane)}
.bolt{
  width:100%;
  max-width:28px;
  height:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  border:1px solid transparent;
  border-radius:5px;
  background:none;
  color:var(--lightning);
  cursor:pointer;
}
.bolt svg{width:12px;height:12px;display:block}
.bolt:not(:disabled):active{background:rgba(255,212,71,.2);color:#fff3c4}
.bolt:disabled{opacity:.55;cursor:default}
.bolt:focus-visible{outline:2px solid var(--arcane);outline-offset:1px}
.boltspace{width:100%;max-width:28px;height:17px;flex:0 0 auto}
.down{
  width:100%;
  max-width:28px;
  height:17px;
  margin-top:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  border:1px solid transparent;
  border-radius:5px;
  background:none;
  color:#7a7499;
  cursor:pointer;
}
.down svg{width:13px;height:13px;display:block}
.down:active{color:var(--arcane);background:rgba(155,123,255,.16)}
.down:focus-visible{outline:2px solid var(--arcane);outline-offset:1px}
.lv.editing .bolt,.lv.editing .down,.lv.editing .boltspace{display:none}
.pip{
  width:100%;
  height:var(--pip-h);
  border-radius:999px;
  border:1px solid #3a3454;
  background:transparent;
  flex:0 0 auto;
  padding:0;
  cursor:pointer;
}
.pip.full{background:var(--arcane);border-color:var(--arcane)}
.pip.wl{border-color:rgba(84,207,196,.4)}
.pip.wl.full{background:#54cfc4;border-color:#54cfc4}
.lv .plus{font-size:9px;color:#4f4a6b;flex:0 0 auto}
.lv.dim{opacity:.35}
.lv .edit{display:none;gap:3px;flex:0 0 auto;flex-wrap:wrap;justify-content:center}
.lv.editing .edit{display:flex}
.lv.editing .pips{display:none}
.pips{display:flex;flex-direction:column;align-items:stretch;gap:2px;width:100%}
.wlgroup{display:flex;flex-direction:column;align-items:stretch;gap:2px;width:100%;margin-top:4px}
.lv .val{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.slotstrip.editing{gap:2px}
.slotstrip.editing .lv{flex:0 0 auto;width:28px;padding:3px 1px}
.slotstrip.editing .edit{flex-direction:column;align-items:center;gap:2px}

.listhead{flex:0 0 auto;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.listhead .t{color:var(--ink);font-size:12px}
.listhead .mini{margin-left:auto}

.grimoire{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px;overflow-y:auto;scrollbar-width:none}
.grimoire::-webkit-scrollbar{width:0}
.card{
  border:1px solid var(--edge);
  border-radius:5px;
  background:rgba(255,255,255,.03);
  padding:7px 8px;
  cursor:pointer;
  touch-action:pan-y;
}
.card .top{display:flex;align-items:center;gap:8px}
.card .t{flex:1 1 auto;min-width:0;font-size:12.5px;color:var(--ink);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .m{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:8px;row-gap:3px;margin-top:4px}
.f{display:grid;grid-template-columns:3.8em minmax(0,1fr);column-gap:4px;align-items:baseline;font-size:9.5px;line-height:1.4}
.f .k{color:#635e7e}
.f .v{color:var(--muted);overflow-wrap:anywhere}
.f .v.cmp{color:var(--arcane);letter-spacing:.08em}
.f .v.rit{color:var(--gold)}
.f .v.yes{color:#b9b3d6}
.card .src{flex:0 0 auto;font-size:9.5px;color:var(--muted);border:1px solid var(--edge);border-radius:3px;padding:0 4px;white-space:nowrap}
.card .src.sorc{color:#ff8fb0;border-color:rgba(255,111,168,.45);background:rgba(255,111,168,.10)}
.card .src.warlock{color:#9dbcff;border-color:rgba(110,155,255,.45);background:rgba(110,155,255,.10)}
.card .src.izzet{color:#e6ebff;border-color:rgba(140,160,255,.5);background:linear-gradient(90deg,rgba(110,155,255,.26) 0 50%,rgba(255,111,168,.26) 50% 100%)}
.card .src.elf{color:#8fe084;border-color:rgba(122,216,111,.45);background:rgba(122,216,111,.10)}
.card.dragging{opacity:.95;border-color:var(--arcane);box-shadow:0 10px 24px rgba(0,0,0,.55)}
.card.ghost{opacity:.25}
.empty{font-size:11px;color:#615c7d;padding:8px 2px;line-height:1.5}

/* ---- sheet ---- */

.sheet{
  position:fixed;
  inset:0;
  background:var(--void);
  z-index:30;
  display:flex;
  flex-direction:column;
}
.sheet[hidden]{display:none}
.sheet-in{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  padding:14px 14px calc(env(safe-area-inset-bottom) + 24px);
  display:flex;
  flex-direction:column;
  gap:10px;
  position:relative;
}
.sheet h2{font-family:var(--display);font-size:20px;font-weight:700;margin:0;padding-right:34px}
.sheet-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px;row-gap:5px;margin-top:2px}
.sheet-meta.one{grid-template-columns:minmax(0,1fr)}
.sheet-meta.one span{font-size:9.5px;font-style:italic;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-meta .f{font-size:12px;grid-template-columns:4.4em minmax(0,1fr)}
.sheet-meta .f.wide{grid-column:1 / -1}
.sheet-meta .src{color:var(--muted);border:1px solid var(--edge);border-radius:3px;padding:0 4px;white-space:nowrap;justify-self:start}
.sheet-meta .src.sorc{color:#ff8fb0;border-color:rgba(255,111,168,.45);background:rgba(255,111,168,.10)}
.sheet-meta .src.warlock{color:#9dbcff;border-color:rgba(110,155,255,.45);background:rgba(110,155,255,.10)}
.sheet-meta .src.izzet{color:#dde4ff;border-color:rgba(140,160,255,.45);background:linear-gradient(90deg,rgba(110,155,255,.20) 0 50%,rgba(255,111,168,.20) 50% 100%)}
.sheet-meta .src.elf{color:#8fe084;border-color:rgba(122,216,111,.45);background:rgba(122,216,111,.10)}
.sheet-text{font-size:13px;line-height:1.6;color:#d9d5ec}
.sheet-text .tdmg{color:#ff6b6b}
.sheet-text .tsav{color:#6e9bff}
.sheet-text .tcond{border-bottom:1px dotted rgba(255,196,77,.6);cursor:pointer}
.sheet-text .tcond:active{color:var(--gold)}
.sheet-text p{margin:0 0 9px}
.sheet-text h3{font-family:var(--display);font-size:14px;font-weight:700;color:var(--arcane);margin:14px 0 5px}
.sheet-text ul{margin:0 0 9px;padding-left:18px}
.sheet-text li{margin-bottom:4px}
.sheet-text table{width:100%;border-collapse:collapse;font-size:11.5px;margin:0 0 10px}
.sheet-text th,.sheet-text td{border:1px solid var(--edge);padding:5px 7px;text-align:left;vertical-align:top}
.sheet-text th{color:var(--muted);font-weight:600}
.tcap{font-size:10.5px;color:var(--muted);margin-bottom:3px}
.sheet-list{display:flex;flex-direction:column;gap:4px}
.sheet-list[hidden]{display:none}
.sheet-list .row{display:flex;flex-direction:column;align-items:stretch;gap:4px;border:1px solid var(--edge);border-radius:5px;padding:6px 8px;background:rgba(255,255,255,.02)}
.sheet-list .row .g1{display:flex;align-items:center;gap:8px;min-width:0}
.sheet-list .row .gn{flex:1 1 auto;min-width:0;font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-list .row .gn.tappable{cursor:pointer}
.sheet-list .row .gn.tappable:active{color:var(--arcane)}
.sheet-list .row .gadd{width:24px;height:24px;border-radius:6px;border:1px solid var(--edge);background:rgba(255,255,255,.03);color:var(--arcane);font-size:15px;line-height:1;cursor:pointer;flex:0 0 auto;padding:0}
.sheet-list .row .g2{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.sheet-list .row .gcls{border:1px solid var(--edge);border-radius:3px;background:none;color:#6f6a8d;font-family:var(--sans);font-size:8.5px;letter-spacing:.06em;line-height:1;padding:3px 4px;cursor:pointer}
.sheet-list .row .gcls.on{border-color:rgba(122,216,111,.5);background:rgba(122,216,111,.13);color:#8fe084}
.sheet-list .row .gs{font-size:9.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
.sheet-actions{display:flex;gap:8px}
.sheet-actions button{
  border:1px solid var(--edge);
  border-radius:7px;
  background:rgba(255,255,255,.03);
  color:var(--muted);
  font-family:var(--sans);
  font-size:11px;
  padding:7px 11px;
  cursor:pointer;
}
.sheet-actions button.danger{color:#d08a9c;border-color:rgba(208,138,156,.4)}
.sheet-x{
  position:absolute;
  top:8px;right:10px;
  width:28px;height:28px;
  border:0;background:none;
  color:var(--muted);
  font-size:20px;line-height:1;
  cursor:pointer;
}
.gsbar{display:flex;align-items:center;gap:6px}
.gsbar .sheet-search{flex:1 1 auto;min-width:0}
.gtog{
  flex:0 0 auto;
  border:1px solid var(--edge);
  border-radius:7px;
  background:rgba(255,255,255,.03);
  color:var(--muted);
  font-family:var(--sans);
  font-size:10.5px;
  letter-spacing:.02em;
  padding:7px 9px;
  cursor:pointer;
  white-space:nowrap;
}
.gtog[aria-pressed="false"]{border-color:rgba(122,216,111,.45);background:rgba(122,216,111,.10);color:#8fe084}
.sheet-search{
  border:1px solid var(--edge);
  border-radius:7px;
  background:rgba(255,255,255,.03);
  color:var(--ink);
  font-family:var(--sans);
  font-size:12px;
  padding:7px 9px;
  outline:none;
}
.sheet-search:focus{border-color:rgba(155,123,255,.6)}
.condtip{
  position:absolute;
  left:12px;right:12px;bottom:12px;
  z-index:6;
  padding:10px 12px;
  border:1px solid var(--edge);
  border-radius:8px;
  background:rgba(18,16,30,.97);
  box-shadow:0 10px 30px rgba(0,0,0,.6);
}
.condtip[hidden]{display:none}
.condtip .cthead{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.condtip .ctname{font-family:var(--display);font-size:14px;color:var(--gold)}
.condtip .ctx{margin-left:auto;border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0}
.condtip .ctlink{font-size:11px;color:#9dbcff;word-break:break-all}

/* ---- character sheet ---- */

.charbody{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  scrollbar-width:none;
  display:flex;
  flex-direction:column;
  gap:7px;
}
.charbody::-webkit-scrollbar{width:0}

.csname{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.csname[hidden]{display:none}
.csname .ck{flex:0 0 auto;font-size:9px;letter-spacing:.16em;color:var(--muted)}
.csname .cinput{font-size:17px}

.ctop{display:flex;gap:6px;flex:0 0 auto}
.ctile{
  flex:1 1 0;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:1px;
  padding:5px 7px 6px;
  border:1px solid var(--edge);
  border-radius:8px;
  background:rgba(255,255,255,.03);
}
.ctile .ck{font-size:9px;letter-spacing:.16em;color:var(--muted)}
.ctile .cinput{text-align:center}
.cinput{
  width:100%;
  min-width:0;
  padding:0;
  border:0;
  background:none;
  color:var(--ink);
  font-family:var(--display);
  font-size:19px;
  font-weight:700;
  line-height:1.15;
  font-variant-numeric:tabular-nums;
  outline:none;
  appearance:textfield;
  -moz-appearance:textfield;
}
.cinput::-webkit-outer-spin-button,
.cinput::-webkit-inner-spin-button{appearance:none;-webkit-appearance:none;margin:0}
.cinput::placeholder{color:#4f4a6b}
.cinput:focus{color:var(--arcane)}

.hpstrip{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:6px;

.cshead{

}

}

.prow{

}
.prow .dot{width:6px;height:6px;flex:0 0 auto;border-radius:50%;border:1px solid #453f63}

.charbody.editing .prow{border-color:var(--edge);cursor:pointer}
.charbody.editing .prow.prof{border-color:rgba(255,196,77,.35);background:rgba(255,196,77,.06)}
.charbody.editing .prow.exp{border-color:rgba(255,196,77,.55);background:rgba(255,196,77,.12)}

.cshead .mini{margin-left:auto}
.flist{display:flex;flex-direction:column;gap:2px;flex:0 0 auto}
.frow{display:flex;align-items:center;gap:6px;min-width:0;padding:2px 4px;border:1px solid transparent;border-radius:5px}
.frow .fname{flex:1 1 auto;min-width:0;background:none;border:0;outline:none;color:#b9b3d6;font-family:var(--sans);font-size:11px;padding:0}

.frow .fuse{flex:0 0 auto;min-width:1.5em;border:1px solid var(--edge);border-radius:3px;background:none;color:var(--ink);font-family:var(--display);font-size:13px;padding:1px 2px;cursor:pointer}
.frow .fof{flex:0 0 auto;color:#5c5778;font-size:11px}
.frow .fmax{flex:0 0 auto;width:2.1em;border:0;background:none;color:var(--muted);font-family:var(--display);font-size:12px;text-align:right;outline:none;padding:0}
.frow .fdel{flex:0 0 auto;width:20px;height:20px;border:0;background:none;color:#6f6a8d;font-size:15px;line-height:1;cursor:pointer;padding:0;display:none}
.frow .feye{flex:0 0 auto;width:20px;height:20px;border:0;background:none;color:#6f6a8d;cursor:pointer;padding:0;display:none;align-items:center;justify-content:center}
.frow .feye svg{width:14px;height:14px;display:block}
.frow.hidden{display:none}
.charbody.editing .frow{border-color:var(--edge)}
.charbody.editing .frow .fdel,.charbody.editing .frow .feye{display:flex}
.charbody.editing .frow.hidden{display:flex}
.charbody.editing .frow.hidden .fname,.charbody.editing .frow.hidden .ftag,.charbody.editing .frow.hidden .fuse,.charbody.editing .frow.hidden .fof,.charbody.editing .frow.hidden .fmax{opacity:.4}

.charfoot{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;padding-top:2px}
.charfoot .note{margin:0;min-height:13px}
.spent{
  position:fixed;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom) + 14px);
  transform:translateX(-50%) translateY(6px);
  z-index:45;
  padding:7px 14px;
  border:1px solid rgba(255,196,77,.5);
  border-radius:999px;
  background:rgba(28,22,8,.95);
  color:var(--gold);
  font-size:11px;
  letter-spacing:.03em;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:opacity .22s, transform .22s;
}
.spent.on{opacity:1;transform:translateX(-50%) translateY(0)}

.fcards{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.fcard{border:1px solid var(--edge);border-radius:5px;background:rgba(255,255,255,.03);padding:7px 8px}
.fcard .top{display:flex;align-items:center;gap:8px}
.fcard .t{flex:1 1 auto;min-width:0;font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.fcard .t:active{color:var(--arcane)}
.fcard .fm{display:flex;align-items:flex-start;gap:6px;margin-top:3px;font-size:10px;color:var(--muted);line-height:1.45}
.fcard .fm .fdesc{flex:1 1 auto;min-width:0}
.fcard .src{flex:0 0 auto;font-size:9.5px;color:var(--muted);border:1px solid var(--edge);border-radius:3px;padding:0 4px;white-space:nowrap}
.fcard .src.sorc{color:#ff8fb0;border-color:rgba(255,111,168,.45);background:rgba(255,111,168,.10)}
.fcard .src.warlock{color:#9dbcff;border-color:rgba(110,155,255,.45);background:rgba(110,155,255,.10)}
.fcard .src.izzet{color:#e6ebff;border-color:rgba(140,160,255,.5);background:linear-gradient(90deg,rgba(110,155,255,.26) 0 50%,rgba(255,111,168,.26) 50% 100%)}
.fcard .src.elf{color:#8fe084;border-color:rgba(122,216,111,.45);background:rgba(122,216,111,.10)}
.fcard .feye{flex:0 0 auto;width:18px;height:18px;border:0;background:none;color:#6f6a8d;cursor:pointer;padding:0;display:none;align-items:center;justify-content:center}
.fcard .feye svg{width:12px;height:12px;display:block}
.fnew{display:flex;flex-wrap:wrap;gap:6px}
.fnewtype{border:1px solid var(--edge);border-radius:6px;background:none;color:var(--muted);font-family:var(--sans);font-size:11px;padding:7px 11px;cursor:pointer}
.fnewtype.on{border-color:rgba(122,216,111,.5);background:rgba(122,216,111,.12);color:#8fe084}
.fcard.dragging{opacity:.95;border-color:var(--arcane);box-shadow:0 10px 24px rgba(0,0,0,.55)}
.fcard .fdel{flex:0 0 auto;width:18px;height:18px;border:0;background:none;color:#d08a9c;cursor:pointer;padding:0;display:none;align-items:center;justify-content:center;font-size:16px;line-height:1}
.charbody.editing .fcard .feye,.charbody.editing .fcard .fdel{display:flex}
.fcard .fconfirm{display:none;align-items:center;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid var(--edge);font-size:10.5px;color:var(--muted)}
.fcard.confirming .fconfirm{display:flex}
.fcard .fconfirm button{border:1px solid var(--edge);border-radius:5px;background:none;color:var(--muted);font-family:var(--sans);font-size:10.5px;padding:4px 9px;cursor:pointer}
.fcard .fconfirm button.yes{border-color:rgba(208,138,156,.5);color:#d08a9c}
.fcard .fuses{flex:0 0 auto;font-family:var(--display);font-size:12px;color:var(--arcane);border:1px solid var(--edge);border-radius:4px;background:none;padding:3px 6px;cursor:pointer;font-variant-numeric:tabular-nums}
.fcard .fusesin{display:none;flex:0 0 auto;width:2.8em;border:1px solid var(--edge);border-radius:4px;background:none;color:var(--ink);font-family:var(--display);font-size:12px;padding:3px 3px;text-align:center;font-variant-numeric:tabular-nums}
.fcard .fmaxin{display:none;flex:0 0 auto;width:2.8em;border:1px solid var(--edge);border-radius:4px;background:none;color:var(--muted);font-family:var(--display);font-size:12px;padding:3px 3px;text-align:center;font-variant-numeric:tabular-nums}
.fcard .fslash{display:none;flex:0 0 auto;color:#5c5778;font-size:11px}
.fcard .frec{display:none;flex:0 0 auto;font-family:var(--display);font-size:12px;color:var(--muted)}
.charbody.editing .fcard .fuses{display:none}
.charbody.editing .fcard .fusesin,.charbody.editing .fcard .fmaxin,.charbody.editing .fcard .fslash{display:block}
.charbody.editing .fcard .frec{display:inline}
.fcard .fuses.sp{color:var(--gold);border-color:rgba(255,196,77,.35)}
.fcard.hidden{display:none}
.charbody.editing .fcard.hidden{display:block;opacity:.45}

.charfoot .rests{display:flex;gap:6px}
.rest{
  flex:1 1 0;
  padding:9px 6px;
  border:1px solid var(--edge);
  border-radius:8px;
  background:rgba(255,255,255,.03);
  color:var(--muted);
  font-family:var(--sans);
  font-size:11px;
  letter-spacing:.06em;
  cursor:pointer;
}
.rest:active{border-color:rgba(155,123,255,.5);color:var(--arcane);background:rgba(155,123,255,.12)}
.note{flex:0 0 auto;margin:0;font-size:10.5px;color:#7d7899}

/* ---- build summary ---- */

.summary{
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  gap:1px;
  font-size:10.5px;
  line-height:1.3;
  color:#7d7899;
}
.summary em{font-style:normal}
.summary b{color:var(--ink);font-weight:600}
.ghostnum{font-size:15px;color:#6f6a8d}
.ghostroll{color:#6f6a8d}

/* ---- result board ---- */

.board{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:none;
}
.board::-webkit-scrollbar{width:0;height:0}

.grid{
  flex:1 1 auto;
  display:grid;
  grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));
  gap:6px;
  align-content:stretch;
}

.cell{
  display:flex;
  flex-direction:column;
  gap:5px;
  padding:8px 8px 9px;
  border:1px solid var(--edge);
  border-radius:5px;
  background:
    radial-gradient(120% 55% at 50% 54%,rgba(var(--beam,155,123,255),.22),transparent 72%),
    linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
  min-width:0;
  animation:rise .22s ease-out both;
  animation-delay:calc(var(--i,0) * 45ms);
}
.cell.crit{
  border-color:rgba(255,196,77,.55);
  box-shadow:0 0 0 1px rgba(255,196,77,.14),0 8px 20px rgba(255,170,40,.10);
}
.cell.ghost{opacity:.55;animation:none}

@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.atk{display:flex;align-items:baseline;gap:4px}
.at{
  font-family:var(--display);
  font-weight:700;
  font-size:27px;
  line-height:1;
  font-variant-numeric:tabular-nums;
}
.am{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}

.badge{
  margin-left:auto;
  align-self:center;
  padding:2px 5px;
  border:1px solid;
  border-radius:3px;
  font-size:9px;
  letter-spacing:.1em;
  line-height:1.2;
}
.badge.crit{color:var(--gold);border-color:rgba(255,196,77,.5);background:rgba(255,196,77,.10)}
.badge.hit{color:#a9b6d8;border-color:rgba(169,182,216,.34);background:rgba(169,182,216,.08)}
.badge.miss{color:#d08a9c;border-color:rgba(208,138,156,.45);background:rgba(208,138,156,.10)}

.d20{display:flex;gap:4px;font-size:11px;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
.d20 span{padding:2px 4px;border-radius:3px;background:rgba(255,255,255,.05)}
.d20 .kept{color:var(--ink);background:rgba(155,123,255,.20);box-shadow:inset 0 0 0 1px rgba(155,123,255,.5)}

.beam{
  flex:1 1 auto;
  display:flex;
  justify-content:center;
  min-height:10px;
}
.beam::before{
  content:'';
  width:3px;
  border-radius:2px;
  background:linear-gradient(180deg,rgba(var(--beam,155,123,255),.5),rgba(var(--beam,155,123,255),.14));
  box-shadow:0 0 10px rgba(var(--beam,155,123,255),.35);
}

.dmg{
  padding-top:6px;
  border-top:1px solid var(--edge);
  display:flex;
  flex-direction:column;
  gap:5px;
}
.cell.miss .dmg{opacity:.38}

.dtop{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.dt{
  font-family:var(--display);
  font-weight:700;
  font-size:23px;
  line-height:1;
  font-variant-numeric:tabular-nums;
}
.kinds{display:flex;gap:5px;flex-wrap:wrap}
.kinds em{font-style:normal;font-size:9.5px;letter-spacing:.03em}

.force{color:var(--force)}
.fire{color:var(--fire)}
.lightning{color:var(--lightning)}
.necrotic{color:var(--necrotic)}

.dice{display:flex;gap:7px;flex-wrap:wrap}
.g{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.g .lbl{font-size:10px;line-height:1.1;color:var(--muted);font-variant-numeric:tabular-nums}
.g .roll{font-size:11.5px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.g .roll.tight{font-size:10px}
.g.flat .lbl{color:var(--muted)}

/* ---- tally ---- */

.tally{
  flex:0 0 auto;
  display:flex;
  align-items:baseline;
  gap:6px;
  min-height:22px;
  font-size:10.5px;
  color:var(--muted);
  overflow:hidden;
}
.tally .big{
  font-family:var(--display);
  font-weight:700;
  font-size:20px;
  line-height:1;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.tally em{font-style:normal}

/* ---- cast ---- */

.cast{
  position:relative;
  flex:0 0 auto;
  width:100%;
  height:92px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:16px;
  background:linear-gradient(180deg,#9573ff 0%,#5a39d6 100%);
  color:#fff;
  font-family:var(--display);
  font-weight:700;
  font-size:34px;
  letter-spacing:.16em;
  padding-left:.16em;
  text-shadow:0 1px 10px rgba(40,20,90,.5);
  box-shadow:0 12px 30px rgba(92,58,220,.32),inset 0 1px 0 rgba(255,255,255,.32);
  cursor:pointer;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
  overflow:hidden;
}
.cast:focus-visible{outline:2px solid #fff;outline-offset:3px}
.cast:active{transform:translateY(1px);box-shadow:0 5px 16px rgba(92,58,220,.34),inset 0 1px 0 rgba(255,255,255,.25)}
.cast .mark{
  position:absolute;
  right:-14px;
  top:50%;
  transform:translateY(-50%);
  width:150px;
  height:150px;
  color:#fff;
  opacity:.12;
  pointer-events:none;
}

@media (prefers-reduced-motion:reduce){
  .cell{animation:none}
  .cast{transition:none}
  .stat .v.bump{animation:none}
}

@media (min-height:760px){
  .cast{height:120px}
}
</style>

  'use strict';

  var ATTACK_MOD = 9;
  var NATURAL_CRIT = 20;
  var CURSE_CRIT = 19;
  var CURSE_BONUS = 4;
  var ADVANTAGE_DICE = 3;

  var POWERS = [
    { id: 'eb',  name: 'Eldritch blast',  short: 'EB',  attacks: 3, dice: [{ n: 1, s: 10, type: 'force' }], flat: 5 },
    { id: 'sr2', name: 'Scorching ray 2', short: 'SR2', attacks: 3, dice: [{ n: 2, s: 6, type: 'fire' }],   flat: 0 },
    { id: 'sr3', name: 'Scorching ray 3', short: 'SR3', attacks: 4, dice: [{ n: 2, s: 6, type: 'fire' }],   flat: 0 },
    { id: 'sr4', name: 'Scorching ray 4', short: 'SR4', attacks: 5, dice: [{ n: 2, s: 6, type: 'fire' }],   flat: 0 },
    { id: 'sr5', name: 'Scorching ray 5', short: 'SR5', attacks: 6, dice: [{ n: 2, s: 6, type: 'fire' }],   flat: 0 }

    hex:      { dice: [{ n: 1, s: 6, type: 'necrotic' }] },
    elem:     { dice: [{ n: 2, s: 8, type: 'lightning' }] },
    elemPlus: { dice: [{ n: 3, s: 8, type: 'lightning' }] }
  };

  function die(rng, sides) { return 1 + Math.floor(rng() * sides); }

  function dice(rng, n, sides) {
    var out = [], i;
    for (i = 0; i < n; i++) out.push(die(rng, sides));
    return out;
  }

  function sum(list) {
    var total = 0, i;
    for (i = 0; i < list.length; i++) total += list[i];
    return total;
  }

  function powerOf(id) {
    for (var i = 0; i < POWERS.length; i++) if (POWERS[i].id === id) return POWERS[i];
    return POWERS[0];

  function rollVolley(state, rng) {
    rng = rng || Math.random;
    state = state || {};

    var power = powerOf(state.power);
    var critFloor = state.curse ? CURSE_CRIT : NATURAL_CRIT;
    var flat = power.flat + (state.curse ? CURSE_BONUS : 0);
    var hasAc = state.ac !== null && state.ac !== undefined && state.ac !== '';

    for (i = 0; i < power.attacks; i++) {
      var rolls = state.advantage ? dice(rng, ADVANTAGE_DICE, 20) : dice(rng, 1, 20);
      var kept = Math.max.apply(null, rolls);
      var total = kept + ATTACK_MOD;
      var crit = kept >= critFloor;
      var mult = crit ? 2 : 1;

      var sources = power.dice.slice();
      if (state.hex) sources = sources.concat(EXTRAS.hex.dice);
      if (state.elem) sources = sources.concat(state.elemPlus ? EXTRAS.elemPlus.dice : EXTRAS.elem.dice);

      for (j = 0; j < sources.length; j++) {
        var count = sources[j].n * mult;
        groups.push({
          label: count + 'd' + sources[j].s,
          type: sources[j].type,
          rolls: dice(rng, count, sources[j].s)
        });
      }

      var rolled = 0;
      for (k = 0; k < groups.length; k++) rolled += sum(groups[k].rolls);

      beams.push({
        index: i,
        rolls: rolls,
        kept: kept,
        total: total,
        crit: crit,
        hit: hasAc ? total >= Number(state.ac) : null,
        groups: groups,

  function tally(volley, ac) {

    for (i = 0; i < volley.beams.length; i++) {
      var beam = volley.beams[i];
      if (beam.hit === false) continue;
      hits++;
      if (beam.crit) crits++;
      total += beam.damage;
      flatTotal += beam.flat;
      for (j = 0; j < beam.groups.length; j++) {
        g = beam.groups[j];
        if (!(g.type in byType)) { byType[g.type] = 0; order.push(g.type); }

  function rollSurge(rows, rng) {
    rng = rng || Math.random;
    rows = rows || [];
    if (!rows.length) throw new Error('the surge table is empty');
    var roll = 1 + Math.floor(rng() * 100);
    var row = null, i;
    for (i = 0; i < rows.length; i++) {
      if (roll >= rows[i].from && roll <= rows[i].to) { row = rows[i]; break; }
    }

    var specs = diceIn(row.text), rolled = [], j, values;
    for (j = 0; j < specs.length; j++) {
      values = dice(rng, specs[j].count, specs[j].sides);
      rolled.push({ label: specs[j].label, values: values, total: sum(values) });
    }
    return { roll: roll, from: row.from, to: row.to, text: row.text, dice: rolled };
  }

     The warlock slots go first, they are the scarcer ones.
     Returns the new counts, or null when the slot cannot be turned. */
  function convertSlot(spell, lv) {
    spell = spell || {};
    lv = Number(lv);
    var sp = Number(spell.sp) || 0;
    var spMax = Number(spell.spMax) || 0;
    var left = (spell.left || {})[lv] || 0;
    var warlockLeft = Number(spell.warlockLeft) || 0;
    if (!(lv >= 1) || sp >= spMax) return null;
    var useWarlock = lv === WARLOCK_LEVEL && warlockLeft > 0;
    if (!useWarlock && left <= 0) return null;
    return {
      left: useWarlock ? left : left - 1,
      warlockLeft: useWarlock ? warlockLeft - 1 : warlockLeft,
      usedWarlock: useWarlock,
      sp: Math.min(spMax, sp + lv),
      gained: Math.min(spMax, sp + lv) - sp

  }

  root.Rules = {
    ATTACK_MOD: ATTACK_MOD,
    POWERS: POWERS,
    EXTRAS: EXTRAS,
    LEVELS: LEVELS,
    WARLOCK_LEVEL: WARLOCK_LEVEL,
    powerOf: powerOf,

    tally: tally,
    diceIn: diceIn,

    { key: 'sleightOfHand', name: 'Sleight of hand', ab: 'dex' },

  var CHAR_DEFAULTS = {

    ),

  var state = load();

  /* ---- state ---- */

  function load() {
    var saved = {};
    try { saved = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { saved = {}; }
    var merged = {};
    Object.keys(DEFAULTS).forEach(function (k) { merged[k] = DEFAULTS[k]; });
    merged.spell = seedSpells(saved.spell || {});
    merged.char = seedChar(saved.char || {});
    Object.keys(DEFAULTS).forEach(function (k) {
      if (Object.prototype.hasOwnProperty.call(saved, k) && saved[k] !== null && saved[k] !== undefined) merged[k] = saved[k];
    });
    if (merged.ac === null || merged.ac === '' || isNaN(Number(merged.ac))) merged.ac = null;
    else merged.ac = Number(merged.ac);
    if (!R.powerOf || merged.power !== R.powerOf(merged.power).id) merged.power = DEFAULTS.power;
    if (!merged.elem) merged.elemPlus = false;
    return merged;
  }

  function esc(text) {
    return String(text === undefined || text === null ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* The marked pieces of a spell text: the damage in red, the saving
     throws in blue, and the conditions, which carry the reference. */
  function markup(text) {
    var out = esc(text);
    out = out.replace(/\[\[d:([^\]]*)\]\]/g, '<span class="tdmg">$1</span>');
    out = out.replace(/\[\[s:([^\]]*)\]\]/g, '<span class="tsav">$1</span>');
    out = out.replace(/\[\[c:([^\]]*)\]\]/g, '<span class="tcond" data-cond="$1" title="https://5e.tools/conditionsdiseases.html">$1</span>');
    return out;
  }

  function seedSpells(saved) {
    var s = {};
    Object.keys(SPELL_DEFAULTS).forEach(function (k) { s[k] = SPELL_DEFAULTS[k]; });
    if (saved && typeof saved === 'object') {
      Object.keys(SPELL_DEFAULTS).forEach(function (k) {
        if (saved[k] !== undefined && saved[k] !== null && typeof saved[k] === typeof SPELL_DEFAULTS[k]) s[k] = saved[k];
      });
      if (saved.classes) { s.classes = {}; Object.keys(saved.classes).forEach(function (k) { s.classes[k] = !!saved.classes[k]; }); }
      if (saved.levelFilter !== undefined) s.levelFilter = !!saved.levelFilter;
      if (saved.max) { s.max = {}; Object.keys(SPELL_DEFAULTS.max).forEach(function (k) { s.max[k] = Number(saved.max[k]) || 0; }); }
      if (saved.left) { s.left = {}; Object.keys(SPELL_DEFAULTS.left).forEach(function (k) { s.left[k] = Number(saved.left[k]) || 0; }); }
    }
    var lists = {};
    LEVELS.forEach(function (lv) {
      var seed = SPELL_SEED.filter(function (n) {
        var s = SPELL_BY_NAME[n];
        return s && s.level === lv;
      });
      var own = (saved.lists && saved.lists[lv]) || null;
      lists[lv] = (own && own.length) ? own.filter(function (n) { return SPELL_BY_NAME[n]; }) : seed;
    });
    s.lists = lists;
    return s;
  }

  /* A proficiency is a number: 0 none, 1 proficient, 2 expertise. The state
     saved before the three states existed held a boolean, so it comes back
     as a plain proficiency. */
  function profValue(value) {
    if (value === true) return 1;
    if (value === false || value === undefined || value === null) return 0;
    var n = Number(value) || 0;
    if (n < 0) return 0;
    if (n > 2) return 2;
    return Math.floor(n);
  }

  /* The character, with the saved values over the defaults. */
  function seedChar(saved) {
    var c = {
      name: '',
      level: CHAR_DEFAULTS.level,
      abilities: {},
      saves: {},
      skills: {},
      features: CHAR_DEFAULTS.features.map(function (f) {
        return {
          key: f.key,
          name: f.name,
          source: f.source || '',
          active: !!f.active,
          recovery: f.recovery,
          bind: f.bind || null,
          max: f.max || 0,
          left: f.left || 0,
          cost: f.cost || '',
          short: (f.short === undefined || f.short === null) ? null : f.short,
          hidden: !!f.hidden
        };
      }),
      init: CHAR_DEFAULTS.init,
      ac: CHAR_DEFAULTS.ac,
      hp: { current: 0, max: 0 },
      dice: (CHAR_DEFAULTS.dice || []).map(function (d) { return { type: d.type, spent: false }; }),
      history: []
    };
    ABILITIES.forEach(function (a) {
      c.abilities[a.key] = CHAR_DEFAULTS.abilities[a.key];
      c.saves[a.key] = CHAR_DEFAULTS.saves[a.key];
    });
    SKILLS.forEach(function (s) { c.skills[s.key] = false; });
    if (saved && typeof saved === 'object') {
      if (typeof saved.name === 'string') c.name = saved.name;
      if (saved.level) c.level = Math.max(1, Math.min(20, Number(saved.level) || CHAR_DEFAULTS.level));
      if (saved.init !== undefined && saved.init !== null) c.init = Number(saved.init) || 0;
      if (saved.ac !== undefined && saved.ac !== null && saved.ac !== '') c.ac = Number(saved.ac) || 0;
      ABILITIES.forEach(function (a) {
        if (saved.abilities && saved.abilities[a.key] !== undefined && saved.abilities[a.key] !== null) {
          c.abilities[a.key] = Math.max(0, Math.min(30, Number(saved.abilities[a.key]) || 0));
        }
        if (saved.saves && saved.saves[a.key] !== undefined) c.saves[a.key] = profValue(saved.saves[a.key]);
      });
      SKILLS.forEach(function (s) {
        if (saved.skills && saved.skills[s.key] !== undefined) c.skills[s.key] = profValue(saved.skills[s.key]);
      });
      if (saved.hp) {
        c.hp.current = Math.max(0, Number(saved.hp.current) || 0);
        c.hp.max = Math.max(0, Number(saved.hp.max) || 0);
      }
      if (saved.dice && saved.dice.length) {
        c.dice = saved.dice.map(function (d) { return { type: Number(d.type) || 6, spent: !!d.spent }; });
      }
      if (saved.features && saved.features.length) {
        var savedByKey = {};
        saved.features.forEach(function (f) { savedByKey[f.key] = f; });
        c.features = c.features.map(function (f) {
          var s = savedByKey[f.key];
          if (!s) return f;
          var copy = Object.assign({}, f);
          if (s.name) copy.name = s.name;
          if (s.max !== undefined) copy.max = Math.max(0, Number(s.max) || 0);
          if (s.left !== undefined) copy.left = Math.max(0, Number(s.left) || 0);
          if (s.recovery !== undefined) copy.recovery = s.recovery;
          if (s.cost !== undefined) copy.cost = s.cost;
          if (s.short !== undefined) copy.short = s.short;
          /* the hidden flag follows the data, unless the player moved it */
          copy.hidden = s.toggled ? !!s.hidden : !!f.hidden;
          return copy;
        });
        /* the features that are not in the seed any more */
        saved.features.forEach(function (f) {
          var known = c.features.some(function (x) { return x.key === f.key; });
          if (!known) c.features.push(f);
        });
      }
      if (saved.history && saved.history.length) {
        c.history = saved.history.filter(function (h) { return h && typeof h === 'object'; }).slice(-60);
      }
    }
    return c;
  }

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
  }

  function setState(patch) {
    Object.keys(patch).forEach(function (k) { state[k] = patch[k]; });
    if (!state.elem) state.elemPlus = false;
    volley = null;
    save();
    render();
  }

  /* ---- controls ---- */

  el.power.addEventListener('input', function () {
    var p = R.POWERS[Number(el.power.value)];
    setState({ power: p.id });
  });

  el.ac.addEventListener('input', function () {
    var v = el.ac.value.trim();
    setState({ ac: v === '' ? null : Number(v) });
  });

  R.POWERS.forEach(function (p, i) {
    var stop = document.createElement('button');
    stop.type = 'button';
    stop.className = 'stop';
    stop.textContent = p.short;
    stop.style.left = 'calc(13px + (100% - 26px) * ' + (i / (R.POWERS.length - 1)) + ')';

    b.style.setProperty('--crgb', chip.rgb);

      var next = !state[chip.key];
      var patch = {};
      patch[chip.key] = next;
      if (chip.key === 'elem' && !next) patch.elemPlus = false;
      setState(patch);

    el.chips.appendChild(b);

  el.tabVolley.addEventListener('click', function () { setView('volley'); });
  el.tabSpells.addEventListener('click', function () { setView('spells'); });
  el.tabChar.addEventListener('click', function () { setView('char'); });
  el.tabFeatures.addEventListener('click', function () { setView('features'); });

  el.cast.addEventListener('click', function () {
